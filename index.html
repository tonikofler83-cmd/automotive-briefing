ne-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date": "2026-08-03", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Elektroauto-Markt startet 2026 mit 20 Prozent BEV-Anteil", "text": "Der Anteil rein batterieelektrischer Neuwagen in der EU stieg von Januar bis Mai 2026 auf 20 Prozent, nach 15,3 Prozent im Vorjahreszeitraum. Bei anhaltendem Trend könnten BEVs bis Jahresende einen Marktanteil von rund 25 Prozent erreichen.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "European Alternative Fuels Observatory"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "MAN bringt ersten Serien-eTruck mit Megawatt-Charging-System", "text": "MAN hat den ersten in Serie gefertigten E-Lkw mit Megawatt Charging System (MCS) vorgestellt, das deutlich kürzere Ladezeiten im Fernverkehr ermöglicht. Das System gilt als wichtiger Schritt für die Elektrifizierung schwerer Nutzfahrzeuge.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "elektroauto-news.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Bewertung für Batteriesicherheit", "text": "Die im Januar eingeführten Euro-NCAP-2026-Protokolle bewerten erstmals Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskräfte automatisch warnen. Zusätzlich gelten verschärfte Crashtests und verbindliche Rettungskräfte-Schulungen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "IATF 16949: Neue Vorgaben zu Batterie-Handling und -Rücknahme", "text": "Die für 2026 erwartete Revision der IATF 16949 bringt spezifischere Vorschriften zu Handling, Transport und Rücknahme von HV-Batterien mit sich. Seit 2025 werden neue Fahrzeugplattformen zudem überwiegend mit 800-Volt-Technik ausgelegt, während 400-Volt-Systeme im Einstiegssegment bis Ende des Jahrzehnts weiterlaufen.", "url": "https://smct-management.de/iatf-16949-neuerungen-2026/", "urlLabel": "SMCT Management"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer: EBIT-Margen 2025 verbreitet unter 5 Prozent", "text": "Laut einer Oliver-Wyman-Studie stehen deutsche Automobilzulieferer an einem Scheidepunkt: Standort- und Transformationskosten, Volumenverluste an asiatische Wettbewerber und die Doppelbelastung durch Verbrenner und BEV drücken die Margen. Für 2026 zeichnet sich noch keine Trendwende ab.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Automotive-Paket weicht CO2-Ziele 2035 auf", "text": "Das im Dezember vorgestellte Automotive-Paket der EU-Kommission sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor. Hersteller, die ihre CO2-Flottenziele 2025 verfehlt haben, sollen 2026 ohne Regulierungs-Pooling übererfüllen.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Mindestpreissystem für chinesische E-Autos ab 2026", "text": "Die EU-Kommission hat im Januar 2026 ein neues System angekündigt, das die seit November 2024 geltenden Strafzölle auf chinesische E-Autos ersetzen kann: Hersteller verpflichten sich zu einem Mindestverkaufspreis. Chinesische Marken wie BYD wachsen trotzdem weiter und liegen mit 2,1 Prozent Marktanteil bereits vor Tesla.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "Automobilsalon Bellemann"}], "beratung": "Der anhaltende Margendruck bei deutschen Zulieferern (EBIT unter 5 Prozent) erhöht den Beratungsbedarf bei Kostenstruktur und Sourcing, besonders da 800-Volt-Plattformen und neue IATF-Vorgaben zusätzliche Investitionen erfordern. Für Ersatzteilehändler wird das EU-Mindestpreissystem für China-EVs relevant: Es stabilisiert Preisniveaus im Aftermarket, konkrete Auswirkungen auf die Sortimentsstrategie sind aber noch nicht belegt.", "hvtraining": "Die Euro-NCAP-2026-Anforderungen an die Thermal-Runaway-Erkennung und die erwartete IATF-16949-Revision zu Batterie-Handling erhöhen den Qualifizierungsbedarf für HV-Schulungen in Werkstätten und bei Rettungskräften. Mit dem Trend zu 800-Volt-Architekturen als Plattformstandard wird Grundlagenwissen zu höheren Spannungsklassen für Servicepersonal zunehmend zur Pflicht."}, {"date": "2026-07-27", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Boom in Deutschland: BEV-Zulassungen im Juni +78 Prozent", "text": "Im Juni 2026 stiegen die Neuzulassungen batterieelektrischer Fahrzeuge in Deutschland um 78,2 Prozent auf 84.057 Einheiten, der Marktanteil kletterte auf 28,4 Prozent. Im ersten Halbjahr summierte sich das Plus auf 48 Prozent gegenueber dem Vorjahr.", "url": "https://www.auto-motor-und-sport.de/verkehr/neuzulassungen-juni-2026-elektroautos-boomen-und-ueberholen-die-verbrenner/", "urlLabel": "auto motor und sport"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-weiter E-Auto-Marktanteil erreicht 20,7 Prozent", "text": "Im ersten Halbjahr 2026 wurden in der EU 1,22 Millionen neue Elektroautos zugelassen, der Marktanteil stieg von 15,6 auf 20,7 Prozent. Fuer Werkstaetten und Haendler bedeutet das steigenden Bedarf an HV-qualifiziertem Personal.", "url": "https://ecomento.de/2026/07/23/elektroautos-mit-207-marktanteil-in-der-eu-im-ersten-halbjahr-2026/", "urlLabel": "ecomento.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Punkte fuer Thermal-Runaway-Erkennung", "text": "Die im Januar eingefuehrten Euro-NCAP-2026-Protokolle bewerten erstmals gezielt Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte warnen. Zusaetzlich gelten verschaerfte Crashtests und neue Batterie-Haltbarkeitsvorschriften.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue DGUV-Information zu Arbeiten an Hochvolt-Fahrzeugen", "text": "Die DGUV hat eine aktualisierte Information zur sicheren Arbeit an HV-Systemen in Kraftfahrzeugen veroeffentlicht. Sie konkretisiert Qualifikationsstufen und Schutzmassnahmen und ist direkt relevant fuer die Trainingspraxis.", "url": "https://www.kfz-hh.de/neue-dguv-information-zur-arbeit-an-hochvolt-fahrzeugen", "urlLabel": "kfz-hh.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer im Umbruch: EBIT-Margen unter 5 Prozent", "text": "Laut Oliver-Wyman-Studie stehen deutsche Automobilzulieferer wegen hoher Standortkosten, Volumenverlusten an asiatische Wettbewerber und paralleler Investitionen in Verbrenner- und BEV-Technik strukturell unter Druck. Die EBIT-Margen 2025 lagen deutlich unter dem Niveau, das fuer Eigenfinanzierung noetig waere.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Automobilpaket: Aufweichung des Verbrenner-Aus 2035 im Gespraech", "text": "Das von der EU-Kommission vorgelegte Automobilpaket sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor und liegt aktuell bei Parlament und Rat. Gleichzeitig zwingen die strengen CO2-Flottenzielwerte (rund 93,6 g/km) Hersteller weiter zu hohen Elektro-Quoten.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "elektroauto-news.net"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Mindestpreissystem fuer chinesische E-Autos startet", "text": "Seit Januar 2026 koennen chinesische Hersteller anstelle der bisherigen Strafzoelle ein Mindestpreissystem nutzen und sich verpflichten, ihre E-Autos in der EU nicht unter einem festgelegten Mindestpreis zu verkaufen. Das veraendert die Wettbewerbslage fuer europaeische OEMs und Haendler.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der anhaltende BEV-Boom bei gleichzeitig strukturell schwachen Zulieferer-Margen verschaerft den Beratungsbedarf entlang der Wertschoepfungskette, insbesondere bei Kosten- und Sourcing-Strategien fuer Werkstaetten und Haendler. Das drohende Mindestpreissystem fuer chinesische E-Autos veraendert kurzfristig die Einkaufs- und Wettbewerbslage im Ersatzteilhandel und sollte in B2B/B2C-Webshop-Strategien beruecksichtigt werden.", "hvtraining": "Die neue DGUV-Information sowie die verschaerften Euro-NCAP-Kriterien zur Thermal-Runaway-Erkennung erhoehen den Aktualisierungsbedarf in HV-Schulungen fuer Werkstaetten und Rettungskraefte. Mit dem steigenden BEV-Marktanteil (28,4% in Deutschland) waechst parallel die Nachfrage nach qualifiziertem Personal fuer Arbeiten an Hochvoltsystemen."}, {"date": "2026-07-20", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Toyota verdoppelt Elektro-Absatz in Europa, VW expandiert nach Zentralasien", "text": "Toyota hat seinen Absatz vollelektrischer Modelle in Europa verdoppelt und gewinnt damit im BEV-Segment deutlich an Gewicht. Parallel erschliesst Volkswagen mit Zentralasien den naechsten Wachstumsmarkt, waehrend BYD mit dem Sponsoring von Paris Saint-Germain seine Markenpraesenz in Europa weiter ausbaut.", "url": "https://www.automobilwoche.de/nachrichten/amw-aktuelle-meldungen/", "urlLabel": "Automobilwoche"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "NOW-Studie: E-Autos gleichen CO2-Rucksack nach rund 44.000 km aus", "text": "Die bundeseigene NOW GmbH bestaetigt, dass Elektroautos den CO2-Rucksack aus der Batterieproduktion nach rund 44.000 Kilometern ausgeglichen haben. Der Break-even liegt damit deutlich frueher als in aelteren Studien und staerkt die Klimabilanz-Argumentation fuer den E-Hochlauf.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Nio schliesst Nio House Hamburg zum 20. Juli", "text": "Nio schliesst sein Nio House in Hamburg zum heutigen 20. Juli und strafft damit sein Retail-Netz in Deutschland. Der Schritt zeigt den Konsolidierungsdruck bei chinesischen Marken im Direktvertrieb, waehrend der Wettbewerb im deutschen E-Markt weiter zunimmt.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026 honoriert Thermal-Runaway-Erkennung und Rettungskraefte-Warnung", "text": "Die seit Januar geltenden Euro-NCAP-Protokolle 2026 bewerten Fahrzeuge in vier Kategorien und vergeben bei E-Fahrzeugen erstmals Punkte fuer Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte warnen. Dazu kommen verschaerfte Crashtests, neue Vorgaben zur Batteriehaltbarkeit und verbindliche Schulungen fuer Rettungskraefte.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV: Sensibilisierung auch fuer Bediener von HV- und Gasantriebssystemen Pflicht", "text": "Die DGUV verlangt, dass Beschaeftigte, die Fahrzeuge oder Maschinen mit HV- oder Gasantrieb in fahrerartigem Umfang bedienen, arbeitsschutzrechtlich sensibilisiert werden. Neben Werkstattpersonal ruecken damit Fuhrpark-, Logistik- und Maschinenbediener in den Fokus der Qualifizierung nach DGUV Information 209-093.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Schaeffler meldet steigende Hybrid-Nachfrage, EU-Zoelle auf China-Reifen bis 45 Prozent", "text": "Schaeffler verzeichnet wachsende Nachfrage nach Komponenten fuer Voll-, Mild- und Plug-in-Hybride sowie Range-Extender, ein Beleg fuer die anhaltende Antriebs-Dualitaet in der Zulieferindustrie. Parallel koennen die neuen EU-Zoelle auf Reifen aus China bis zu 45 Prozent erreichen, was Beschaffung und Preise im Teilehandel direkt beruehrt.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}, {"cat": "branche", "label": "Branche / Software", "title": "Mercedes bringt autonome Fahrtechnik Ende 2026 nach Europa", "text": "Die in China bereits verfuegbare autonome Fahrtechnik von Mercedes soll bis Ende 2026 nach Europa kommen; das Werk Rastatt erhaelt zudem ein zusaetzliches Modell. Bei Volkswagen soll die Belegschaft Ende August ueber die naechsten Restrukturierungsschritte informiert werden, das Werk Osnabrueck bleibt zunaechst ausgenommen.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}], "beratung": "Nio strafft sein Retail-Netz, Toyota verdoppelt den E-Absatz: Die Markenlandschaft verschiebt sich weiter, fuer B2B/B2C-Webshops heisst das laufende Pflege von Fahrzeugzuordnungen und Teilekatalogen auch fuer Direktvertriebsmarken. Schaefflers Hybrid-Nachfrage bestaetigt die zweigleisige Sortimentsstrategie, und die EU-Reifenzoelle von bis zu 45 Prozent erfordern kurzfristig einen Sourcing- und Preischeck im Reifensegment.", "hvtraining": "Die Euro-NCAP-Punkte fuer Thermal-Runaway-Erkennung machen Batterie-Notfallmanagement und Rettungskarten zum Pflichtthema in HV-Schulungen. Die DGUV-Sensibilisierungspflicht fuer reine Bediener erweitert die Zielgruppe auf Fuhrparks, Logistik und Maschinenbetreiber, und die NOW-Zahl von 44.000 km liefert ein griffiges Argument fuer den Einstieg in jedes Training."}, {"date": "2026-07-15", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Ranking Mitte Juli: Skoda Elroq verdraengt Tesla Model Y von der Spitze", "text": "Im aktuellen Ranking der beliebtesten Elektroautos in Deutschland hat der Skoda Elroq das Tesla Model Y von Platz 1 verdraengt; dahinter folgen VW ID.3, Skoda Enyaq und VW ID.7. Das VW-Konzernlager dominiert damit die Jahreswertung, waehrend Importmarken vor allem in den Monatswertungen stark zulegen.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-mitte-juli-2026/", "urlLabel": "Business Insider"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Halbjahresbilanz: BEV-Zulassungen +48 Prozent, Juni-Anteil bei 28,4 Prozent", "text": "Mit 84.057 BEV-Neuzulassungen im Juni (+78,2 Prozent) und 28,4 Prozent Marktanteil lagen Elektroautos erstmals vor den Benzinern; im ersten Halbjahr summiert sich das Plus auf 48 Prozent. Die Durchschnittsreichweite neuer E-Modelle steigt 2026 auf rund 523 km nach 472 km im Vorjahr.", "url": "https://www.goingelectric.de/2026/07/14/news/zulassungszahlen-fuer-elektroautos-und-plug-in-hybride-im-juni-2026/", "urlLabel": "GoingElectric"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Citroen verdreifacht E-Absatz in Deutschland, e-C3 als Volumentreiber", "text": "Die Verkaeufe vollelektrischer Citroen-Modelle legen in Deutschland um 232 Prozent zu, der e-C3 zaehlt zu den erfolgreichsten Autos seines Segments. Das guenstige B-Segment unter 25.000 Euro entwickelt sich damit zum naechsten Volumentreiber des E-Markts.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "GSR-Pflichten seit Juli wirksam: Sicherheitspaket fuer Neuzulassungen komplett", "text": "Alle neu zugelassenen Fahrzeuge muessen seit diesem Monat die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen verschaerfte Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Fuer E-Fahrzeuge ist das Sicherheits-Regelwerk 2026 damit vollstaendig in Kraft.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "HV-Qualifizierung: DGUV 209-093, DGUV Vorschrift 3 und DIN VDE 0105-100 als Rahmen", "text": "Die DGUV Information 209-093 bleibt die massgebliche Grundlage fuer HV-Qualifizierung von der sensibilisierten Person bis zur Fachkraft; die DGUV-FAQ Hochvolttechnik liefert Auslegungshilfen fuer die betriebliche Umsetzung. Flankierend gelten DGUV Vorschrift 3 und DIN VDE 0105-100 fuer elektrotechnische Arbeiten und Messpraxis, das wachsende Seminarangebot zeigt die steigende Nachfrage nach strukturierter HV-Weiterbildung.", "url": "https://www.dguv.de/fb-holzundmetall/sg/sg_fai/mechatronik/faq/02_hochvolt/index.jsp", "urlLabel": "DGUV"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer 2026: Strukturwandel durch Elektrifizierung, SDV und volatile Lieferketten", "text": "Branchenanalysen sehen 2026 einen tiefgreifenden Strukturwandel: Elektrifizierung, Software-defined Vehicles, wachsender Regulierungsdruck und Lieferkettenvolatilitaet wirken gleichzeitig auf die Zulieferindustrie. Seit 2020 wurden 257 Insolvenzen bei Zulieferern mit ueber 10 Millionen Euro Umsatz gezaehlt, davon 59 allein im Jahr 2025.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "VDA erwartet knapp 700.000 E-Neuzulassungen 2026, EU-Anteil bei 20 Prozent", "text": "Der VDA rechnet fuer Deutschland 2026 mit einem Plus von 30 Prozent auf knapp 700.000 E-Neuzulassungen, ein Marktanteil von 24,9 Prozent. EU-weit wurden von Januar bis Mai 950.521 BEV neu zugelassen (20 Prozent Anteil); die CO2-Flottenziele 2025-2027 treiben den Markt Richtung 23 Prozent im Gesamtjahr.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "Elektroauto-News"}], "beratung": "Elroq an der Spitze und der Citroen-e-C3-Boom zeigen, dass sich das E-Volumen in preisguenstige, hoch standardisierte Segmente verlagert: Fuer B2B/B2C-Webshops werden MEB- und Stellantis-Plattformteile zum planbaren Volumengeschaeft. Die VDA-Prognose von knapp 700.000 E-Zulassungen macht den E-Teile-Anteil im Sortiment kalkulierbar, Datenqualitaet bei Fahrzeugzuordnungen bleibt der entscheidende Hebel.", "hvtraining": "Mit dem seit Juli vollstaendigen GSR-Paket und verbindlichen Rettungskraefte-Schulungen waechst der Qualifizierungsbedarf ueber die Werkstatt hinaus. Das Halbjahresplus von 48 Prozent bedeutet spuerbar mehr HV-Fahrzeuge im Service, Schulungen nach DGUV 209-093 inklusive Messpraxis nach DIN VDE 0105-100 sollten jetzt skaliert werden."}, {"date": "2026-07-14", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EY: Deutsche Hersteller steigern E-Absatz um 31 Prozent, verlieren aber Marktanteil", "text": "Im zweiten Quartal wuchs der E-Absatz der deutschen Konzerne um 31 Prozent, ihr gemeinsamer Marktanteil sank jedoch um fast zehn Punkte auf 53,9 Prozent. Auslaendische Hersteller, allen voran Tesla, steigerten ihren Absatz um 101 Prozent und kommen auf 36,2 Prozent Anteil im Elektrosegment.", "url": "https://www.ey.com/de_de/newsroom/2026/07/ey-analyse-elektro-neuwagenmarkt-juli-2026", "urlLabel": "EY Newsroom"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "BMW bringt Neue-Klasse-Technik in den 7er, AMG CLA mit ueber 670 km Reichweite", "text": "Mit dem neuen 7er ziehen erstmals Innovationen der Neuen Klasse in ein bestehendes Serienmodell ein. Mercedes-AMG gibt fuer den CLA 45 4MATIC+ mit 94-kWh-Batterie mehr als 670 km Reichweite an, der Shooting Brake schafft ueber 640 km.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Elektrische Nutzfahrzeuge: Absatz waechst kraeftig, Deutschland profitiert als Standort", "text": "Der Absatz elektrischer Nutzfahrzeuge waechst kraeftig, da Betreiber zunehmend die Kostenvorteile im Betrieb erkennen; Deutschland profitiert dabei als Produktionsstandort. Parallel planen Octopus Energy und CATL mit dem Joint Venture Swaptopus Batteriewechsel-Stationen fuer E-Lkw in Europa.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "800 Volt wird Plattform-Standard, 400 Volt bleibt im Einstiegssegment", "text": "Neue Fahrzeugplattformen werden seit 2025 nur noch mit 800-Volt-Technik entwickelt; 400-Volt-Basen wie VWs MEB laufen im Einstiegssegment bis Ende des Jahrzehnts weiter, unter anderem in neuen Modellen von Renault, Hyundai und VW ab 2026. Fuer Werkstaetten bedeutet das dauerhaft zwei parallele Spannungslagen in Diagnose und Instandsetzung.", "url": "https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/", "urlLabel": "ADAC"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "GSR-Stichtag erreicht: Seit Juli gelten die vollen EU-Sicherheitspflichten", "text": "Seit diesem Monat muessen alle neu zugelassenen Fahrzeuge die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen strengere Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Die DGUV Information 209-093 bleibt die massgebliche Qualifizierungsgrundlage fuer HV-Arbeiten.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "BMW in China unter Druck, Zulieferer-Krise bleibt strukturell", "text": "Schwache E-Auto-Zulassungen und die grosse Beteiligung am Brilliance-Joint-Venture erhoehen den Druck auf BMW in China deutlich. Bei den Zulieferern gilt die Krise laut Branchenanalysen inzwischen als strukturell: hohe Finanzierungskosten, anhaltender Kostendruck und volatile EV-Nachfrage praegen das Geschaeft dauerhaft.", "url": "https://www.elektroauto-news.net/automobilindustrie", "urlLabel": "Elektroauto-News"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "Mindestpreis-System fuer China-EVs laeuft an, erste Modelle betroffen", "text": "Das EU-Preisverpflichtungs-System loest die Ausgleichszoelle auf chinesische Elektroautos ab: Hersteller sichern zu, festgelegte Mindestpreise nicht zu unterschreiten, erste Modelle fallen bereits unter die Regelung. Parallel haelt die EU-CO2-Flottenregulierung den BEV-Hochlauf auf Kurs, nach 20 Prozent Marktanteil von Januar bis Mai werden fuer 2026 rund 23 Prozent erwartet.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "Automobilsalon Bellemann"}], "beratung": "Die EY-Q2-Zahlen (deutsche Hersteller nur noch 53,9 Prozent Anteil im Elektrosegment) und das anlaufende Mindestpreis-System machen den Bestand an Importmarken planbar groesser: Fahrzeugzuordnungen und Teilekataloge fuer Tesla, BYD und Co. bleiben Top-Prioritaet fuer B2B/B2C-Webshops. Der wachsende E-Nutzfahrzeugmarkt oeffnet zudem ein neues Segment fuer Flotten-Ersatzteilgeschaeft und Prozessberatung.", "hvtraining": "Die dauerhafte Koexistenz von 400- und 800-Volt-Plattformen gehoert als eigenes Modul in Diagnose- und Instandsetzungsschulungen, inklusive der hoeheren Anforderungen an Messmittel und PSA. Mit dem GSR-Stichtag und wachsendem E-Lkw-Absatz steigt der Qualifizierungsbedarf nach DGUV 209-093 auch bei Nutzfahrzeug-Werkstaetten und Flottenbetreibern."}, {"date": "2026-07-13", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EY-Analyse: Elektropraemie befeuert den Markt, Importmarken profitieren ueberproportional", "text": "Laut EY schrumpfte der Marktanteil deutscher Konzerne im Elektrosegment im zweiten Quartal um fast zehn Prozentpunkte, waehrend Tesla und andere auslaendische Hersteller ihren Absatz um 101 Prozent steigerten und ihren Anteil von 27,6 auf 36,2 Prozent ausbauten. Positiv fuer VW: Der europaeische Auftragsbestand fuer vollelektrische Modelle liegt ueber 50 Prozent hoeher als Ende 2025.", "url": "https://www.ey.com/de_de/newsroom/2026/07/ey-analyse-elektro-neuwagenmarkt-juli-2026", "urlLabel": "EY Newsroom"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Tesla investiert 213 Millionen Euro in die Zellfertigung in Gruenheide", "text": "Tesla baut die Batteriezellfertigung am Standort Gruenheide aus und will ab 2027 die komplette E-Auto-Produktion in Europa unter einem Dach buendeln. Parallel meldet Svolt Energy, ab September hybride Semi-Solid-State-Batterien in Serie zu fertigen, ein weiterer Schritt Richtung naechster Zellgeneration.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Swaptopus: Octopus Energy und CATL bauen Batteriewechsel-Netz fuer E-Lkw", "text": "Octopus Energy und CATL gruenden das Joint Venture Swaptopus und wollen Batteriewechsel-Stationen fuer elektrische Lkw in Europa aufbauen; der Absatz elektrischer Nutzfahrzeuge waechst deutlich, da Betreiber die Kostenvorteile erkennen. Zudem soll Seamless Charging ab Herbst an allen InCharge-Ladepunkten verfuegbar sein.", "url": "https://www.auto-medienportal.net/artikel/list/214", "urlLabel": "Auto-Medienportal"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Batteriepass ab Februar 2027, Euro 7 bringt SoH-Anzeige ab November 2026", "text": "Der digitale Batteriepass nach EU-Batterieverordnung wird ab 18. Februar 2027 Pflicht fuer neue Antriebsbatterien ueber 2 kWh und dokumentiert SoH, Herkunft, Material und CO2-Fussabdruck per QR-Code. Schon ab November 2026 verlangt Euro 7, dass Neuwagen den Batteriezustand direkt im Fahrzeug anzeigen, relevant fuer Diagnose, Gewaehrleistung und Gebrauchtwagenbewertung.", "url": "https://automobilsalon-bellemann.de/news/batteriepass-elektroauto-2027-soh-pflicht-euro-7/", "urlLabel": "Automobilsalon Bellemann"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "V2G-Pflicht fuer neue E-Autos im EU-Parlament umstritten", "text": "Die geplante Verpflichtung zu Vehicle-to-Grid-Faehigkeit fuer neue Elektroautos ist im Europaparlament umstritten, waehrend Umweltverbaende auf deutlich schnelleres Marktwachstum hoffen. Bidirektionales Laden erhoeht die Anforderungen an HV-Architektur, Ladeelektronik und den netzvertraeglichen Anschluss nach den aktualisierten VDE-Anwendungsregeln 4105 und 4100.", "url": "https://www.auto-medienportal.net/artikel/list/214", "urlLabel": "Auto-Medienportal / VDA"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "VDA fordert tiefgreifende Reformen, VW-Restrukturierung stockt", "text": "Angesichts der Sparplaene in der Autoindustrie fordert der VDA tiefgreifende Reformen fuer den Standort Deutschland. Bei Volkswagen stoesst Oliver Blumes umfassender Restrukturierungsplan auf Widerstand der Arbeitnehmervertreter, eine Einigung steht weiter aus.", "url": "https://www.onvista.de/news/2026/07-07-sparplaene-in-der-autoindustrie-vda-fuer-tiefgreifende-reformen-0-10-26529783", "urlLabel": "onvista"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "BYD verhandelte mit Renault ueber Beteiligung, Lucid holt Restrukturierer", "text": "BYD hat laut Berichten zweimal mit Renault ueber einen Einstieg beim franzoesischen Konzern gesprochen, bislang ohne Einigung. BMW geraet in China durch schwache EV-Zulassungen und das Brilliance-Joint-Venture unter Druck, waehrend Lucid die Restrukturierungsberatung AlixPartners engagiert haben soll.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}], "beratung": "Die EY-Zahlen (Importmarken +101 Prozent, 36,2 Prozent Anteil im Elektrosegment) und die BYD-Renault-Gespraeche zeigen, wie schnell sich die Markenlandschaft verschiebt: Fuer B2B/B2C-Webshops bleiben Teilekataloge und Fahrzeugzuordnungen fuer China-Marken oberste Prioritaet. Die VDA-Reformdebatte und der VW-Restrukturierungsstau signalisieren anhaltenden Kostendruck in der Lieferkette, Prozess- und Sortimentsoptimierung bleibt gefragt.", "hvtraining": "Batteriepass (ab Februar 2027) und Euro-7-SoH-Anzeige (ab November 2026) sind konkrete neue Schulungsinhalte fuer Batteriediagnose und -bewertung, jetzt in Unterlagen einarbeiten. V2G-Debatte und Batteriewechsel-Stationen fuer E-Lkw erweitern das HV-Themenspektrum auf Nutzfahrzeuge und Ladeinfrastruktur, Zielgruppen jenseits der PKW-Werkstatt."}, {"date": "2026-07-10", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "KBA-Bilanz Juni: BEV-Anteil springt auf 28,4 Prozent, E-Autos ueberholen Benziner", "text": "Mit 84.057 BEV-Neuzulassungen (+78,2 Prozent) erreichten Elektroautos im Juni 28,4 Prozent Marktanteil und ueberholten erstmals die Benziner, deren Zulassungen um 16,8 Prozent sanken (Diesel: -5,1 Prozent). Im ersten Halbjahr legten die BEV-Zulassungen um 48 Prozent zu.", "url": "https://www.heise.de/news/KBA-Zahlen-Juni-2026-E-Auto-Anteil-springt-auf-28-Prozent-11352961.html", "urlLabel": "heise online"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Marktstarts im Juli: ID.3 Neo, Q4 e-tron, C-Klasse EQ und Zeekr 7GT", "text": "Im Juli starten der VW ID.3 Neo ab 33.995 Euro, der Audi Q4 e-tron ab 47.500 Euro, die Mercedes C-Klasse EQ ab 67.711 Euro und der Zeekr 7GT ab 47.990 Euro, der in 13 Minuten von 10 auf 80 Prozent laedt. Die Durchschnittsreichweite neuer E-Modelle liegt 2026 bei rund 523 km nach 472 km im Vorjahr.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "AUTOZEITUNG"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "BGHM-Praxishilfe 021: kompakte Umsetzungshilfe fuer HV-Arbeiten am PKW", "text": "Die BGHM-Reihe Arbeitsschutz Kompakt konkretisiert mit Blatt 021 die Anforderungen fuer Arbeiten an Hochvoltsystemen im PKW: Gefaehrdungsbeurteilung, Schutzmassnahmen und Qualifikationsstufen nach DGUV Information 209-093. Zusammen mit der DGUV-FAQ Hochvolttechnik gibt es damit praxisnahe Auslegungshilfen fuer die betriebliche Umsetzung.", "url": "https://www.bghm.de/arbeitsschuetzer/praxishilfen/arbeitsschutz-kompakt/021-arbeiten-an-hochvoltsystemen-pkw", "urlLabel": "BGHM"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Sicherheitspaket 2026 wirksam: GSR-Pflichten, Crashtests, Rettungskraefte-Schulungen", "text": "Seit Juli muessen alle neu zugelassenen Fahrzeuge die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen verschaerfte Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Die seit Maerz aktualisierten VDE-Anwendungsregeln 4105 und 4100 regeln parallel den netzvertraeglichen Anschluss von Ladeinfrastruktur.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer-Ranking 2026: Bosch bleibt vorn, CATL auf dem Podium, Huayu neu in den Top 10", "text": "Die am 7. Juli erschienene Sonderausgabe der Automobil Produktion bestaetigt Bosch auf Platz 1 vor Denso; Batterieriese CATL springt erstmals aufs Podium. Neu in den Top 10 sind der chinesische Zulieferer Huayu (Hasco, Umsatz +8,5 Prozent auf 25,6 Mrd. US-Dollar) und Bridgestone, waehrend die Branche mit strukturellem Kostendruck und 59 Insolvenzen allein 2025 kaempft.", "url": "https://www.automobil-produktion.de/global-automotive-business/das-sind-die-zehn-groessten-zulieferer-der-autoindustrie-1/1103084", "urlLabel": "Automobil Produktion"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "T&E-Report: EV-Absatz und Erschwinglichkeit erreichen den Kipppunkt", "text": "Von Januar bis Mai wurden in der EU 950.521 BEV neu zugelassen, ein Marktanteil von 20 Prozent. Der T&E-Progress-Report erwartet fuer das Gesamtjahr rund 23 Prozent und haelt bis Jahresende 25 Prozent fuer moeglich, getrieben von den CO2-Flottenzielen 2025-2027.", "url": "https://www.transportenvironment.org/articles/ev-progress-report-2026", "urlLabel": "Transport & Environment"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "CO2-Flottenziele bleiben Rueckgrat, E-Fuels-Ausnahme nach 2035 fixiert", "text": "Die EU-Flottenzielwerte von rund 93,6 g CO2/km zwingen Hersteller weiter zu hohen Elektroquoten, sonst drohen Strafzahlungen in Milliardenhoehe. Parallel erlaubt das EU-Automobilpaket Verbrenner-Neuwagen auch nach 2035, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden, eine Aufweichung um rund zehn Prozent.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}], "beratung": "Der Sprung auf 28,4 Prozent BEV-Anteil bei gleichzeitiger E-Fuels-Ausnahme nach 2035 bestaetigt die zweigleisige Sortimentsstrategie fuer Ersatzteilhaendler: E-Teile-Kataloge ausbauen, Verbrenner-Sortiment aber nicht vorschnell abschmelzen. Das Zulieferer-Ranking mit CATL und Huayu unterstreicht die Verschiebung Richtung Batterie- und China-Lieferketten, was Sourcing- und Datenqualitaet (Fahrzeugzuordnungen fuer BYD, Zeekr und Co.) in B2B/B2C-Webshops zum Wettbewerbsfaktor macht.", "hvtraining": "Mit der BGHM-Praxishilfe 021 und der DGUV-FAQ liegen jetzt konkrete Umsetzungshilfen zur DGUV Information 209-093 vor, ideal als Grundlage fuer aktualisierte Schulungsunterlagen und Qualifikationsnachweise. Verbindliche Rettungskraefte-Schulungen und 28,4 Prozent BEV-Neuzulassungsanteil machen herstelleruebergreifende HV-Qualifizierung, inklusive China-Marken, zum Kerngeschaeft."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
