/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date": "2026-09-14", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt neuen Einstiegs-Stromer Epiq 35", "text": "Volkswagen startet den Epiq 35 als Basismodell ab 25.900 Euro, eine Version mit 55-kWh-Batterie kostet ab 32.100 Euro und kommt Ende September auf den Markt. Parallel zeigt Porsche mit dem Taycan Turbo GT (Manthey-Kit) auf der Nordschleife eine neue Bestzeit fuer Elektrofahrzeuge von 6:55,533 Minuten.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "BEV-Anteil in der EU steigt auf 20 Prozent", "text": "Von Januar bis Mai 2026 wurden in der EU rund 950.521 vollelektrische Fahrzeuge zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahr. Haelt der Trend an, koennten BEV bis Jahresende rund ein Viertel aller Neuzulassungen in Europa ausmachen.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "European Alternative Fuels Observatory"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Chinesische Marken draengen weiter in den EU-Markt", "text": "BYD hat mit 2,1 Prozent Marktanteil in der EU inzwischen Tesla ueberholt, waehrend Tesla in China wegen schwacher Nachfrage und starker Konkurrenz die Preise fuer Model 3 und Model Y senkt. Ein ICCT-Bericht zeigt zudem, dass der Betrieb eines E-Autos in Europa 2025 rund ein Drittel guenstiger war als bei einem vergleichbaren Verbrenner.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP verschaerft Sicherheitsanforderungen an HV-Batterien", "text": "Die seit Januar 2026 geltenden Euro-NCAP-Protokolle bewerten unter anderem, ob Fahrzeuge einen thermischen Durchgehprozess (Thermal Runaway) der Batterie erkennen und Rettungskraefte automatisch warnen koennen. 2026 bringt zudem strengere Crashtests, neue Vorgaben zur Batteriedauerhaltbarkeit und verpflichtende Schulungen fuer Rettungsdienste im Umgang mit E-Fahrzeugen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue VDE-Anwendungsregeln betreffen HV-Ladeinfrastruktur", "text": "Die seit Maerz ueberarbeiteten VDE-Anwendungsregeln 4105 und 4100 definieren neue technische Anforderungen fuer den Anschluss von Erzeugungsanlagen ans Niederspannungsnetz und vereinfachen die Einbindung von PV- und Speichersystemen. Das wirkt sich direkt auf die Planung und Zertifizierung von Ladeinfrastruktur fuer Hochvolt-Fahrzeuge aus.", "url": "https://www.vdik.de/themen/sicherheit-und-verkehr/hochvolt-systeme/", "urlLabel": "VDIK"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer stecken in struktureller Krise", "text": "Laut einer aktuellen Oliver-Wyman-Studie lagen die EBIT-Margen deutscher Zulieferer 2025 verbreitet unter 5 Prozent, waehrend Top-OEMs im gleichen Zeitraum um 10 Prozent (CAGR) wuchsen. Standort- und Transformationskosten sowie der parallele Zwang zu Verbrenner- und Batterieentwicklung verschaerfen den Druck zusaetzlich.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Kommission weicht Verbrenner-Aus 2035 auf", "text": "Das im Dezember vorgelegte Automobilpaket der EU-Kommission sieht vor, das faktische Verbrenner-Aus ab 2035 um zehn Prozent aufzuweichen. Hersteller, die ihre CO2-Flottenziele 2025 verfehlt haben, sollen diese 2026 uebererfuellen, statt auf regulatorisches Pooling zurueckzugreifen.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}], "beratung": "Die strukturelle Krise bei Zulieferern und der wachsende BEV-Anteil erhoehen den Druck auf Ersatzteilhaendler, ihr Sortiment staerker auf HV-Komponenten und E-Antrieb-Zubehoer auszurichten. Gleichzeitig verschieben chinesische Marken die Wettbewerbslandschaft, was Webshops zu klarerer Differenzierung bei Beratung, Verfuegbarkeit und Cross-Selling zwingt. Wer jetzt in Prozessautomatisierung und HV-Kompetenz investiert, sichert sich einen Vorsprung, wenn der BEV-Bestand in den naechsten Jahren spuerbar waechst.", "hvtraining": "Die verschaerften Euro-NCAP-Anforderungen und die verpflichtenden Rettungsdienst-Schulungen erhoehen den Bedarf an fundierten HV-Sicherheitsschulungen in Werkstaetten und bei Einsatzkraeften. Die neuen VDE-Regeln fuer Ladeinfrastruktur sollten in Schulungsinhalte zu Installation und Pruefung von HV-Ladesystemen einfliessen. Trainer sollten Thermal-Runaway-Erkennung und Erstmassnahmen als festen Bestandteil aktueller Curricula verankern."}, {"date": "2026-09-07", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "BEV-Marktanteil in Deutschland steigt auf 32,4 Prozent", "text": "Im August 2026 wurden 68.930 rein elektrische Pkw neu zugelassen, der BEV-Marktanteil kletterte auf 32,4 Prozent. Benziner und Diesel verlieren deutlich an Boden.", "url": "https://www.elektroauto-news.net/news/absatz-wachstum-langsamer-2026", "urlLabel": "Elektroauto-News.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt Elektro-Polo, neue Modelle im September", "text": "Volkswagen startet im September 2026 die langerwartete Elektroversion des Polo. Parallel debuetieren unter anderem der Mazda CX-6e und der Skoda Epiq 35 ab 25.900 Euro im Einstiegssegment.", "url": "https://www.auto-motor-und-sport.de/elektroauto/neue-elektroautos-2026-das-werden-die-wichtigsten-e-neuheiten-des-jahres/", "urlLabel": "Auto Motor und Sport"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Thermal-Runaway-Erkennung wird Pflichtkriterium", "text": "Die neuen Euro-NCAP-Protokolle bewerten ab 2026 gezielt, ob Batteriesysteme einen thermischen Durchgehprozess fruehzeitig erkennen und Rettungskraefte alarmieren. Das erhoeht die Anforderungen an HV-Sicherheitskonzepte der Hersteller.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "800-Volt-Plattformen werden Standard, HV-Schulungspflicht bleibt scharf", "text": "Neue Fahrzeugplattformen werden seit 2025 nur noch mit 800-Volt-Technik entwickelt, etwa bei Renault Twingo E-Tech und VW ID. Polo. Mitarbeiter an HV-Systemen benoetigen weiterhin jaehrliche Schulungen nach DGUV Information 209-093.", "url": "https://www.tuvsud.com/de-de/store/akademie/seminare-technik/hochvolt", "urlLabel": "TUEV SUED Akademie"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Schere zwischen OEMs und Zulieferern oeffnet sich weiter", "text": "Waehrend grosse Hersteller 2024/25 im Schnitt 10 Prozent Umsatzwachstum verzeichneten, sank der Umsatz der Top-Zulieferer um 3 Prozent. Deutsche Zulieferer kaempfen mit EBIT-Margen unter 5 Prozent und wachsendem Druck durch chinesische Wettbewerber.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Automechanika Frankfurt startet mit Rekordbeteiligung", "text": "Vom 8. bis 12. September 2026 trifft sich die internationale Aftermarket-Branche in Frankfurt. Rund 4.500 Aussteller, neue KI-Formate und ein Rekord bei den Innovation Awards praegen die Messe.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus auf, chinesische Marken legen zu", "text": "Die EU-Kommission schlaegt vor, das vollstaendige Verbrenner-Verbot ab 2035 durch ein 90-Prozent-Emissionsziel mit Superkrediten fuer kleine, in Europa gebaute BEV zu ersetzen. Gleichzeitig ueberholt BYD mit 2,1 Prozent Marktanteil erstmals Tesla in der EU.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}], "beratung": "Der wachsende BEV-Marktanteil und die Verschiebung hin zu 800-Volt-Plattformen erhoehen den Bedarf an spezialisierten E-Ersatzteilen und Ladezubehoer im Webshop-Sortiment. Gleichzeitig verschaerft der Vormarsch chinesischer Marken wie BYD den Preisdruck, waehrend klassische Zulieferer unter Margendruck stehen, ein Thema fuer Beratungsmandate zu Sortiments- und Lieferkettenstrategie.", "hvtraining": "Die schaerferen Euro-NCAP-Anforderungen an Thermal-Runaway-Erkennung erhoehen den Schulungsbedarf fuer Rettungskraefte und Werkstaetten im Umgang mit Batteriezwischenfaellen. Die jaehrliche Pflichtschulung nach DGUV 209-093 bleibt Kernanforderung, Trainingsinhalte sollten um 800-Volt-Spezifika ergaenzt werden, da diese Plattformen zum Standard werden."}, {"date": "2026-09-05", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt ID.Polo im September 2026 auf den Markt", "text": "Volkswagen startet den Verkauf des lange erwarteten ID.Polo, eines elektrischen Kompaktwagens im 400V-Segment. Parallel dazu erreichte BMW mit dem zweimillionsten vollelektrischen Fahrzeug (i5 M60 xDrive) einen Produktionsmeilenstein.", "url": "https://www.auto-motor-und-sport.de/elektroauto/neue-elektroautos-2026-das-werden-die-wichtigsten-e-neuheiten-des-jahres/", "urlLabel": "auto-motor-und-sport.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Marktanteil von E-Autos steigt auf 20 Prozent", "text": "Laut ACEA wurden zwischen Januar und Mai 2026 ueber 950.000 vollelektrische Autos in der EU zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahr. Italien, Frankreich und Deutschland verzeichnen die staerksten Zuwaechse.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "elektroauto-news.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026 bewertet Batterie-Thermal-Runaway-Warnsysteme", "text": "Die im Januar eingefuehrten Euro-NCAP-Protokolle 2026 vergeben in vier Kategorien detaillierte Bewertungen und honorieren speziell Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte automatisch alarmieren. Fuer 2026 sind zudem strengere Crashtests und verpflichtende Schulungen fuer Einsatzkraefte vorgesehen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue VDE-Regeln 4105/4100 fuer Ladeinfrastruktur in Kraft", "text": "Seit Maerz gelten aktualisierte VDE-Anwendungsregeln 4105 und 4100, die technische Anforderungen an den Anschluss von Erzeugungsanlagen ans Niederspannungsnetz neu definieren und direkte Auswirkungen auf die Ladeinfrastruktur fuer E-Fahrzeuge haben. Zudem bleibt die 800V-Architektur bei Neuplattformen ab 2025 Standard, waehrend 400V-Technik im Einstiegssegment bis Ende des Jahrzehnts weiterlaeuft.", "url": "https://de.wikipedia.org/wiki/Hochvolt", "urlLabel": "VDE / Hochvolt-Uebersicht"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Automobilzulieferer zwischen Schock und Umbruch", "text": "Eine aktuelle Oliver-Wyman-Studie zeigt: Waehrend Top-OEMs 2024/2025 im Schnitt um 10 Prozent wuchsen, sanken die Umsaetze der Top-Zulieferer um 3 Prozent. EBIT-Margen deutscher Zulieferer lagen 2025 vielfach unter 5 Prozent, zu wenig, um Investitionen aus eigener Kraft zu stemmen.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "oliverwyman.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Automechanika Frankfurt startet im September mit Rekordbeteiligung", "text": "Mit 4.500 Ausstellern, neuen KI-Formaten und einer Rekordzahl an Innovation Awards oeffnet die Automechanika Frankfurt im September ihre Tore. Die Messe gilt als wichtiger Gradmesser fuer Trends bei Ersatzteilen, Werkstattausruestung und digitalen Handelsprozessen.", "url": "https://www.automotive.at/", "urlLabel": "automotive.at"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU lockert Verbrenner-Verbot, plant neues System gegen China-EVs", "text": "Die EU-Kommission schlug im Dezember 2025 vor, das vollstaendige Verbrenner-Verbot durch ein Ziel von 90 Prozent Emissionsreduktion zu ersetzen, mit Superkrediten fuer kleine, in Europa gebaute BEV. Zusaetzlich kuendigte die Kommission im Januar 2026 ein neues Mindestpreissystem an, das die bisherigen Strafzoelle auf chinesische Elektroautos abloesen soll.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der Margendruck bei Zulieferern und die parallele Doppelinvestition in Verbrenner und BEV verschaerfen den Beratungsbedarf bei Kostenstruktur und Portfolio-Priorisierung. Fuer Ersatzteilehaendler bietet die Automechanika Frankfurt eine gute Gelegenheit, neue Digitalisierungs- und KI-Trends im Teilehandel zu beobachten. Die Lockerung des Verbrenner-Verbots durch die EU schafft zusaetzliche Planungsunsicherheit, die in Kundenprojekten beruecksichtigt werden sollte.", "hvtraining": "Die neuen Euro-NCAP-Kriterien zu Batterie-Thermal-Runaway erhoehen den Schulungsbedarf fuer Rettungskraefte und Werkstattpersonal im Umgang mit Warnsystemen. Die aktualisierten VDE-Regeln zur Ladeinfrastruktur sind fuer HV-Schulungen im Werkstattkontext direkt relevant. Der anhaltende Ausbau der 800V-Architektur bei Neuplattformen erfordert eine kontinuierliche Aktualisierung der Trainingsinhalte."}, {"date": "2026-08-24", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Elektroauto-Markt waechst auf 20 Prozent Marktanteil", "text": "Von Januar bis Mai 2026 wurden in der EU rund 950.000 vollelektrische Pkw neu zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahreszeitraum. Besonders stark wachsen Italien (+75,7%), Frankreich (+55,4%) und Deutschland (+40,9%).", "url": "https://www.go-electra.com/de/newsroom/electric-car-sales-2026-figures-in-Europe/", "urlLabel": "go-electra.com"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Hybride im Aufwind, EV-Nachfrage in Deutschland schwankt", "text": "Geopolitische Unsicherheiten im Nahen Osten beschleunigen laut Marktbeobachtern den Umstieg deutscher Kaeufer auf E-Autos, waehrend parallel Hybridmodelle wieder staerker nachgefragt werden. Gleichzeitig kuendigt Grossbritannien an, sein EV-Mandat zu lockern, was Herstellern mehr Flexibilitaet verschafft.", "url": "https://electrificationcoalition.org/ev-news-august-2026/", "urlLabel": "Electrification Coalition"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Bewertungskriterien fuer HV-Batteriesicherheit", "text": "Die im Januar 2026 eingefuehrten Euro-NCAP-Protokolle vergeben erstmals Punkte fuer Systeme, die einen thermischen Durchgehprozess (Thermal Runaway) der Batterie erkennen und automatisch den Rettungsdienst alarmieren. Ergaenzend gelten verschaerfte Crashtests und neue Vorgaben zur Batteriedauerhaltbarkeit.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Aktualisierte VDE-Anwendungsregeln fuer Ladeinfrastruktur", "text": "Seit Maerz 2026 gelten ueberarbeitete VDE-Anwendungsregeln 4105 und 4100 fuer den Netzanschluss von Erzeugungsanlagen im Niederspannungsnetz. Neu ist zudem eine verpflichtende netzdienliche Steuerung fuer Grossverbraucher wie Wallboxen, was fuer Werkstaetten und Errichter praktische Konsequenzen hat.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer zwischen Schock und Umbruch", "text": "Laut aktueller Oliver-Wyman-Studie stehen deutsche Automobilzulieferer 2026 vor strukturellen statt zyklischen Problemen: hohe Standort- und Transformationskosten, Volumenverluste an asiatische Wettbewerber und die parallele Investition in Verbrenner- und BEV-Technologie. Die EBIT-Margen liegen 2025 vielfach unter 5 Prozent.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / Software", "title": "Software-Defined Vehicles erhoehen Systemanforderungen an Zulieferer", "text": "OEMs fordern zunehmend integrierte Loesungen statt Einzelkomponenten und verlangen von Zulieferern hoehere Systemkompetenz sowie Integrationsfaehigkeit in digitale Fahrzeugarchitekturen. Elektrifizierung, SDV-Trends und Lieferkettenvolatilitaet wirken 2026 gleichzeitig auf die Branche.", "url": "https://abas-erp.com/en/blog/automotive-industry-trends", "urlLabel": "abas-erp.com"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus 2035 auf, Mindestpreissystem fuer China-EVs", "text": "Das im Dezember vorgelegte Automobilpaket der EU-Kommission sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor. Parallel greift seit Januar ein Mindestpreissystem fuer chinesische E-Autos, um Strafzoelle zu vermeiden und den europaeischen Markt zu schuetzen.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der EU-Marktanteil von 20 Prozent bei BEVs und die gleichzeitige Aufweichung des Verbrenner-Ausstiegs zeigen: Webshop-Sortimente fuer Ersatzteile sollten auf eine laengere Koexistenz von Verbrenner-, Hybrid- und BEV-Technik ausgelegt bleiben, statt einseitig auf reine E-Antriebe zu setzen. Fuer Zulieferer und Haendler wird Systemkompetenz statt Einzelteilverkauf zum Differenzierungsmerkmal, gerade angesichts des Margendrucks bei deutschen Zulieferern.", "hvtraining": "Die neuen Euro-NCAP-Kriterien zur Thermal-Runaway-Erkennung erhoehen den Schulungsbedarf zu Batteriediagnose und Rettungsprozessen bei Werkstaetten und Rettungsdiensten. Auch die aktualisierten VDE-Regeln 4100/4105 zur netzdienlichen Steuerung von Wallboxen sollten in HV-Trainings fuer Errichter und Servicetechniker aufgenommen werden."}, {"date": "2026-08-20", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Neuzulassungen in Deutschland steigen im Juli um 62 Prozent", "text": "Im Juli 2026 machten Elektrofahrzeuge rund 30 Prozent der Neuzulassungen in Deutschland aus, ein Plus von 62 Prozent gegenueber dem Vorjahr. Der Trend bestaetigt die beschleunigte Marktdurchdringung batterieelektrischer Fahrzeuge in der zweiten Jahreshaelfte 2026.", "url": "https://www.elektroauto-news.net/news/eauto-neuzulassungen-juli-2026-plus-62-prozent", "urlLabel": "Elektroauto-News.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-weiter E-Auto-Marktanteil erreicht 20 Prozent", "text": "Zwischen Januar und Mai 2026 wurden in der EU rund 950.500 vollelektrische Fahrzeuge zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahreszeitraum. Verschaerfte CO2-Flottenziele der Hersteller treiben diesen Strukturwandel zusaetzlich an.", "url": "https://www.go-electra.com/de/newsroom/electric-car-sales-2026-figures-in-Europe/", "urlLabel": "go-electra.com"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "VW und Cupra rufen fast 100.000 E-Autos wegen Hochvolt-Batterie zurueck", "text": "Volkswagen und Cupra rufen weltweit rund 94.000 Elektrofahrzeuge der Modelle ID.3, ID.4, ID.5, ID.Buzz und Cupra Born zurueck, davon etwa 28.000 in Deutschland. Ursache ist ein moegliches Modulproblem in der Hochvoltbatterie, das zu Reichweitenverlust, Warnleuchten oder im Extremfall zu thermischer Ueberlastung und Fahrzeugbrand fuehren kann.", "url": "https://www.vau-max.de/magazin/news/vw-rueckruf-elektroautos-brandgefahr-id-modelle-2026.10944", "urlLabel": "VAU-MAX"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Ford ruft Kuga PHEV wegen Batteriedefekt und Brandgefahr zurueck", "text": "Die Rueckrufaktion 15919R betrifft Ford-Kuga-Plug-in-Hybride, die zwischen August 2019 und Maerz 2026 produziert wurden. Grund ist ein Batteriedefekt mit moeglicher Brandgefahr, was den anhaltenden Qualitaetsdruck bei Hochvolt-Komponenten in Plug-in-Hybriden unterstreicht.", "url": "https://hh-autos.com/ford-kuga-phev-akku-rueckruf-brandgefahr-kba/", "urlLabel": "hh-autos.com"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Automobilzulieferer zwischen Schock und Umbruch", "text": "Laut einer aktuellen Oliver-Wyman-Studie lagen die EBIT-Margen deutscher Zulieferer 2025 mehrheitlich unter 5 Prozent, zu wenig fuer eigenstaendige Investitionsfinanzierung. Hohe Standort- und Transformationskosten sowie die parallele Investition in Verbrenner- und BEV-Technik verschaerfen den strukturellen Druck.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Kommission plant Aufweichung des Verbrenner-Aus 2035", "text": "Das im Dezember vorgelegte Automobilpaket der EU-Kommission sieht vor, das faktische Verbrenner-Aus 2035 um zehn Prozent aufzuweichen. Fuer Berater und Werkstattbetriebe bedeutet das laengere Planungsunsicherheit bei der Antriebsstrategie.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "Elektroauto-News.net"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU ersetzt Strafzoelle fuer China-E-Autos durch Mindestpreis-System", "text": "Seit Januar 2026 koennen chinesische Hersteller die bisherigen Strafzoelle umgehen, indem sie sich zu einem festgelegten Mindestverkaufspreis fuer ihre E-Autos in der EU verpflichten. Das neue System soll fairen Wettbewerb sichern, ohne den Marktzugang chinesischer Marken vollstaendig zu blockieren.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Die Rueckrufwellen bei VW/Cupra und Ford Kuga PHEV wegen Hochvolt-Batteriedefekten erhoehen kurzfristig den Werkstattbedarf fuer Zellmodultausch und schaffen zusaetzliche Nachfrage nach Original- und Alternativteilen im B2B/B2C-Ersatzteilhandel. Gleichzeitig bleibt der strukturelle Margendruck bei deutschen Zulieferern (EBIT unter 5 Prozent) ein zentrales Beratungsthema fuer Sourcing- und Prozessstrategien.", "hvtraining": "Die Rueckrufe wegen thermischer Ueberlastung bei ID.3/ID.4/Cupra Born und Ford Kuga PHEV liefern aktuelle Praxisbeispiele fuer HV-Schulungen zu Batteriediagnose, Modulwechsel und Brandschutzmassnahmen. Werkstattpersonal sollte gezielt auf die Erkennung fruehzeitiger Warnsignale (Reichweitenverlust, Kontrollleuchten) bei betroffenen Modellen geschult werden."}, {"date": "2026-08-10", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Neuzulassungen in Deutschland steigen deutlich", "text": "Im Juli 2026 wurden 78.609 neue Elektroautos zugelassen, ein Plus von 61,7 Prozent gegenueber dem Vorjahr und fast so viele wie Benziner und Diesel zusammen. E-Autos erreichten damit rund 30 Prozent aller Neuzulassungen.", "url": "https://www.elektroauto-news.net/news/eauto-neuzulassungen-juli-2026-plus-62-prozent", "urlLabel": "elektroauto-news.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Marktanteil von E-Autos erreicht 20 Prozent", "text": "Zwischen Januar und Mai 2026 wurden in der EU 950.521 vollelektrische Fahrzeuge zugelassen, das entspricht 20 Prozent Marktanteil gegenueber 15,3 Prozent im Vorjahr. Benzin und Diesel fielen zusammen auf nur noch 30,1 Prozent.", "url": "https://www.go-electra.com/de/newsroom/electric-car-sales-2026-figures-in-Europe/", "urlLabel": "go-electra.com"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue Sicherheitsstandards fuer E-Autos ab 2026", "text": "Neue Vorschriften verschaerfen Crashtests und Batteriehaltbarkeitsanforderungen. Systeme zur Erkennung von Thermal Runaway mit automatischer Rettungsdienst-Alarmierung sowie verpflichtende Schulungen fuer Rettungskraefte werden Standard.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "IATF 16949 und ISO/SAE 21434: strengere Anforderungen an Batterien und Cybersecurity", "text": "Fuer 2026 wird eine neue IATF-16949-Revision mit konkreteren Vorgaben zu Handling, Transport und Ruecknahme von Batterien erwartet. Parallel wachsen die Anforderungen an Software- und Cybersecurity-Management gemaess ISO/SAE 21434 durch den steigenden Softwareanteil in Fahrzeugen.", "url": "https://smct-management.de/iatf-16949-neuerungen-2026/", "urlLabel": "smct-management.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer zwischen Schock und Umbruch", "text": "Laut einer Oliver-Wyman-Studie lagen die EBIT-Margen deutscher Zulieferer 2025 vielfach unter 5 Prozent, zu wenig, um Investitionen aus eigener Kraft zu stemmen. Elektrifizierung, Software-Defined Vehicles und geopolitische Fragmentierung erzwingen eine strukturelle Neuausrichtung der Branche.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "oliverwyman.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU plant Mindestpreissystem fuer chinesische E-Autos", "text": "Die EU-Kommission kuendigte ein System an, das die bisherigen Strafzoelle ersetzen koennte: Chinesische Hersteller verpflichten sich zu einem Mindestverkaufspreis in der EU statt pauschaler Zoelle. Erste Details werden 2026 konkretisiert.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Automobilpaket weicht Verbrenner-Aus 2035 auf", "text": "Das im Dezember vorgelegte EU-Automobilpaket sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor. Zugleich uebererfuellen viele Hersteller 2026 ihre CO2-Flottenziele, statt auf regulatorisches Pooling zu setzen.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}], "beratung": "Die Zulieferer-Margen unter 5 Prozent und der Trend zu \"Local for Local\" zeigen: Webshop- und Prozessoptimierung fuer Ersatzteilehaendler wird zum Ueberlebensfaktor, nicht zur Kuer. Gleichzeitig oeffnet der steigende E-Auto-Bestand (20 Prozent EU-Marktanteil) neue Geschaeftsfelder fuer HV-Ersatzteile und Batteriedienstleistungen im B2B/B2C-Handel.", "hvtraining": "Die verschaerften Anforderungen an Thermal-Runaway-Erkennung und die Pflichtschulungen fuer Rettungskraefte erhoehen den Bedarf an praxisnahen HV-Sicherheitsschulungen deutlich. Auch ISO/SAE 21434 rueckt Cybersecurity staerker in den Fokus von HV-Qualifizierungen fuer Werkstaetten und Maschinenbetreiber."}, {"date": "2026-07-27", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Boom in Deutschland: BEV-Zulassungen im Juni +78 Prozent", "text": "Im Juni 2026 stiegen die Neuzulassungen batterieelektrischer Fahrzeuge in Deutschland um 78,2 Prozent auf 84.057 Einheiten, der Marktanteil kletterte auf 28,4 Prozent. Im ersten Halbjahr summierte sich das Plus auf 48 Prozent gegenueber dem Vorjahr.", "url": "https://www.auto-motor-und-sport.de/verkehr/neuzulassungen-juni-2026-elektroautos-boomen-und-ueberholen-die-verbrenner/", "urlLabel": "auto motor und sport"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-weiter E-Auto-Marktanteil erreicht 20,7 Prozent", "text": "Im ersten Halbjahr 2026 wurden in der EU 1,22 Millionen neue Elektroautos zugelassen, der Marktanteil stieg von 15,6 auf 20,7 Prozent. Fuer Werkstaetten und Haendler bedeutet das steigenden Bedarf an HV-qualifiziertem Personal.", "url": "https://ecomento.de/2026/07/23/elektroautos-mit-207-marktanteil-in-der-eu-im-ersten-halbjahr-2026/", "urlLabel": "ecomento.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Punkte fuer Thermal-Runaway-Erkennung", "text": "Die im Januar eingefuehrten Euro-NCAP-2026-Protokolle bewerten erstmals gezielt Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte warnen. Zusaetzlich gelten verschaerfte Crashtests und neue Batterie-Haltbarkeitsvorschriften.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue DGUV-Information zu Arbeiten an Hochvolt-Fahrzeugen", "text": "Die DGUV hat eine aktualisierte Information zur sicheren Arbeit an HV-Systemen in Kraftfahrzeugen veroeffentlicht. Sie konkretisiert Qualifikationsstufen und Schutzmassnahmen und ist direkt relevant fuer die Trainingspraxis.", "url": "https://www.kfz-hh.de/neue-dguv-information-zur-arbeit-an-hochvolt-fahrzeugen", "urlLabel": "kfz-hh.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer im Umbruch: EBIT-Margen unter 5 Prozent", "text": "Laut Oliver-Wyman-Studie stehen deutsche Automobilzulieferer wegen hoher Standortkosten, Volumenverlusten an asiatische Wettbewerber und paralleler Investitionen in Verbrenner- und BEV-Technik strukturell unter Druck. Die EBIT-Margen 2025 lagen deutlich unter dem Niveau, das fuer Eigenfinanzierung noetig waere.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Automobilpaket: Aufweichung des Verbrenner-Aus 2035 im Gespraech", "text": "Das von der EU-Kommission vorgelegte Automobilpaket sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor und liegt aktuell bei Parlament und Rat. Gleichzeitig zwingen die strengen CO2-Flottenzielwerte (rund 93,6 g/km) Hersteller weiter zu hohen Elektro-Quoten.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "elektroauto-news.net"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Mindestpreissystem fuer chinesische E-Autos startet", "text": "Seit Januar 2026 koennen chinesische Hersteller anstelle der bisherigen Strafzoelle ein Mindestpreissystem nutzen und sich verpflichten, ihre E-Autos in der EU nicht unter einem festgelegten Mindestpreis zu verkaufen. Das veraendert die Wettbewerbslage fuer europaeische OEMs und Haendler.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der anhaltende BEV-Boom bei gleichzeitig strukturell schwachen Zulieferer-Margen verschaerft den Beratungsbedarf entlang der Wertschoepfungskette, insbesondere bei Kosten- und Sourcing-Strategien fuer Werkstaetten und Haendler. Das drohende Mindestpreissystem fuer chinesische E-Autos veraendert kurzfristig die Einkaufs- und Wettbewerbslage im Ersatzteilhandel und sollte in B2B/B2C-Webshop-Strategien beruecksichtigt werden.", "hvtraining": "Die neue DGUV-Information sowie die verschaerften Euro-NCAP-Kriterien zur Thermal-Runaway-Erkennung erhoehen den Aktualisierungsbedarf in HV-Schulungen fuer Werkstaetten und Rettungskraefte. Mit dem steigenden BEV-Marktanteil (28,4% in Deutschland) waechst parallel die Nachfrage nach qualifiziertem Personal fuer Arbeiten an Hochvoltsystemen."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
