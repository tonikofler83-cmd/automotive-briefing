<html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Automotive Briefing – Archiv</title><style>:root{color-scheme:light}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:15px;line-height:1.5;padding:0 0 32px}.header{background:#1d1d1f;color:#fff;padding:16px 16px 10px;position:sticky;top:0;z-index:10}.header h1{font-size:17px;font-weight:700}.header .meta{font-size:12px;color:#aeaeb2;margin-top:2px}.date-scroll{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.date-scroll::-webkit-scrollbar{display:none}.dpill{flex-shrink:0;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;background:#2c2c2e;color:#aeaeb2;border:1.5px solid #3a3a3c;white-space:nowrap;transition:all .15s}.dpill.active{background:#fff;color:#1d1d1f;border-color:#fff}.tag-bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;transition:opacity .15s}.tag.ev{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32}.tag.hv{background:#fff3e0;color:#e65100;border-color:#e65100}.tag.branche{background:#e3f2fd;color:#1565c0;border-color:#1565c0}.tag.all{background:#f3e5f5;color:#6a1b9a;border-color:#6a1b9a}.tag.inactive{opacity:.3}.content{padding:12px 12px 0}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #ccc}.card.ev{border-left-color:#2e7d32}.card.hv{border-left-color:#e65100}.card.branche{border-left-color:#1565c0}.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.card.ev .card-label{color:#2e7d32}.card.hv .card-label{color:#e65100}.card.branche .card-label{color:#1565c0}.card h2{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date":"2026-06-11","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq haelt Spitzenplatz – 25 % BEV-Anteil im Mai 2026","text":"Mit 3.083 Neuzulassungen im Mai behauptet sich der Skoda Elroq als meistgekauftes Elektroauto in Deutschland, knapp vor VW ID.3 (3.050) und Skoda Enyaq (2.770). Der Gesamt-BEV-Marktanteil liegt bei 25 Prozent; seit Jahresbeginn wurden 283.949 reine Elektroautos neu zugelassen.","url":"https://www.goingelectric.de/2026/06/06/news/zulassungszahlen-fuer-elektroautos-und-plug-in-hybride-im-mai-2026/","urlLabel":"GoingElectric"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Europa startet mit 20 % BEV-Anteil ins Jahr – 30 % zum Jahresende erwartet","text":"Der europaeische EV-Markt begann 2026 mit einem BEV-Anteil von 20 Prozent im Januar. Der VDA prognostiziert rund 700.000 E-Auto-Neuzulassungen in Deutschland fuer das Gesamtjahr – ein Plus von 30 Prozent gegenueber 2025. Treiber sind neue Niedrigpreismodelle und der Druck durch CO2-Flottengrenzwerte.","url":"https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share","urlLabel":"EAFO / EU-Kommission"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Studie: Europa liegt nur noch drei Jahre hinter China bei Elektromobilitaet","text":"Laut einer im Maerz 2026 veroeffentlichten Analyse hat Europa den Technologie- und Marktrueckstand gegenueber China deutlich reduziert. In Schluessel-Metriken wie Batterietechnik, Ladeinfrastrukturdichte und Marktdurchdringung betraegt der Abstand noch rund drei Jahre – sofern das Investitionsniveau gehalten wird.","url":"https://ecomento.de/2026/03/25/europa-holt-bei-elektroautos-auf-und-liegt-nur-noch-drei-jahre-hinter-china-studie/","urlLabel":"ecomento"},{"cat":"hv","label":"Hochvoltsysteme","title":"CO2-Flottengrenzwerte senken E-Auto-Preise um 1.800 EUR – Kostendruck auf HV-Komponenten","text":"Die EU-CO2-Regulierung zwingt Hersteller, verstaerkt guenstigere Elektromodelle anzubieten. Der Durchschnittspreis fuer ein E-Auto sank 2025 um rund 1.800 Euro. Fuer HV-Systemintegratoren und Zulieferer bedeutet dies steigenden Kostendruck auf Batteriemodule und Leistungselektronik bei gleichzeitig wachsenden Stueckzahlen.","url":"https://www.firmenauto.de/management/fuhrparkmanagement/co2-flottengrenzwerte-druecken-preise-elektroautos-europa-analyse-t-e/","urlLabel":"firmenauto"},{"cat":"hv","label":"Hochvoltsysteme","title":"VDE 4105 / 4100 aktualisiert – neue Vorgaben fuer HV-Ladeinfrastruktur seit Maerz 2026","text":"Die seit Maerz 2026 geltenden aktualisierten VDE-Anwendungsregeln 4105 und 4100 definieren technische Anforderungen fuer den Anschluss von Ladeinfrastruktur ans Niederspannungsnetz neu. Fuer HV-Trainer und Planungsbetriebe relevant: Zertifizierungen und Installationsnachweise muessen auf den neuen Stand gebracht werden.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"Ad-hoc-news"},{"cat":"branche","label":"Branche / Zulieferer","title":"Oliver Wyman: 59 Zulieferer-Insolvenzen 2025 – strukturelle Krise ohne Trendwende","text":"Laut Oliver Wyman-Studie gab es 2020-2025 insgesamt 257 Insolvenzen bei Automobilzulieferern, davon 59 allein in 2025. EBIT-Margen liegen verbreitet unter 5 %, zu wenig fuer Eigenmittelfinanzierung des Technologiewandels. Die Krise ist strukturell bedingt durch Kostendruck, Verlagerung nach Asien und den Doppelaufwand Verbrenner/BEV.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungss:ielraum.html","urlLabel":"Oliver Wyman"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU-Automobilpaket: Verbrenner-Ausnahme fuer E-Fuels nach 2035 beschlossen","text":"Die EU hat den Rechtsrahmen so angepasst, dass Neuwagen mit Verbrenner nach 2035 zugelassen werden duerfen, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden. Das Kommissions-Automobilpaket sieht zudem eine faktische Aufweichung des Verbrennerausstiegs um rund 10 Prozent vor – sieben EU-Laender hatten auf einem pragmatischeren Kurs bestanden.","url":"https://www.cleanthinking.de/elektroauto-disruption-verbrenner-aus/","urlLabel":"cleanthinking"}],"beratung":"Der Preisdruck durch CO2-Grenzwerte und die anhaltende Zuliefererkrise bilden einen Schereneffekt: OEM-Margen sinken, waehrend der Investitionsbedarf in Elektrifizierung und Software steigt. Fuer Beratungsmandate sind Kostenstruktur-Analysen und Make-or-Buy-Entscheidungen im Software- und Batterie-Bereich aktuell die dringlichsten Themen – besonders fuer Tier-1-Kunden mit noch hohem Verbrenner-Anteil.","hvtraining":"Die Kombination aus aktualisierten VDE-Regeln 4105/4100 und der DGUV 209-093 bildet das neue Normenfundament fuer HV-Qualifizierungen 2026. Wer Schulungsunterlagen noch auf dem Stand von 2024 hat, muss jetzt nachziehen – besonders relevant fuer Kunden mit Ladeinfrastruktur-Technikern oder Wartungspersonal an industriellen HV-Systemen."},{"date":"2026-06-10","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq verdraengt Tesla Model Y – 25 % BEV-Anteil im Mai 2026","text":"Mit 16.823 Neuzulassungen ist der Skoda Elroq das meistgekaufte E-Auto in Deutschland. Im Mai 2026 erreichten reine Elektroautos einen Marktanteil von 25 Prozent; seit Jahresbeginn wurden 283.949 neue BEV zugelassen.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"Basic Thinking"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Epiq startet Serienproduktion – Einstiegs-SUV ab 26.000 Euro","text":"Im VW-Werk Pamplona hat die Serienproduktion des Skoda Epiq begonnen. Das Kompakt-SUV basiert auf der neuen MEB+-Plattform und ist eines von 66 neuen E-Modellen, die 2026 auf den europaeischen Markt kommen.","url":"https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/","urlLabel":"ADAC"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093 loest 200-005 ab – neuer HV-Qualifikationsstandard","text":"Die DGUV Information 209-093 ist der neue massgebliche Standard fuer HV-Qualifikationen in Deutschland. Gleichzeitig gelten seit Maerz 2026 die aktualisierten VDE-Anwendungsregeln 4105 und 4100 mit direkter Auswirkung auf Ladeinfrastruktur und Qualifikationsnachweise.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"Pressewissen"},{"cat":"hv","label":"Hochvoltsysteme","title":"EU GSR ab Juli 2026 voll in Kraft – erweiterte Assistenzsysteme Pflicht","text":"Die EU General Safety Regulation tritt im Juli 2026 vollstaendig in Kraft: Alle neu zugelassenen Fahrzeuge muessen dann erweiterte Fahrerassistenzsysteme vorweisen. Das vergroessert den sicherheitsrelevanten Systemumfang in HV-Fahrzeugen erheblich.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/newe-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"Ad-hoc-news"},{"cat":"branche","label":"Branche / Software","title":"11 OEMs und Zulieferer gruenden Open-Source-Allianz fuer Fahrzeugsoftware","text":"Mercedes-Benz, BMW, Volkswagen, Bosch, Continental und sechs weitere Unternehmen unterzeichnen beim Automobil Elektronik Kongress ein MoU. Der gemeinsame Core-Stack soll Middleware, Betriebssystem und Kommunikationsdienste auf Open-Source-Basis abdecken.","url":"https://www.automotiveit.eu/strategy/autoindustrie-rueckt-bei-softwareentwicklung-enger-zusammen/904096","urlLabel":"automotive IT"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU plant Pflichtquoten fuer E-Firmenwagen ab 2030","text":"Die EU-Kommission will grosse Unternehmen gesetzlich verpflichten, ab 2030 Mindestanteile an Elektro- und Niedrigemissionsfahrzeugen in Fuhrparks nachzuweisen. Branchenverbaende kritisieren die Massnahme als marktverzerrend.","url":"https://www.handelsblatt.com/politik/international/eu-kommission-verbaende-kritisieren-moegliche-pflichtquoten-fuer-e-firmenwagen/100231068.html","urlLabel":"Handelsblatt"},{"cat":"branche","label":"Branche / Zulieferer","title":"Zuliefererkrise: 59 Insolvenzen 2025 – strukturelle Herausforderung","text":"Laut Oliver Wyman gab es 2020-2025 insgesamt 257 Insolvenzen bei Zulieferern ueber 10 Mio. EUR Umsatz, davon 59 allein in 2025. Die Krise ist nicht mehr zyklisch, sondern strukturell bedingt durch Kostendruck, Technologiewandel und sinkende Margen.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"}],"beratung":"Die Zulieferer-Strukturkrise und die OEM-Open-Source-Allianz verschieben den Beratungsbedarf: Kunden benoetigen jetzt strategische Orientierung zu Portfolio- und Make-or-Buy-Entscheidungen im Software-Bereich. Besonders Tier-2- und Tier-3-Lieferanten muessen klaeren, welche Kompetenzen noch Differenzierungspotenzial bieten und welche in den Open-Source-Pool wandern.","hvtraining":"Die Abloesung der DGUV 200-005 durch 209-093 erfordert unmittelbare Pruefung der Schulungsunterlagen auf aktualisierte Qualifikationsstufen und Nachweispflichten. Ab Juli 2026 greift die EU-GSR-Pflicht fuer Assistenzsysteme – das erweitert den relevanten Fahrzeugumfang und bietet einen konkreten Anlass fuer Neukundenakquise."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
