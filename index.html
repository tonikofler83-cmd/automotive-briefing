<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Automotive Briefing – Archiv</title>
<style>
  :root{color-scheme:light}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:15px;line-height:1.5;padding:0 0 32px}.header{background:#1d1d1f;color:#fff;padding:16px 16px 10px;position:sticky;top:0;z-index:10}.header h1{font-size:17px;font-weight:700}.header .meta{font-size:12px;color:#aeaeb2;margin-top:2px}.date-scroll{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.date-scroll::-webkit-scrollbar{display:none}.dpill{flex-shrink:0;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;background:#2c2c2e;color:#aeaeb2;border:1.5px solid #3a3a3c;white-space:nowrap;transition:all .15s}.dpill.active{background:#fff;color:#1d1d1f;border-color:#fff}.tag-bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;transition:opacity .15s}.tag.ev{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32}.tag.hv{background:#fff3e0;color:#e65100;border-color:#e65100}.tag.branche{background:#e3f2fd;color:#1565c0;border-color:#1565c0}.tag.all{background:#f3e5f5;color:#6a1b9a;border-color:#6a1b9a}.tag.inactive{opacity:.3}.content{padding:12px 12px 0}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #ccc}.card.ev{border-left-color:#2e7d32}.card.hv{border-left-color:#e65100}.card.branche{border-left-color:#1565c0}.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.card.ev .card-label{color:#2e7d32}.card.hv .card-label{color:#e65100}.card.branche .card-label{color:#1565c0}.card h2{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}
</style>
</head>
<body>
<div class="header">
  <h1>Automotive Briefing</h1>
  <div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div>
  <div class="date-scroll" id="dateTabs"></div>
  <div class="tag-bar">
    <span class="tag all" onclick="setFilter('all')">Alle</span>
    <span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span>
    <span class="tag hv" onclick="setFilter('hv')">Hochvolt</span>
    <span class="tag branche" onclick="setFilter('branche')">Branche / EU</span>
  </div>
</div>
<div class="content" id="cards"></div>
<div class="highlight-box" id="highlight">
  <h3>Einschaetzung des Tages</h3>
  <div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div>
  <div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div>
</div>
<script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date":"2026-06-10","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq #1 in Deutschland – 25 % BEV-Marktanteil im Mai 2026","text":"Mit 16.823 Neuzulassungen verdraengt der Skoda Elroq das Tesla Model Y vom ersten Platz (VW ID.3 auf #2). Im Mai 2026 erreichten reine BEV 25,0 % Marktanteil; ytd bereits 283.949 neue Elektroautos in Deutschland zugelassen.","url":"https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/","urlLabel":"Business Insider DE"},{"cat":"ev","label":"Elektrofahrzeuge","title":"EU Q1 2026: +24,7 % BEV-Wachstum – Deutschland als Wachstumstreiber","text":"694.000 Neuzulassungen europaweit im Q1, +24,7 % zum Vorjahr. Deutschland fuehrt nach Volumen: allein im Maerz 2026 wurden 70.663 neue BEV zugelassen (+66 % zum Vorjahresmonat). EU-Anteil Jan-Apr bei 19,7 %.","url":"https://ecomento.de/2026/05/27/januar-bis-april-2026-elektroauto-anteil-in-der-eu-bei-19-7-prozent/","urlLabel":"ecomento.de"},{"cat":"hv","label":"Hochvoltsysteme","title":"EU-Batterieverordnung: CO2-Kennzeichnung fuer Traktionsbatterien ab 18.08.2026 Pflicht","text":"Ab 18.08.2026 muessen Traktionsbatterien in CO2-Leistungsklassen gekennzeichnet sein (EU-VO 2023/1542). Digitaler Batteriepass (State of Health, Materialtransparenz) folgt 2027 fuer EV-Batterien groesser 2 kWh.","url":"https://www.lufapak.de/en/eu-battery-regulation-2026-2027/","urlLabel":"lufapak.de"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093 + VDE 4105/4100 – Normenlage aktualisiert","text":"DGUV Information 209-093 loest 200-005 als massgeblichen Standard fuer HV-Qualifikationen ab. Aktualisierte VDE-Anwendungsregeln 4105/4100 seit Maerz 2026 mit direkter Auswirkung auf Ladeinfrastruktur und Qualifikationsnachweise.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"pressewissen.de"},{"cat":"branche","label":"Branche / Zulieferer","title":"Strukturkrise Zulieferer: 59 Insolvenzen 2025, EBIT-Margen unter 5 %","text":"Oliver Wyman 2026: Die Krise ist strukturell, nicht zyklisch. 59 Insolvenzen 2025 (nach 56 in 2024), EBIT oft unter 5 %. Doppelbelastung Verbrenner/BEV und asiatischer Kostendruck machen Eigenfinanzierung unmoeglich.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"},{"cat":"branche","label":"Branche / Software","title":"OEM Open-Source-Allianz: Mercedes, BMW, VW, Bosch, Continental kooperieren bei SDV","text":"11 OEMs und Zulieferer unterzeichnen MoU fuer gemeinsame nicht-differenzierende Softwareentwicklung. BMW Neue Klasse (2026) mit SuperBrain-ECU-Architektur, VW.OS ueber alle Konzernmarken. AGL SoDeV seit Mai 2026 verfuegbar.","url":"https://www.automotiveit.eu/strategy/autoindustrie-rueckt-bei-softwareentwicklung-enger-zusammen/904096","urlLabel":"automotiveit.eu"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU-Regulierung: Foerderung und Compliance-Last fuer Europas EV-Industrie","text":"Flottengrenzwerte und Batterieverordnung foerdern heimische Investitionen, erhoehen aber Compliance-Aufwand erheblich. Tier-2/3-Zulieferer stehen vor substanziellen Umstellungskosten; koordinierter EU-Begleitrahmen gefordert.","url":"https://www.elektroauto-news.net/news/europa-regulierung-hilfe-schaden-parallel","urlLabel":"elektroauto-news.net"}],"beratung":"Die Zulieferer-Strukturkrise (Oliver Wyman) ist strategisch dominant: Kunden stehen vor Portfolio-, Plattform- und M&A-Entscheidungen. Die OEM-SDV-Kooperation erzwingt eine Neubewertung von Make-or-Buy in der Softwareentwicklung.","hvtraining":"Handlungsdringlichkeit hoch: Kennzeichnungspflicht fuer Traktionsbatterien ab 18.08.2026 (EU-VO 2023/1542). Schulungsunterlagen jetzt um CO2-Leistungsklassen und Batteriepass erganzen. DGUV 209-093 und VDE 4105/4100 einarbeiten."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script>
</body>
</html>
