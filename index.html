ne-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date":"2026-06-29","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq bleibt Marktfuehrer – BEV-Anteil bei 25 % in Deutschland","text":"Der Skoda Elroq verdraengt das Tesla Model Y und fuehrt mit 16.823 Neuzulassungen (kumuliert) die deutsche EV-Rangliste 2026 an. VW ID.3 und Skoda Enyaq folgen auf den Plaetzen zwei und drei. Der VW-Konzern haelt mit 23,6 Prozent Marktanteil die Fuehrungsposition im europaeischen EV-Markt.","url":"https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/","urlLabel":"Business Insider"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Staatliche Kaufpraemie greift: EV-Neuzulassungen steigen um 39 %","text":"Seit Mai 2026 ist die neue gestaffelte Umweltpraemie (1.500 bis 6.000 Euro je nach Einkommen und Kinderzahl) beantragbar. Im ersten Monat wurden 59.969 reine Elektrofahrzeuge zugelassen – ein Marktanteil von 25 Prozent und ein Plus von 39,3 Prozent gegenueber dem Vorjahresmonat. Die Massnahme zeigt sofortige Wirkung auf das Kaufverhalten.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"basicthinking.de"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Europa: 950.521 BEV in fuenf Monaten – 20 % Marktanteil EU-weit","text":"Von Januar bis Mai 2026 wurden in der EU insgesamt 950.521 batterieelektrische Fahrzeuge neu zugelassen, was einem Marktanteil von 20 Prozent entspricht. Analysten erwarten, dass BEV bis Ende 2026 rund 25 Prozent der EU-Neuzulassungen erreichen. China-Marken bauen ihren Europa-Anteil in der Mittelklasse zunehmend aus.","url":"https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share","urlLabel":"EAFO / EU-Kommission"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093 und VDE 4105/4100: Neues Normenfundament fuer HV-Qualifikationen","text":"Die DGUV Information 209-093 ist der aktuell gueltiger Pflichtstandard fuer alle Beschaeftigten, die Fahrzeuge mit Hochvolt- oder Gasantriebssystemen bedienen oder warten – von der sensibilisierten Person bis zur Fachkraft. Die seit Maerz 2026 aktualisierten VDE-Anwendungsregeln 4105 und 4100 definieren neue technische Anforderungen fuer den Anschluss von Ladeinfrastruktur. Schulungsunterlagen auf aelterem Stand muessen umgehend geprueft und aktualisiert werden.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"Pressewissen / DGUV"},{"cat":"hv","label":"Hochvoltsysteme","title":"Verscharfte EU-Sicherheitspflichten 2026: Crashtest, Batteriehaltbarkeit, Rettungskraefte","text":"Ab 2026 gelten verscharfte EU-Crashtest-Anforderungen fuer Elektrofahrzeuge sowie verbindliche Batterie-Haltbarkeitsvorschriften. Erstmals sind auch Pflichtschulungen fuer Rettungskraefte im Umgang mit HV-Systemen vorgeschrieben. Die Neuregelungen erhoehen die Anforderungen an Fahrzeugentwicklung und betriebliche Sicherheitskonzepte gleichermassen.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"ad-hoc-news.de"},{"cat":"branche","label":"Branche / Zulieferer","title":"VW-Konzernchef Blume: 6-Milliarden-Sparpaket auf Hauptversammlung Juni 2026","text":"Volkswagen-CEO Oliver Blume kuendigte auf der digitalen Hauptversammlung im Juni 2026 einen Zukunftsplan mit jaehrlichen Netto-Einsparungen von mehr als 6 Milliarden Euro an. Im Hintergrund: Die Zuliefererkrise vertieft sich – laut Oliver Wyman gab es 2020-2025 insgesamt 257 Zulieferer-Insolvenzen, davon 59 allein in 2025. Deutsche Zulieferer kaempfen mit EBIT-Margen unter 5 Prozent.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU CO2-Flottenziel 93,6 g/km: OEMs und Nutzfahrzeughersteller unter Strafzahlungs-Druck","text":"Die EU-CO2-Regulierung fuer Pkw (ca. 93,6 g/km) zwingt Hersteller zu hohen Elektro-Quoten – bei Nichteinhaltung drohen Milliarden-Strafzahlungen. Gleichzeitig greift die erste EU-CO2-Regulierung fuer Nutzfahrzeuge ab dem zweiten Halbjahr 2025. Ein Treiber fuer den EV-Hochlauf: Der Durchschnittspreis fuer Elektroautos sank 2025 durch regulatorischen Druck um rund 1.800 Euro.","url":"https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/","urlLabel":"cleanthinking.de"}],"beratung":"Die Kombination aus 25 % EV-Marktanteil in Deutschland, dem VW-Sparpaket und der anhaltenden Zuliefererkrise (59 Insolvenzen allein 2025) zeigt: Der Transformationsdruck ist strukturell und irreversibel. Beratungsmandate sind jetzt besonders gefragt fuer Restrukturierung, Make-or-Buy-Entscheidungen im HV-Bereich sowie Roadmaps zum Plattformwechsel auf 800-V-Architekturen.","hvtraining":"DGUV 209-093 und die aktualisierten VDE-Regeln 4105/4100 schaffen verbindliche Qualifikationsanforderungen fuer alle Betriebe mit HV-Fahrzeugen und Ladeinfrastruktur. Mit 25 % BEV-Neuanteil steigt die Anzahl betroffener Fahrzeuge in Werkstaetten rapide. Rettungskraefte-Schulungspflicht und verscharfte Batterienormen eroeffnen gezielt neue Zielgruppen fuer strukturierte HV-Trainingsprogramme."},{"date":"2026-06-16","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"IEA EV Outlook 2026: Ladeinfrastruktur wird zur Engpassfrage","text":"Der IEA Global EV Outlook 2026 warnt, dass die Ladeinfrastruktur zum kritischen Flaschenhals der Elektromobilitaet wird. Waehrend Fahrzeugzahlen stark wachsen, hinkt der Ausbau oeffentlicher Ladepunkte hinterher - besonders in Suedeuropa und laendlichen Regionen. Die IEA fordert bis 2030 mindestens eine Verdreifachung der installierten Ladekapazitaet.","url":"https://www.techzeitgeist.de/iea-global-ev-outlook-2026-ladeinfrastruktur-elektromobilitaet/","urlLabel":"TechZeitgeist / IEA"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Umweltpraemie ab Mai 2026 - EV-Anteil springt auf 25 % in Deutschland","text":"Seit Mai 2026 kann die neue Umweltpraemie fuer den Kauf von Elektrofahrzeugen in Deutschland beantragt werden. Im ersten Monat zeigt sich der Effekt: 59.969 reine Elektrofahrzeuge wurden neu zugelassen - ein Marktanteil von 25 Prozent und ein Plus von 39,3 Prozent gegenueber dem Vorjahresmonat.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"basicthinking.de"},{"cat":"ev","label":"Elektrofahrzeuge","title":"VW-Konzern dominiert Europa-EV-Markt - Skoda Elroq verdraengt Tesla","text":"Im Q1 2026 wuchs der europaeische EV-Markt um 24,7 Prozent; die VW Group haelt mit 23,6 Prozent Marktanteil Platz eins. In Deutschland hat der Skoda Elroq das Tesla Model Y als meistgekauftes Elektroauto verdraengt. Chinesische Modelle gewinnen in der Mittelklasse zunehmend Boden.","url":"https://www.elektroauto-news.net/news/eauto-hersteller-europa-q1-2026","urlLabel":"elektroauto-news.net"},{"cat":"hv","label":"Hochvoltsysteme","title":"EU-Sicherheitspflichten 2026: Crashtest, Batteriehaltbarkeit, Rettungskraefte","text":"Ab 2026 gelten verscharfte EU-Crashtest-Anforderungen fuer Elektrofahrzeuge, verbindliche Batterie-Haltbarkeitsvorschriften sowie Pflichtschulungen fuer Rettungskraefte im Umgang mit Hochvoltsystemen. Die Neuregelungen erhoehen die Anforderungen an Fahrzeugentwicklung und betriebliche Sicherheitskonzepte gleichermassen.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"ad-hoc-news.de"},{"cat":"hv","label":"Hochvoltsysteme","title":"800-V-Architektur loest 400-V-Systeme als Plattformstandard ab","text":"Ab 2025/2026 werden neue Fahrzeugplattformen nahezu ausschliesslich mit 800-V-Technik entwickelt. 400-V-Systeme (MEB, E-GMP, STLA) laufen nur noch in Einstiegssegmenten bis Ende des Jahrzehnts. Fuer Werkstatten und HV-Trainer bedeutet dies: Qualifikationskonzepte muessen die hoehere Systemspannung und spezifische Sicherheitsanforderungen bereits jetzt abbilden.","url":"https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/elektroautos-uebersicht-2026/","urlLabel":"ADAC"},{"cat":"branche","label":"Branche / Zulieferer","title":"VDA-Mittelstandstag 17./18. Juni 2026: Zulieferer unter Transformationsdruck","text":"Am 17. und 18. Juni 2026 findet in Bonn der VDA-Mittelstandstag statt - zentrales Netzwerktreffen fuer Geschaeftsfuehrer mittelstaendischer Zulieferer. Im Fokus steht die Frage, wie Betriebe mit EBIT-Margen unter 5 Prozent den Technologiewandel finanzieren koennen. Continental kuendigte parallel weitere 3.000 Jobkuerzungen in der Autozuliefersparte bis Ende 2026 an.","url":"https://www.vda.de/de","urlLabel":"VDA"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"E-Lkw-Quoten: Niederlande und Norwegen fuehren Europa an","text":"Laut IEA 2026 fuehren die Niederlande (18,2 % E-Lkw-Anteil), Norwegen (17,3 %) und Daenemark (16,9 %) den europaeischen Nutzfahrzeugmarkt an; Deutschland liegt mit 7,1 % ueber dem EU-Schnitt (4,7 %). Die EU-CO2-Regulierung fuer Nutzfahrzeuge erhoht seit Halbjahr 2025 den Druck auf Hersteller ohne ausreichende Elektroquoten erheblich.","url":"https://www.techzeitgeist.de/iea-global-ev-outlook-2026-ladeinfrastruktur-elektromobilitaet/","urlLabel":"TechZeitgeist / IEA"}],"beratung":"Der VDA-Mittelstandstag am 17./18. Juni macht deutlich: Die Zuliefererkrise ist kein Randthema mehr. Mit Margen unter 5 Prozent und anhaltendem OEM-Preisdruck brauchen mittelstaendische Zulieferer jetzt konkrete Restrukturierungsstrategien und klare Differenzierungsfelder. Besonders der Wechsel auf 800-V-Plattformen erfordert Investitionsentscheidungen, fuer die viele Tier-2-Betriebe aktuell keine ausreichende Eigenkapitalbasis haben.","hvtraining":"Die Pflicht-Schulungsanforderungen fuer Rettungskraefte an HV-Fahrzeugen und der 800-V-Plattformwechsel sind zwei starke Argumente fuer aktuelle HV-Trainingsprogramme. Gleichzeitig eroeffnet die steigende E-Lkw-Penetration neue Zielgruppen: Transport- und Logistikunternehmen benoetigen strukturierte HV-Qualifizierung nach DGUV 209-093 fuer Fahrzeugbediener und Werkstattpersonal."},{"date":"2026-06-15","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq verdraengt Tesla Model Y als Bestseller in Deutschland","text":"Im Mai 2026 setzt sich der Skoda Elroq mit 3.083 Neuzulassungen an die Spitze der beliebtesten E-Autos in Deutschland - Tesla verliert seinen jahrelangen Spitzenplatz. VW ID.3 (3.050) und Skoda Enyaq (2.770) folgen dicht dahinter. Das deutet auf eine zunehmende Praeferenz fuer guenstigere europaeische Modelle hin.","url":"https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/","urlLabel":"Business Insider"},{"cat":"ev","label":"Elektrofahrzeuge","title":"EU-EV-Marktanteil bei 19,7 % - Benziner unter Druck","text":"Von Januar bis April 2026 erreichten Elektrofahrzeuge einen EU-Marktanteil von 19,7 Prozent - nur noch 2,8 Punkte hinter dem Benziner. Die groessten EU-Maerkte wachsen stark: Italien +73,1 %, Frankreich +48,2 %, Deutschland +41,3 %. In Deutschland wurden im April erstmals mehr E-Autos als Benziner neu zugelassen.","url":"https://ecomento.de/2026/05/27/januar-bis-april-2026-elektroauto-anteil-in-der-eu-bei-19-7-prozent/","urlLabel":"ecomento.de"},{"cat":"ev","label":"Elektrofahrzeuge","title":"25 % EV-Anteil in Deutschland im Mai 2026","text":"Im Mai 2026 erreichten Elektrofahrzeuge 25 Prozent Marktanteil bei deutschen Neuzulassungen. Chinesische Anbieter wie XPeng gewinnen mit Modellen unter 50.000 Euro Marktanteile, waehrend die Volkswagen Group mit 23,6 % Marktanteil zwar Volumenfuehrerschaft haelt, aber gegenueber dem Vorjahr (27,1 %) verliert.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"Basic Thinking"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093: Verbindliche Qualifikationen fuer HV-Arbeit","text":"Die DGUV Information 209-093 ist der aktuelle Pflichtstandard fuer alle Beschaeftigten, die Fahrzeuge mit Hochvolt- oder Gasantriebssystemen bedienen oder warten - von der sensibilisierten Person bis zur Fachkraft. Die Regelung ersetzt DGUV 200-005 und reagiert auf die zunehmende Verbreitung von E-, Hybrid- und Wasserstofffahrzeugen in Betrieben. Betriebe ohne entsprechend qualifiziertes Personal riskieren Haftung und Betriebsunterbrechungen.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"Pressewissen"},{"cat":"hv","label":"Hochvoltsysteme","title":"Neue VDE-Regeln 4105/4100 und EU-Crashnormen 2026","text":"Seit Maerz 2026 gelten aktualisierte VDE-Anwendungsregeln 4105 und 4100 mit technischen Vorgaben fuer Erzeugungsanlagen und netzdienliche Steuerung von Wallboxen. Parallel treten 2026 verscharfte EU-Crashtestvorschriften und verbindliche Batterie-Haltbarkeitsregeln in Kraft. Rettungskraefte muessen nun verpflichtend im Umgang mit HV-Fahrzeugen geschult werden.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"ad-hoc-news.de"},{"cat":"branche","label":"Branche / Zulieferer","title":"Continental streicht 3.000 Jobs - Zuliefererkrise vertieft sich","text":"Continental plant bis Ende 2026 den Abbau weiterer 3.000 Stellen in der Autozuliefersparte. Im Zeitraum 2020-2025 gab es branchenweit 257 Zulieferer-Insolvenzen, allein 59 davon in 2025. EBIT-Margen lagen verbreitet unter 5 % - zu wenig, um Investitionen aus eigener Kraft zu stemmen. OEMs erhoehen gleichzeitig den Preisdruck bei Verhandlungen.","url":"https://www.automobil-produktion.de/management/die-radikalen-sparmassnahmen-der-autoindustrie-im-ueberblick/994682","urlLabel":"automobil-produktion.de"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU-CO2-Flottenziele und E-Fuel-Oeffnung: Doppelstrategie unter Kritik","text":"Die EU-CO2-Regulierung fuer Nutzfahrzeuge greift ab dem zweiten Halbjahr 2025 mit Zielwerten von ca. 93,6 g CO2/km - OEMs ohne hohe Elektroquoten drohen Milliardenstrafen. Gleichzeitig hat die EU Verbrenner-Neuwagen nach 2035 fuer E-Fuel-Betrieb zugelassen. Experten kritisieren diese Doppelstrategie als widerspruechliches Signal fuer Investitionsentscheidungen der Hersteller.","url":"https://www.elektroauto-news.net/news/europa-regulierung-hilfe-schaden-parallel","urlLabel":"Elektroauto-News"}],"beratung":"Der europaeische EV-Markt nimmt unaufhaltsam Fahrt auf - 19,7 % Marktanteil und wachsende Dominanz in Schluesselmaerkten machen die Transformation irreversibel. Fuer Automotive-Berater eroeffnet die Zuliefererkrise mit fast 60 Insolvenzen in 2025 gleichzeitig konkrete Chancen bei Restrukturierung und strategischer Neuausrichtung. OEM-Kunden brauchen jetzt belastbare Roadmaps fuer Elektrifizierung und Lieferkettenstabilitaet.","hvtraining":"Die Aktualisierung der DGUV 209-093 und der VDE-Regeln 4105/4100 ist ein direkter Trainingsimpuls: Betriebe mit HV-Fahrzeugen oder -Maschinen sind jetzt rechtlich verpflichtet, ihre Belegschaft nach den neuen Standards zu qualifizieren. Das Spektrum reicht von der sensibilisierten Person bis zur Fachkraft - ein klares Argument fuer strukturierte HV-Schulungsangebote auf allen Qualifikationsstufen."},{"date":"2026-06-14","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq auf Platz 1: E-Auto-Marktanteil in Deutschland erreicht 25 %","text":"Im Mai 2026 erreichten Elektroautos in Deutschland einen Marktanteil von 25 Prozent. Der Skoda Elroq verdrangte das Tesla Model Y mit 3.083 Neuzulassungen vom ersten Platz, gefolgt von VW ID.3 und Skoda Enyaq. Der europaische EV-Markt wuchs im Q1 2026 um 24,7 Prozent auf knapp 694.000 Einheiten.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"basicthinking.de"},{"cat":"ev","label":"Elektrofahrzeuge","title":"BYD eroffnet 1.500-kW-Ultraschnelllader in Deutschland","text":"BYD hat seine erste Flash-Charging-Station in Deutschland in Betrieb genommen. Die Anlage leistet 1.500 kW und ladt kompatible Fahrzeuge in nur funf Minuten von 10 auf 70 Prozent. Dies setzt neue Massstabe fur die Ladeinfrastruktur in Europa und erhoht den Wettbewerbsdruck auf bestehende Ladenetzbetreiber.","url":"https://www.elektroauto-news.net/","urlLabel":"elektroauto-news.net"},{"cat":"hv","label":"Hochvoltsysteme","title":"EU General Safety Regulation ab Juli 2026 vollstandig in Kraft","text":"Ab Juli 2026 greift die EU-General Safety Regulation (GSR) vollstaendig: Alle neu zugelassenen Fahrzeuge mussen erweiterte Assistenzsysteme aufweisen. Parallel schreibt die DGUV-Information 209-093 verbindliche Qualifikationsanforderungen fur Beschaftigte an HV-Systemen vor und lost die bisherige Regelung 200-005 ab. Die 800-V-Architektur wird fur neue Fahrzeugplattformen zum De-facto-Standard.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"ad-hoc-news.de"},{"cat":"hv","label":"Hochvoltsysteme","title":"Aktualisierte VDE-Normen 4105/4100 seit Marz 2026 verbindlich","text":"Seit Marz 2026 gelten die uberarbeiteten VDE-Anwendungsregeln 4105 und 4100, die technische Vorgaben fur den Anschluss von Erzeugungsanlagen und die netzdienliche Steuerung von Grossverbrauchern wie Wallboxen neu regeln. Die Normen betreffen direkt die Ladeinfrastruktur fur Elektrofahrzeuge. Betreiber und Errichter mussen ihre Anlagen entsprechend anpassen.","url":"https://www.dke.de/resource/blob/933408/0711b19c06f1a81210febfe0739902ee/vde-kompendium-elektromobilitaet-data.pdf","urlLabel":"dke.de"},{"cat":"branche","label":"Branche / Zulieferer","title":"Deutsche Zulieferer unter Druck: 59 Insolvenzen allein 2025, Continental baut 3.000 Jobs ab","text":"Die Oliver Wyman-Studie 2026 zeigt, dass deutsche Automobilzulieferer mit EBIT-Margen unter 5 Prozent kampfen und im Zeitraum 2020-2025 insgesamt 257 Insolvenzen verzeichneten. Continental will bis Ende 2026 weitere 3.000 Stellen in der Autozuliefersparte abbauen. Branchenbeobachter sehen wenig Anzeichen fur eine kurzfristige Trendwende.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"oliverwyman.de"},{"cat":"branche","label":"Branche / Software","title":"Elf OEMs und Zulieferer unterzeichnen MoU fur Open-Source-Fahrzeugsoftware","text":"Mercedes-Benz, BMW, Volkswagen, Bosch, Continental und sechs weitere Unternehmen haben ein Memorandum of Understanding fur die gemeinsame Entwicklung nicht-differenzierender Fahrzeugsoftware auf Open-Source-Basis unterzeichnet. Die erste Serienversion des Core Stack soll 2026 bereitstehen, die Serienreife ist fur 2030 geplant. Die Initiative zielt auf Kostensenkung und Starkung der europaischen Wettbewerbsfahigkeit gegenueber US- und China-Software.","url":"https://www.automotiveit.eu/strategy/autoindustrie-rueckt-bei-softwareentwicklung-enger-zusammen/904096","urlLabel":"automotiveit.eu"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU lockert Verbrenner-Aus: E-Fuels als Ausnahme bis 2035","text":"Die EU hat ihren rechtlichen Rahmen angepasst: Neuwagen mit Verbrennungsmotor durfen auch nach 2035 zugelassen werden, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden. Das EU-Automobilpaket sieht zudem eine Aufweichung des CO2-Flottenziels um zehn Prozent vor. Herstellern, die Flottenziele verpassten, drohen weiterhin Strafzahlungen in Milliardenhöhe.","url":"https://www.cleanthinking.de/elektroauto-disruption-verbrenner-aus/","urlLabel":"cleanthinking.de"}],"beratung":"Der strukturelle Umbau der Zuliefererindustrie beschleunigt sich: Mit zunehmenden Insolvenzen, Stellenabbau und Margen unter 5 Prozent stehen mittelstandische Zulieferer vor existenziellen Entscheidungen. Beratungsmandate zur Neuausrichtung auf Software-Defined-Vehicle-Architekturen und zur Diversifikation weg von klassischen Antriebskomponenten werden 2026 besonders gefragt sein.","hvtraining":"Die vollstandige Inkraftsetzung der EU-GSR ab Juli 2026 und die verbindliche DGUV-Information 209-093 erhoehen den Schulungsbedarf massiv. Werkstatten, Hersteller und Zulieferer mussen ihre Belegschaft nachweislich qualifizieren - ein direktes Marktpotenzial fur HV-Trainingsangebote. Besonders 800-V-Plattformen stellen neue Anforderungen an Sicherheitskonzepte und Schulungsinhalte."},{"date":"2026-06-12","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq bleibt Marktfuehrer - BEV-Anteil im Mai bei 25 Prozent","text":"Der Skoda Elroq ist mit 16.823 Neuzulassungen (kumuliert) das meistverkaufte Elektroauto in Deutschland - vor VW ID.3 und Tesla Model Y. Im Mai 2026 erreichten reine Elektroautos einen Marktanteil von 25 Prozent; seit Jahresbeginn wurden 283.949 neue BEV zugelassen. Der VW-Konzern dominiert die Absatzrangliste mit vier Modellen unter den Top 5.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"Basic Thinking"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Genesis GV60 Magma - Performance-Stromer mit 477 kW ab Mitte 2026 in Deutschland","text":"Genesis bringt den GV60 Magma als ersten reinrassigen Performance-EV nach Deutschland, ab 85.990 Euro und mit 477 kW im Boost-Modus. Das Modell markiert eine neue Premiumklasse im BEV-Segment und zeigt, dass Hersteller den Markt zunehmend ueber Sportsegmente erschliessen wollen.","url":"https://www.elektroauto-news.net/news/genesis-gv60-magma-mitte-2026-bestellbar","urlLabel":"Elektroauto-News"},{"cat":"ev","label":"Elektrofahrzeuge","title":"EU CO2-Grenzwerte druecken E-Auto-Preise - Durchschnittspreis sank 2025 um 1.800 Euro","text":"Die strengen EU-Flottengrenzwerte (ca. 93,6 g CO2/km ab 2026) zwingen Hersteller, guenstigere BEV-Modelle anzubieten oder Milliarden an Strafzahlungen zu riskieren. Der Durchschnittspreis fuer Elektroautos sank 2025 dadurch um rund 1.800 Euro. Fuer 2026 werden 66 neue E-Modelle erwartet, davon erstmals mehrere unter 25.000 Euro.","url":"https://www.firmenauto.de/management/fuhrparkmanagement/co2-flottengrenzwerte-druecken-preise-elektroautos-europa-analyse-t-e/","urlLabel":"firmenauto"},{"cat":"hv","label":"Hochvoltsysteme","title":"Neue Sicherheitsanforderungen 2026: verscharfte Crashtests, Batterie-Haltbarkeit und Rettungskraefteschulung","text":"Ab 2026 gelten verscharfte Crashtest-Anforderungen fuer BEV, verbindliche Batterie-Haltbarkeitsvorschriften sowie Pflichtschulungen fuer Rettungskraefte im Umgang mit Hochvoltsystemen. Diese Neuregelungen erhoehen die Anforderungen an Fahrzeugentwicklung und betriebliche Sicherheitskonzepte gleichermassen.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"Ad-hoc-news"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093 und VDE 4105/4100 - aktualisiertes Normenfundament fuer HV-Qualifikationen","text":"Die DGUV Information 209-093 ist der massgebliche Standard fuer HV-Qualifikationen in Deutschland. Die seit Maerz 2026 aktualisierten VDE-Anwendungsregeln 4105 und 4100 definieren neue technische Anforderungen fuer Ladeinfrastruktur-Anschluesse. Schulungsunterlagen und Qualifikationsnachweise auf aelterem Stand muessen umgehend aktualisiert werden.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"Pressewissen"},{"cat":"branche","label":"Branche / Software","title":"Autoindustrie startet Software-Offensive - 65 % aller Neuwagen bereits SDV","text":"OEMs und Tier-1-Zulieferer ruecken bei der SDV-Softwareentwicklung enger zusammen. Bereits 65 Prozent aller 2026 gefertigten Neuwagen gelten als Software Defined Vehicles. Die erste produktionsreife Version eines gemeinsamen Core Stacks soll 2026 fuer Plattformen rund um automatisiertes Fahren bereitstehen.","url":"https://www.automotiveit.eu/strategy/autoindustrie-rueckt-bei-softwareentwicklung-enger-zusammen/904096","urlLabel":"automotive IT"},{"cat":"branche","label":"Branche / Zulieferer","title":"Zuliefererkrise: 59 Insolvenzen 2025 - EBIT-Margen unter 5 Prozent gefaehrden Investitionskapazitaet","text":"Die Oliver Wyman-Studie 2026 zeigt: 257 Zulieferer-Insolvenzen in 2020-2025, davon 59 allein 2025. Deutsche Lieferanten erzielen verbreitet EBIT-Margen unter 5 Prozent - zu wenig, um den Technologiewandel aus eigener Kraft zu finanzieren. Die Krise ist strukturell und wird durch Kostendruck, Asien-Verlagerung und den Doppelaufwand Verbrenner/BEV verstaerkt.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"}],"beratung":"Der zunehmende Preisdruck auf EV-Plattformen - getrieben durch CO2-Grenzwerte und chinesischen Wettbewerb - veraendert die Positionierung europaeischer Zulieferer grundlegend. Beratungsmandate sind gefragt fuer Kostenoptimierung in HV-Antriebstraengen, Plattformstrategie und Restrukturierungen. Der Skoda/VW-Konzern zeigt, wie EV-first-Strategie Volumenwachstum und Profitabilitaet kombinierbar macht.","hvtraining":"Das doppelte Normfundament DGUV 209-093 und VDE 4105/4100 schafft unmittelbaren Qualifizierungsbedarf fuer alle Betriebe mit HV-Fahrzeugen und Ladeinfrastruktur. Die steigenden Stueckzahlen (25 % BEV-Anteil) erhoehen die Anzahl betroffener Fahrzeuge in Werkstaetten und Flotten rapide. Jetzt ist die Phase, Rahmenvertraege mit Fuhrparkbetreibern und Kfz-Betrieben zu akquirieren, bevor der Markt saettigt."},{"date":"2026-06-11","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq haelt Spitzenplatz - 25 % BEV-Anteil im Mai 2026","text":"Mit 3.083 Neuzulassungen im Mai behauptet sich der Skoda Elroq als meistgekauftes Elektroauto in Deutschland, knapp vor VW ID.3 (3.050) und Skoda Enyaq (2.770). Der Gesamt-BEV-Marktanteil liegt bei 25 Prozent; seit Jahresbeginn wurden 283.949 reine Elektroautos neu zugelassen.","url":"https://www.goingelectric.de/2026/06/06/news/zulassungszahlen-fuer-elektroautos-und-plug-in-hybride-im-mai-2026/","urlLabel":"GoingElectric"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Europa startet mit 20 % BEV-Anteil ins Jahr - 30 % zum Jahresende erwartet","text":"Der europaeische EV-Markt begann 2026 mit einem BEV-Anteil von 20 Prozent im Januar. Der VDA prognostiziert rund 700.000 E-Auto-Neuzulassungen in Deutschland fuer das Gesamtjahr - ein Plus von 30 Prozent gegenueber 2025. Treiber sind neue Niedrigpreismodelle und der Druck durch CO2-Flottengrenzwerte.","url":"https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share","urlLabel":"EAFO / EU-Kommission"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Studie: Europa liegt nur noch drei Jahre hinter China bei Elektromobilitaet","text":"Laut einer im Maerz 2026 veroeffentlichten Analyse hat Europa den Technologie- und Marktrueckstand gegenueber China deutlich reduziert. In Schluessel-Metriken wie Batterietechnik, Ladeinfrastrukturdichte und Marktdurchdringung betraegt der Abstand noch rund drei Jahre - sofern das Investitionsniveau gehalten wird.","url":"https://ecomento.de/2026/03/25/europa-holt-bei-elektroautos-auf-und-liegt-nur-noch-drei-jahre-hinter-china-studie/","urlLabel":"ecomento"},{"cat":"hv","label":"Hochvoltsysteme","title":"CO2-Flottengrenzwerte senken E-Auto-Preise um 1.800 EUR - Kostendruck auf HV-Komponenten","text":"Die EU-CO2-Regulierung zwingt Hersteller, verstaerkt guenstigere Elektromodelle anzubieten. Der Durchschnittspreis fuer ein E-Auto sank 2025 um rund 1.800 Euro. Fuer HV-Systemintegratoren und Zulieferer bedeutet dies steigenden Kostendruck auf Batteriemodule und Leistungselektronik bei gleichzeitig wachsenden Stueckzahlen.","url":"https://www.firmenauto.de/management/fuhrparkmanagement/co2-flottengrenzwerte-druecken-preise-elektroautos-europa-analyse-t-e/","urlLabel":"firmenauto"},{"cat":"hv","label":"Hochvoltsysteme","title":"VDE 4105 / 4100 aktualisiert - neue Vorgaben fuer HV-Ladeinfrastruktur seit Maerz 2026","text":"Die seit Maerz 2026 geltenden aktualisierten VDE-Anwendungsregeln 4105 und 4100 definieren technische Anforderungen fuer den Anschluss von Ladeinfrastruktur ans Niederspannungsnetz neu. Fuer HV-Trainer und Planungsbetriebe relevant: Zertifizierungen und Installationsnachweise muessen auf den neuen Stand gebracht werden.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"Ad-hoc-news"},{"cat":"branche","label":"Branche / Zulieferer","title":"Oliver Wyman: 59 Zulieferer-Insolvenzen 2025 - strukturelle Krise ohne Trendwende","text":"Laut Oliver Wyman-Studie gab es 2020-2025 insgesamt 257 Insolvenzen bei Automobilzulieferern, davon 59 allein in 2025. EBIT-Margen liegen verbreitet unter 5 %, zu wenig fuer Eigenmittelfinanzierung des Technologiewandels. Die Krise ist strukturell bedingt durch Kostendruck, Verlagerung nach Asien und den Doppelaufwand Verbrenner/BEV.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU-Automobilpaket: Verbrenner-Ausnahme fuer E-Fuels nach 2035 beschlossen","text":"Die EU hat den Rechtsrahmen so angepasst, dass Neuwagen mit Verbrenner nach 2035 zugelassen werden duerfen, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden. Das Kommissions-Automobilpaket sieht zudem eine faktische Aufweichung des Verbrennerausstiegs vor - sieben EU-Laender hatten auf einem pragmatischeren Kurs bestanden.","url":"https://www.cleanthinking.de/elektroauto-disruption-verbrenner-aus/","urlLabel":"cleanthinking"}],"beratung":"Der Preisdruck durch CO2-Grenzwerte und die anhaltende Zuliefererkrise bilden einen Schereneffekt: OEM-Margen sinken, waehrend der Investitionsbedarf in Elektrifizierung und Software steigt. Fuer Beratungsmandate sind Kostenstruktur-Analysen und Make-or-Buy-Entscheidungen im Software- und Batterie-Bereich aktuell die dringlichsten Themen - besonders fuer Tier-1-Kunden mit noch hohem Verbrenner-Anteil.","hvtraining":"Die Kombination aus aktualisierten VDE-Regeln 4105/4100 und der DGUV 209-093 bildet das neue Normenfundament fuer HV-Qualifizierungen 2026. Wer Schulungsunterlagen noch auf dem Stand von 2024 hat, muss jetzt nachziehen - besonders relevant fuer Kunden mit Ladeinfrastruktur-Technikern oder Wartungspersonal an industriellen HV-Systemen."},{"date":"2026-06-10","cards":[{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Elroq verdraengt Tesla Model Y - 25 % BEV-Anteil im Mai 2026","text":"Mit 16.823 Neuzulassungen ist der Skoda Elroq das meistgekaufte E-Auto in Deutschland. Im Mai 2026 erreichten reine Elektroautos einen Marktanteil von 25 Prozent; seit Jahresbeginn wurden 283.949 neue BEV zugelassen.","url":"https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/","urlLabel":"Basic Thinking"},{"cat":"ev","label":"Elektrofahrzeuge","title":"Skoda Epiq startet Serienproduktion - Einstiegs-SUV ab 26.000 Euro","text":"Im VW-Werk Pamplona hat die Serienproduktion des Skoda Epiq begonnen. Das Kompakt-SUV basiert auf der neuen MEB+-Plattform und ist eines von 66 neuen E-Modellen, die 2026 auf den europaeischen Markt kommen.","url":"https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/","urlLabel":"ADAC"},{"cat":"hv","label":"Hochvoltsysteme","title":"DGUV 209-093 loest 200-005 ab - neuer HV-Qualifikationsstandard","text":"Die DGUV Information 209-093 ist der neue massgebliche Standard fuer HV-Qualifikationen in Deutschland. Gleichzeitig gelten seit Maerz 2026 die aktualisierten VDE-Anwendungsregeln 4105 und 4100 mit direkter Auswirkung auf Ladeinfrastruktur und Qualifikationsnachweise.","url":"https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/","urlLabel":"Pressewissen"},{"cat":"hv","label":"Hochvoltsysteme","title":"EU GSR ab Juli 2026 voll in Kraft - erweiterte Assistenzsysteme Pflicht","text":"Die EU General Safety Regulation tritt im Juli 2026 vollstaendig in Kraft: Alle neu zugelassenen Fahrzeuge muessen dann erweiterte Fahrerassistenzsysteme vorweisen. Das vergroessert den sicherheitsrelevanten Systemumfang in HV-Fahrzeugen erheblich.","url":"https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506","urlLabel":"Ad-hoc-news"},{"cat":"branche","label":"Branche / Software","title":"11 OEMs und Zulieferer gruenden Open-Source-Allianz fuer Fahrzeugsoftware","text":"Mercedes-Benz, BMW, Volkswagen, Bosch, Continental und sechs weitere Unternehmen unterzeichnen beim Automobil Elektronik Kongress ein MoU. Der gemeinsame Core-Stack soll Middleware, Betriebssystem und Kommunikationsdienste auf Open-Source-Basis abdecken.","url":"https://www.automotiveit.eu/strategy/autoindustrie-rueckt-bei-softwareentwicklung-enger-zusammen/904096","urlLabel":"automotive IT"},{"cat":"branche","label":"Branche / EU-Regulierung","title":"EU plant Pflichtquoten fuer E-Firmenwagen ab 2030","text":"Die EU-Kommission will grosse Unternehmen gesetzlich verpflichten, ab 2030 Mindestanteile an Elektro- und Niedrigemissionsfahrzeugen in Fuhrparks nachzuweisen. Branchenverbaende kritisieren die Massnahme als marktverzerrend.","url":"https://www.handelsblatt.com/politik/international/eu-kommission-verbaende-kritisieren-moegliche-pflichtquoten-fuer-e-firmenwagen/100231068.html","urlLabel":"Handelsblatt"},{"cat":"branche","label":"Branche / Zulieferer","title":"Zuliefererkrise: 59 Insolvenzen 2025 - strukturelle Herausforderung","text":"Laut Oliver Wyman gab es 2020-2025 insgesamt 257 Insolvenzen bei Zulieferern ueber 10 Mio. EUR Umsatz, davon 59 allein in 2025. Die Krise ist nicht mehr zyklisch, sondern strukturell bedingt durch Kostendruck, Technologiewandel und sinkende Margen.","url":"https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html","urlLabel":"Oliver Wyman"}],"beratung":"Die Zulieferer-Strukturkrise und die OEM-Open-Source-Allianz verschieben den Beratungsbedarf: Kunden benoetigen jetzt strategische Orientierung zu Portfolio- und Make-or-Buy-Entscheidungen im Software-Bereich. Besonders Tier-2- und Tier-3-Lieferanten muessen klaeren, welche Kompetenzen noch Differenzierungspotenzial bieten und welche in den Open-Source-Pool wandern.","hvtraining":"Die Abloesung der DGUV 200-005 durch 209-093 erfordert unmittelbare Pruefung der Schulungsunterlagen auf aktualisierte Qualifikationsstufen und Nachweispflichten. Ab Juli 2026 greift die EU-GSR-Pflicht fuer Assistenzsysteme - das erweitert den relevanten Fahrzeugumfang und bietet einen konkreten Anlass fuer Neukundenakquise."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
