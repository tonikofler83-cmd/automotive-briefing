t-weight:700;line-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date": "2026-07-20", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Toyota verdoppelt Elektro-Absatz in Europa, VW expandiert nach Zentralasien", "text": "Toyota hat seinen Absatz vollelektrischer Modelle in Europa verdoppelt und gewinnt damit im BEV-Segment deutlich an Gewicht. Parallel erschliesst Volkswagen mit Zentralasien den naechsten Wachstumsmarkt, waehrend BYD mit dem Sponsoring von Paris Saint-Germain seine Markenpraesenz in Europa weiter ausbaut.", "url": "https://www.automobilwoche.de/nachrichten/amw-aktuelle-meldungen/", "urlLabel": "Automobilwoche"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "NOW-Studie: E-Autos gleichen CO2-Rucksack nach rund 44.000 km aus", "text": "Die bundeseigene NOW GmbH bestaetigt, dass Elektroautos den CO2-Rucksack aus der Batterieproduktion nach rund 44.000 Kilometern ausgeglichen haben. Der Break-even liegt damit deutlich frueher als in aelteren Studien und staerkt die Klimabilanz-Argumentation fuer den E-Hochlauf.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Nio schliesst Nio House Hamburg zum 20. Juli", "text": "Nio schliesst sein Nio House in Hamburg zum heutigen 20. Juli und strafft damit sein Retail-Netz in Deutschland. Der Schritt zeigt den Konsolidierungsdruck bei chinesischen Marken im Direktvertrieb, waehrend der Wettbewerb im deutschen E-Markt weiter zunimmt.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026 honoriert Thermal-Runaway-Erkennung und Rettungskraefte-Warnung", "text": "Die seit Januar geltenden Euro-NCAP-Protokolle 2026 bewerten Fahrzeuge in vier Kategorien und vergeben bei E-Fahrzeugen erstmals Punkte fuer Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte warnen. Dazu kommen verschaerfte Crashtests, neue Vorgaben zur Batteriehaltbarkeit und verbindliche Schulungen fuer Rettungskraefte.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV: Sensibilisierung auch fuer Bediener von HV- und Gasantriebssystemen Pflicht", "text": "Die DGUV verlangt, dass Beschaeftigte, die Fahrzeuge oder Maschinen mit HV- oder Gasantrieb in fahrerartigem Umfang bedienen, arbeitsschutzrechtlich sensibilisiert werden. Neben Werkstattpersonal ruecken damit Fuhrpark-, Logistik- und Maschinenbediener in den Fokus der Qualifizierung nach DGUV Information 209-093.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Schaeffler meldet steigende Hybrid-Nachfrage, EU-Zoelle auf China-Reifen bis 45 Prozent", "text": "Schaeffler verzeichnet wachsende Nachfrage nach Komponenten fuer Voll-, Mild- und Plug-in-Hybride sowie Range-Extender, ein Beleg fuer die anhaltende Antriebs-Dualitaet in der Zulieferindustrie. Parallel koennen die neuen EU-Zoelle auf Reifen aus China bis zu 45 Prozent erreichen, was Beschaffung und Preise im Teilehandel direkt beruehrt.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}, {"cat": "branche", "label": "Branche / Software", "title": "Mercedes bringt autonome Fahrtechnik Ende 2026 nach Europa", "text": "Die in China bereits verfuegbare autonome Fahrtechnik von Mercedes soll bis Ende 2026 nach Europa kommen; das Werk Rastatt erhaelt zudem ein zusaetzliches Modell. Bei Volkswagen soll die Belegschaft Ende August ueber die naechsten Restrukturierungsschritte informiert werden, das Werk Osnabrueck bleibt zunaechst ausgenommen.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}], "beratung": "Nio strafft sein Retail-Netz, Toyota verdoppelt den E-Absatz: Die Markenlandschaft verschiebt sich weiter, fuer B2B/B2C-Webshops heisst das laufende Pflege von Fahrzeugzuordnungen und Teilekatalogen auch fuer Direktvertriebsmarken. Schaefflers Hybrid-Nachfrage bestaetigt die zweigleisige Sortimentsstrategie, und die EU-Reifenzoelle von bis zu 45 Prozent erfordern kurzfristig einen Sourcing- und Preischeck im Reifensegment.", "hvtraining": "Die Euro-NCAP-Punkte fuer Thermal-Runaway-Erkennung machen Batterie-Notfallmanagement und Rettungskarten zum Pflichtthema in HV-Schulungen. Die DGUV-Sensibilisierungspflicht fuer reine Bediener erweitert die Zielgruppe auf Fuhrparks, Logistik und Maschinenbetreiber, und die NOW-Zahl von 44.000 km liefert ein griffiges Argument fuer den Einstieg in jedes Training."}, {"date": "2026-07-15", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Ranking Mitte Juli: Skoda Elroq verdraengt Tesla Model Y von der Spitze", "text": "Im aktuellen Ranking der beliebtesten Elektroautos in Deutschland hat der Skoda Elroq das Tesla Model Y von Platz 1 verdraengt; dahinter folgen VW ID.3, Skoda Enyaq und VW ID.7. Das VW-Konzernlager dominiert damit die Jahreswertung, waehrend Importmarken vor allem in den Monatswertungen stark zulegen.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-mitte-juli-2026/", "urlLabel": "Business Insider"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Halbjahresbilanz: BEV-Zulassungen +48 Prozent, Juni-Anteil bei 28,4 Prozent", "text": "Mit 84.057 BEV-Neuzulassungen im Juni (+78,2 Prozent) und 28,4 Prozent Marktanteil lagen Elektroautos erstmals vor den Benzinern; im ersten Halbjahr summiert sich das Plus auf 48 Prozent. Die Durchschnittsreichweite neuer E-Modelle steigt 2026 auf rund 523 km nach 472 km im Vorjahr.", "url": "https://www.goingelectric.de/2026/07/14/news/zulassungszahlen-fuer-elektroautos-und-plug-in-hybride-im-juni-2026/", "urlLabel": "GoingElectric"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Citroen verdreifacht E-Absatz in Deutschland, e-C3 als Volumentreiber", "text": "Die Verkaeufe vollelektrischer Citroen-Modelle legen in Deutschland um 232 Prozent zu, der e-C3 zaehlt zu den erfolgreichsten Autos seines Segments. Das guenstige B-Segment unter 25.000 Euro entwickelt sich damit zum naechsten Volumentreiber des E-Markts.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "GSR-Pflichten seit Juli wirksam: Sicherheitspaket fuer Neuzulassungen komplett", "text": "Alle neu zugelassenen Fahrzeuge muessen seit diesem Monat die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen verschaerfte Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Fuer E-Fahrzeuge ist das Sicherheits-Regelwerk 2026 damit vollstaendig in Kraft.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "HV-Qualifizierung: DGUV 209-093, DGUV Vorschrift 3 und DIN VDE 0105-100 als Rahmen", "text": "Die DGUV Information 209-093 bleibt die massgebliche Grundlage fuer HV-Qualifizierung von der sensibilisierten Person bis zur Fachkraft; die DGUV-FAQ Hochvolttechnik liefert Auslegungshilfen fuer die betriebliche Umsetzung. Flankierend gelten DGUV Vorschrift 3 und DIN VDE 0105-100 fuer elektrotechnische Arbeiten und Messpraxis, das wachsende Seminarangebot zeigt die steigende Nachfrage nach strukturierter HV-Weiterbildung.", "url": "https://www.dguv.de/fb-holzundmetall/sg/sg_fai/mechatronik/faq/02_hochvolt/index.jsp", "urlLabel": "DGUV"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer 2026: Strukturwandel durch Elektrifizierung, SDV und volatile Lieferketten", "text": "Branchenanalysen sehen 2026 einen tiefgreifenden Strukturwandel: Elektrifizierung, Software-defined Vehicles, wachsender Regulierungsdruck und Lieferkettenvolatilitaet wirken gleichzeitig auf die Zulieferindustrie. Seit 2020 wurden 257 Insolvenzen bei Zulieferern mit ueber 10 Millionen Euro Umsatz gezaehlt, davon 59 allein im Jahr 2025.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "VDA erwartet knapp 700.000 E-Neuzulassungen 2026, EU-Anteil bei 20 Prozent", "text": "Der VDA rechnet fuer Deutschland 2026 mit einem Plus von 30 Prozent auf knapp 700.000 E-Neuzulassungen, ein Marktanteil von 24,9 Prozent. EU-weit wurden von Januar bis Mai 950.521 BEV neu zugelassen (20 Prozent Anteil); die CO2-Flottenziele 2025-2027 treiben den Markt Richtung 23 Prozent im Gesamtjahr.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "Elektroauto-News"}], "beratung": "Elroq an der Spitze und der Citroen-e-C3-Boom zeigen, dass sich das E-Volumen in preisguenstige, hoch standardisierte Segmente verlagert: Fuer B2B/B2C-Webshops werden MEB- und Stellantis-Plattformteile zum planbaren Volumengeschaeft. Die VDA-Prognose von knapp 700.000 E-Zulassungen macht den E-Teile-Anteil im Sortiment kalkulierbar, Datenqualitaet bei Fahrzeugzuordnungen bleibt der entscheidende Hebel.", "hvtraining": "Mit dem seit Juli vollstaendigen GSR-Paket und verbindlichen Rettungskraefte-Schulungen waechst der Qualifizierungsbedarf ueber die Werkstatt hinaus. Das Halbjahresplus von 48 Prozent bedeutet spuerbar mehr HV-Fahrzeuge im Service, Schulungen nach DGUV 209-093 inklusive Messpraxis nach DIN VDE 0105-100 sollten jetzt skaliert werden."}, {"date": "2026-07-14", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EY: Deutsche Hersteller steigern E-Absatz um 31 Prozent, verlieren aber Marktanteil", "text": "Im zweiten Quartal wuchs der E-Absatz der deutschen Konzerne um 31 Prozent, ihr gemeinsamer Marktanteil sank jedoch um fast zehn Punkte auf 53,9 Prozent. Auslaendische Hersteller, allen voran Tesla, steigerten ihren Absatz um 101 Prozent und kommen auf 36,2 Prozent Anteil im Elektrosegment.", "url": "https://www.ey.com/de_de/newsroom/2026/07/ey-analyse-elektro-neuwagenmarkt-juli-2026", "urlLabel": "EY Newsroom"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "BMW bringt Neue-Klasse-Technik in den 7er, AMG CLA mit ueber 670 km Reichweite", "text": "Mit dem neuen 7er ziehen erstmals Innovationen der Neuen Klasse in ein bestehendes Serienmodell ein. Mercedes-AMG gibt fuer den CLA 45 4MATIC+ mit 94-kWh-Batterie mehr als 670 km Reichweite an, der Shooting Brake schafft ueber 640 km.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Elektrische Nutzfahrzeuge: Absatz waechst kraeftig, Deutschland profitiert als Standort", "text": "Der Absatz elektrischer Nutzfahrzeuge waechst kraeftig, da Betreiber zunehmend die Kostenvorteile im Betrieb erkennen; Deutschland profitiert dabei als Produktionsstandort. Parallel planen Octopus Energy und CATL mit dem Joint Venture Swaptopus Batteriewechsel-Stationen fuer E-Lkw in Europa.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "800 Volt wird Plattform-Standard, 400 Volt bleibt im Einstiegssegment", "text": "Neue Fahrzeugplattformen werden seit 2025 nur noch mit 800-Volt-Technik entwickelt; 400-Volt-Basen wie VWs MEB laufen im Einstiegssegment bis Ende des Jahrzehnts weiter, unter anderem in neuen Modellen von Renault, Hyundai und VW ab 2026. Fuer Werkstaetten bedeutet das dauerhaft zwei parallele Spannungslagen in Diagnose und Instandsetzung.", "url": "https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/", "urlLabel": "ADAC"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "GSR-Stichtag erreicht: Seit Juli gelten die vollen EU-Sicherheitspflichten", "text": "Seit diesem Monat muessen alle neu zugelassenen Fahrzeuge die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen strengere Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Die DGUV Information 209-093 bleibt die massgebliche Qualifizierungsgrundlage fuer HV-Arbeiten.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "BMW in China unter Druck, Zulieferer-Krise bleibt strukturell", "text": "Schwache E-Auto-Zulassungen und die grosse Beteiligung am Brilliance-Joint-Venture erhoehen den Druck auf BMW in China deutlich. Bei den Zulieferern gilt die Krise laut Branchenanalysen inzwischen als strukturell: hohe Finanzierungskosten, anhaltender Kostendruck und volatile EV-Nachfrage praegen das Geschaeft dauerhaft.", "url": "https://www.elektroauto-news.net/automobilindustrie", "urlLabel": "Elektroauto-News"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "Mindestpreis-System fuer China-EVs laeuft an, erste Modelle betroffen", "text": "Das EU-Preisverpflichtungs-System loest die Ausgleichszoelle auf chinesische Elektroautos ab: Hersteller sichern zu, festgelegte Mindestpreise nicht zu unterschreiten, erste Modelle fallen bereits unter die Regelung. Parallel haelt die EU-CO2-Flottenregulierung den BEV-Hochlauf auf Kurs, nach 20 Prozent Marktanteil von Januar bis Mai werden fuer 2026 rund 23 Prozent erwartet.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "Automobilsalon Bellemann"}], "beratung": "Die EY-Q2-Zahlen (deutsche Hersteller nur noch 53,9 Prozent Anteil im Elektrosegment) und das anlaufende Mindestpreis-System machen den Bestand an Importmarken planbar groesser: Fahrzeugzuordnungen und Teilekataloge fuer Tesla, BYD und Co. bleiben Top-Prioritaet fuer B2B/B2C-Webshops. Der wachsende E-Nutzfahrzeugmarkt oeffnet zudem ein neues Segment fuer Flotten-Ersatzteilgeschaeft und Prozessberatung.", "hvtraining": "Die dauerhafte Koexistenz von 400- und 800-Volt-Plattformen gehoert als eigenes Modul in Diagnose- und Instandsetzungsschulungen, inklusive der hoeheren Anforderungen an Messmittel und PSA. Mit dem GSR-Stichtag und wachsendem E-Lkw-Absatz steigt der Qualifizierungsbedarf nach DGUV 209-093 auch bei Nutzfahrzeug-Werkstaetten und Flottenbetreibern."}, {"date": "2026-07-13", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EY-Analyse: Elektropraemie befeuert den Markt, Importmarken profitieren ueberproportional", "text": "Laut EY schrumpfte der Marktanteil deutscher Konzerne im Elektrosegment im zweiten Quartal um fast zehn Prozentpunkte, waehrend Tesla und andere auslaendische Hersteller ihren Absatz um 101 Prozent steigerten und ihren Anteil von 27,6 auf 36,2 Prozent ausbauten. Positiv fuer VW: Der europaeische Auftragsbestand fuer vollelektrische Modelle liegt ueber 50 Prozent hoeher als Ende 2025.", "url": "https://www.ey.com/de_de/newsroom/2026/07/ey-analyse-elektro-neuwagenmarkt-juli-2026", "urlLabel": "EY Newsroom"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Tesla investiert 213 Millionen Euro in die Zellfertigung in Gruenheide", "text": "Tesla baut die Batteriezellfertigung am Standort Gruenheide aus und will ab 2027 die komplette E-Auto-Produktion in Europa unter einem Dach buendeln. Parallel meldet Svolt Energy, ab September hybride Semi-Solid-State-Batterien in Serie zu fertigen, ein weiterer Schritt Richtung naechster Zellgeneration.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Swaptopus: Octopus Energy und CATL bauen Batteriewechsel-Netz fuer E-Lkw", "text": "Octopus Energy und CATL gruenden das Joint Venture Swaptopus und wollen Batteriewechsel-Stationen fuer elektrische Lkw in Europa aufbauen; der Absatz elektrischer Nutzfahrzeuge waechst deutlich, da Betreiber die Kostenvorteile erkennen. Zudem soll Seamless Charging ab Herbst an allen InCharge-Ladepunkten verfuegbar sein.", "url": "https://www.auto-medienportal.net/artikel/list/214", "urlLabel": "Auto-Medienportal"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Batteriepass ab Februar 2027, Euro 7 bringt SoH-Anzeige ab November 2026", "text": "Der digitale Batteriepass nach EU-Batterieverordnung wird ab 18. Februar 2027 Pflicht fuer neue Antriebsbatterien ueber 2 kWh und dokumentiert SoH, Herkunft, Material und CO2-Fussabdruck per QR-Code. Schon ab November 2026 verlangt Euro 7, dass Neuwagen den Batteriezustand direkt im Fahrzeug anzeigen, relevant fuer Diagnose, Gewaehrleistung und Gebrauchtwagenbewertung.", "url": "https://automobilsalon-bellemann.de/news/batteriepass-elektroauto-2027-soh-pflicht-euro-7/", "urlLabel": "Automobilsalon Bellemann"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "V2G-Pflicht fuer neue E-Autos im EU-Parlament umstritten", "text": "Die geplante Verpflichtung zu Vehicle-to-Grid-Faehigkeit fuer neue Elektroautos ist im Europaparlament umstritten, waehrend Umweltverbaende auf deutlich schnelleres Marktwachstum hoffen. Bidirektionales Laden erhoeht die Anforderungen an HV-Architektur, Ladeelektronik und den netzvertraeglichen Anschluss nach den aktualisierten VDE-Anwendungsregeln 4105 und 4100.", "url": "https://www.auto-medienportal.net/artikel/list/214", "urlLabel": "Auto-Medienportal / VDA"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "VDA fordert tiefgreifende Reformen, VW-Restrukturierung stockt", "text": "Angesichts der Sparplaene in der Autoindustrie fordert der VDA tiefgreifende Reformen fuer den Standort Deutschland. Bei Volkswagen stoesst Oliver Blumes umfassender Restrukturierungsplan auf Widerstand der Arbeitnehmervertreter, eine Einigung steht weiter aus.", "url": "https://www.onvista.de/news/2026/07-07-sparplaene-in-der-autoindustrie-vda-fuer-tiefgreifende-reformen-0-10-26529783", "urlLabel": "onvista"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "BYD verhandelte mit Renault ueber Beteiligung, Lucid holt Restrukturierer", "text": "BYD hat laut Berichten zweimal mit Renault ueber einen Einstieg beim franzoesischen Konzern gesprochen, bislang ohne Einigung. BMW geraet in China durch schwache EV-Zulassungen und das Brilliance-Joint-Venture unter Druck, waehrend Lucid die Restrukturierungsberatung AlixPartners engagiert haben soll.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}], "beratung": "Die EY-Zahlen (Importmarken +101 Prozent, 36,2 Prozent Anteil im Elektrosegment) und die BYD-Renault-Gespraeche zeigen, wie schnell sich die Markenlandschaft verschiebt: Fuer B2B/B2C-Webshops bleiben Teilekataloge und Fahrzeugzuordnungen fuer China-Marken oberste Prioritaet. Die VDA-Reformdebatte und der VW-Restrukturierungsstau signalisieren anhaltenden Kostendruck in der Lieferkette, Prozess- und Sortimentsoptimierung bleibt gefragt.", "hvtraining": "Batteriepass (ab Februar 2027) und Euro-7-SoH-Anzeige (ab November 2026) sind konkrete neue Schulungsinhalte fuer Batteriediagnose und -bewertung, jetzt in Unterlagen einarbeiten. V2G-Debatte und Batteriewechsel-Stationen fuer E-Lkw erweitern das HV-Themenspektrum auf Nutzfahrzeuge und Ladeinfrastruktur, Zielgruppen jenseits der PKW-Werkstatt."}, {"date": "2026-07-10", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "KBA-Bilanz Juni: BEV-Anteil springt auf 28,4 Prozent, E-Autos ueberholen Benziner", "text": "Mit 84.057 BEV-Neuzulassungen (+78,2 Prozent) erreichten Elektroautos im Juni 28,4 Prozent Marktanteil und ueberholten erstmals die Benziner, deren Zulassungen um 16,8 Prozent sanken (Diesel: -5,1 Prozent). Im ersten Halbjahr legten die BEV-Zulassungen um 48 Prozent zu.", "url": "https://www.heise.de/news/KBA-Zahlen-Juni-2026-E-Auto-Anteil-springt-auf-28-Prozent-11352961.html", "urlLabel": "heise online"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Marktstarts im Juli: ID.3 Neo, Q4 e-tron, C-Klasse EQ und Zeekr 7GT", "text": "Im Juli starten der VW ID.3 Neo ab 33.995 Euro, der Audi Q4 e-tron ab 47.500 Euro, die Mercedes C-Klasse EQ ab 67.711 Euro und der Zeekr 7GT ab 47.990 Euro, der in 13 Minuten von 10 auf 80 Prozent laedt. Die Durchschnittsreichweite neuer E-Modelle liegt 2026 bei rund 523 km nach 472 km im Vorjahr.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "AUTOZEITUNG"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "BGHM-Praxishilfe 021: kompakte Umsetzungshilfe fuer HV-Arbeiten am PKW", "text": "Die BGHM-Reihe Arbeitsschutz Kompakt konkretisiert mit Blatt 021 die Anforderungen fuer Arbeiten an Hochvoltsystemen im PKW: Gefaehrdungsbeurteilung, Schutzmassnahmen und Qualifikationsstufen nach DGUV Information 209-093. Zusammen mit der DGUV-FAQ Hochvolttechnik gibt es damit praxisnahe Auslegungshilfen fuer die betriebliche Umsetzung.", "url": "https://www.bghm.de/arbeitsschuetzer/praxishilfen/arbeitsschutz-kompakt/021-arbeiten-an-hochvoltsystemen-pkw", "urlLabel": "BGHM"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Sicherheitspaket 2026 wirksam: GSR-Pflichten, Crashtests, Rettungskraefte-Schulungen", "text": "Seit Juli muessen alle neu zugelassenen Fahrzeuge die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; dazu kommen verschaerfte Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Schulungen fuer Rettungskraefte. Die seit Maerz aktualisierten VDE-Anwendungsregeln 4105 und 4100 regeln parallel den netzvertraeglichen Anschluss von Ladeinfrastruktur.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer-Ranking 2026: Bosch bleibt vorn, CATL auf dem Podium, Huayu neu in den Top 10", "text": "Die am 7. Juli erschienene Sonderausgabe der Automobil Produktion bestaetigt Bosch auf Platz 1 vor Denso; Batterieriese CATL springt erstmals aufs Podium. Neu in den Top 10 sind der chinesische Zulieferer Huayu (Hasco, Umsatz +8,5 Prozent auf 25,6 Mrd. US-Dollar) und Bridgestone, waehrend die Branche mit strukturellem Kostendruck und 59 Insolvenzen allein 2025 kaempft.", "url": "https://www.automobil-produktion.de/global-automotive-business/das-sind-die-zehn-groessten-zulieferer-der-autoindustrie-1/1103084", "urlLabel": "Automobil Produktion"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "T&E-Report: EV-Absatz und Erschwinglichkeit erreichen den Kipppunkt", "text": "Von Januar bis Mai wurden in der EU 950.521 BEV neu zugelassen, ein Marktanteil von 20 Prozent. Der T&E-Progress-Report erwartet fuer das Gesamtjahr rund 23 Prozent und haelt bis Jahresende 25 Prozent fuer moeglich, getrieben von den CO2-Flottenzielen 2025-2027.", "url": "https://www.transportenvironment.org/articles/ev-progress-report-2026", "urlLabel": "Transport & Environment"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "CO2-Flottenziele bleiben Rueckgrat, E-Fuels-Ausnahme nach 2035 fixiert", "text": "Die EU-Flottenzielwerte von rund 93,6 g CO2/km zwingen Hersteller weiter zu hohen Elektroquoten, sonst drohen Strafzahlungen in Milliardenhoehe. Parallel erlaubt das EU-Automobilpaket Verbrenner-Neuwagen auch nach 2035, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden, eine Aufweichung um rund zehn Prozent.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}], "beratung": "Der Sprung auf 28,4 Prozent BEV-Anteil bei gleichzeitiger E-Fuels-Ausnahme nach 2035 bestaetigt die zweigleisige Sortimentsstrategie fuer Ersatzteilhaendler: E-Teile-Kataloge ausbauen, Verbrenner-Sortiment aber nicht vorschnell abschmelzen. Das Zulieferer-Ranking mit CATL und Huayu unterstreicht die Verschiebung Richtung Batterie- und China-Lieferketten, was Sourcing- und Datenqualitaet (Fahrzeugzuordnungen fuer BYD, Zeekr und Co.) in B2B/B2C-Webshops zum Wettbewerbsfaktor macht.", "hvtraining": "Mit der BGHM-Praxishilfe 021 und der DGUV-FAQ liegen jetzt konkrete Umsetzungshilfen zur DGUV Information 209-093 vor, ideal als Grundlage fuer aktualisierte Schulungsunterlagen und Qualifikationsnachweise. Verbindliche Rettungskraefte-Schulungen und 28,4 Prozent BEV-Neuzulassungsanteil machen herstelleruebergreifende HV-Qualifizierung, inklusive China-Marken, zum Kerngeschaeft."}, {"date": "2026-07-09", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Juni-Bilanz: E-Autos ueberholen erstmals die Verbrenner bei den Neuzulassungen", "text": "Mit 84.057 BEV-Neuzulassungen (+78,2 Prozent) und einem Marktanteil von 28,4 Prozent haben Elektroautos im Juni die Benziner ueberholt. Benziner-Zulassungen sanken um 16,8 Prozent, Diesel um 5,1 Prozent; Tesla legte um 317,6 Prozent zu, BYD um 273,7 Prozent.", "url": "https://www.auto-motor-und-sport.de/verkehr/neuzulassungen-juni-2026-elektroautos-boomen-und-ueberholen-die-verbrenner/", "urlLabel": "auto motor und sport"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Marktstart im Juli: VW ID.3 Neo ab 33.995 Euro, Audi Q4 e-tron ab 47.500 Euro", "text": "Beide Modelle starten in diesem Monat und verschaerfen den Wettbewerb in der Mittelklasse. Die Durchschnittsreichweite neuer E-Modelle liegt 2026 bei rund 523 km (Vorjahr 472 km), 800-Volt-Architekturen druecken die Ladezeiten weiter nach unten.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "AUTOZEITUNG"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV 209-093 als Leitplanke: FAQ-Praxishilfen fuer die betriebliche Umsetzung", "text": "Die DGUV Information 209-093 (Nachfolger der 200-005) definiert die Qualifizierungsstufen von der sensibilisierten Person bis zur Fachkraft fuer HV-Arbeiten an Fahrzeugen und Maschinen. Die DGUV-FAQ Hochvolttechnik des Fachbereichs Holz und Metall liefert Betrieben konkrete Auslegungshilfen fuer Unterweisung und Qualifikationsnachweise.", "url": "https://www.dguv.de/fb-holzundmetall/sg/sg_fai/mechatronik/faq/02_hochvolt/index.jsp", "urlLabel": "DGUV"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Sicherheitspaket 2026 komplett: GSR-Pflichten, strengere Crashtests, Rettungskraefte-Schulungen", "text": "Seit Juli muessen alle neu zugelassenen Fahrzeuge die erweiterten Assistenzsysteme der EU General Safety Regulation erfuellen; parallel gelten verschaerfte Crashtests, neue Batteriehaltbarkeits-Vorgaben und verbindliche Rettungskraefte-Schulungen. Die aktualisierten VDE-Anwendungsregeln 4105 und 4100 regeln zudem die netzdienliche Steuerung von Wallboxen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Neues Zulieferer-Ranking: Bosch verteidigt Platz 1, CATL springt aufs Podium", "text": "Die am 7. Juli erschienene Sonderausgabe der Automobil Produktion fuehrt Bosch weiter auf Platz 1 der weltgroessten Zulieferer, gefolgt von Denso; Batterieriese CATL erreicht erstmals das Podium. Neu in den Top 10 sind der chinesische Zulieferer Huayu (Hasco) und Bridgestone, was die Gewichtsverschiebung Richtung Batterie und China unterstreicht.", "url": "https://www.automobil-produktion.de/global-automotive-business/das-sind-die-zehn-groessten-zulieferer-der-autoindustrie-1/1103084", "urlLabel": "Automobil Produktion"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "Mindestpreis-System statt Strafzoelle: neue EU-Linie fuer chinesische E-Autos", "text": "Das von der EU-Kommission angekuendigte Preisverpflichtungs-System ersetzt die seit November 2024 geltenden Ausgleichszoelle auf chinesische Elektroautos: Hersteller verpflichten sich, ihre Modelle nicht unter einem festgelegten Mindestpreis zu verkaufen. Erste Modelle fallen bereits unter die Regelung, fuer Haendler und Kaeufer schafft das planbarere Preisstrukturen.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "Automobilsalon Bellemann"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-BEV-Anteil nach fuenf Monaten bei 20 Prozent, T&E sieht Kipppunkt erreicht", "text": "Rund 950.000 BEV-Neuzulassungen von Januar bis Mai entsprechen 20 Prozent Marktanteil in der EU, nach 15,3 Prozent im Vorjahreszeitraum. Der T&E-Progress-Report sieht Absatz und Erschwinglichkeit am Kipppunkt und erwartet 23 Prozent fuer 2026; der VDA rechnet fuer Deutschland mit plus 30 Prozent auf knapp 700.000 Einheiten.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "EAFO / EU-Kommission"}], "beratung": "Das neue Zulieferer-Ranking mit CATL auf dem Podium und Huayu neu in den Top 10 belegt die Gewichtsverschiebung Richtung Batterie- und China-Zulieferer, was Sourcing-Strategien im Ersatzteilhandel direkt betrifft. Das EU-Mindestpreis-System macht den wachsenden Bestand chinesischer E-Autos fuer B2B/B2C-Webshops planbarer: Teilekataloge und Fahrzeugzuordnungen fuer BYD, Zeekr und Co. sollten jetzt systematisch aufgebaut werden.", "hvtraining": "Mit der seit Juli vollstaendig wirksamen GSR, verbindlichen Rettungskraefte-Schulungen und der DGUV 209-093 samt FAQ-Praxishilfen ist der regulatorische Rahmen fuer 2026 komplett; Betriebe ohne aktualisierte Qualifikationsnachweise haben jetzt Handlungsdruck. Ein BEV-Neuzulassungsanteil von 28,4 Prozent macht HV-Arbeiten endgueltig zum Werkstatt-Alltag, herstelleruebergreifende Schulungen inklusive China-Marken gewinnen an Bedeutung."}, {"date": "2026-07-08", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Juni-Zulassungen: Tesla Model Y und BYD Seal U dominieren, BEV-Anteil bei 28,4 Prozent", "text": "Im Juni 2026 wurden 84.057 reine Elektroautos neu zugelassen, ein Plus von 78,2 Prozent, der BEV-Anteil erreichte 28,4 Prozent. Die Monatswertung fuehren Tesla Model Y und BYD Seal U an; Tesla steigerte die Neuzulassungen um 317,6 Prozent, BYD um 273,7 Prozent.", "url": "https://www.notebookcheck.com/Elektroautos-im-Juni-2026-Tesla-Model-Y-und-BYD-Seal-U-dominieren-E-Auto-Zulassungen-in-Deutschland.1336588.0.html", "urlLabel": "Notebookcheck"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Skoda Elroq bleibt beliebtestes E-Auto 2026, Durchschnittsreichweite steigt auf 523 km", "text": "Kumuliert fuehrt der Skoda Elroq mit 16.823 Neuzulassungen die deutsche Jahreswertung vor dem Tesla Model Y an. Die durchschnittliche Reichweite neuer E-Modelle liegt 2026 bei rund 523 km (Vorjahr 472 km); 800-Volt-Architekturen verkuerzen die Ladezeiten weiter.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juli-2026/", "urlLabel": "Business Insider"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Potentialausgleich nach UN ECE R100: unter 0,1 Ohm als Kernelement der HV-Sicherheit", "text": "Ein aktueller Fachbeitrag beleuchtet den Potentialausgleich als zentrales Schutzelement im HV-System: Nach UN ECE R100, Abschnitt 5.1, muss der Potentialausgleichswiderstand unter 0,1 Ohm liegen. Die Vorgabe schuetzt vor gefaehrlichen Kurzschlussstroemen bei einem doppelten Isolationsfehler und ist fuer Entwicklung wie Pruefpraxis relevant.", "url": "https://tcs-engineering.expoya.com/expos/der-potentialausgleich-im-hochvolt-system:-was-man-ueber-dies-kernelement-elektrischer-hochvoltsicherheit-wissen-muss", "urlLabel": "TCS Engineering"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV 209-093: Sensibilisierungspflicht auch fuer reine Bediener von HV-Systemen", "text": "Die DGUV Information 209-093 (Nachfolger der 200-005) verlangt, dass auch Beschaeftigte, die HV- oder Gasantriebssysteme lediglich fahrerartig bedienen, arbeitsschutzrechtlich sensibilisiert werden. Betroffen sind damit neben Werkstattpersonal auch Fuhrpark-, Logistik- und Maschinenbediener.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Regelwerk 2026: strengere Crashtests, Batteriehaltbarkeit und Rettungskraefte-Schulungen", "text": "Fuer E-Fahrzeuge gelten 2026 verschaerfte Crashtest-Anforderungen, neue Vorgaben zur Batteriehaltbarkeit und verbindliche Schulungen fuer Rettungskraefte. Parallel bleiben die seit Maerz aktualisierten VDE-Anwendungsregeln 4105 und 4100 fuer den Netzanschluss von Ladeinfrastruktur massgeblich.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer erwarten 2026 haertere Preisverhandlungen mit den OEMs", "text": "Wenn die OEM-Ertraege schrumpfen, wird der Einkauf zum Ergebnishebel, die Rechnung landet bei den Zulieferern. Die strukturelle Krise haelt an: 257 Insolvenzen seit 2020, davon 59 allein 2025, bei EBIT-Margen verbreitet unter 5 Prozent.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Flottenstreit: sieben Staaten gegen Aufweichung, BEV-Anteil auf Kurs zu 23 Prozent", "text": "Frankreich, Spanien, Portugal, die Niederlande, Luxemburg und Schweden warnen, die Aufweichung der CO2-Flottenziele durch das EU-Automobilpaket (E-Fuels-Ausnahme nach 2035) sei ein strategischer Fehler. Laut T&E-Progress-Report treiben die Ziele den EU-BEV-Anteil 2026 auf rund 23 und 2027 auf 28 Prozent; Januar bis Mai lag er bereits bei 20 Prozent.", "url": "https://www.transportenvironment.org/articles/ev-progress-report-2026", "urlLabel": "Transport & Environment"}], "beratung": "Die Dominanz von Tesla Model Y und BYD Seal U in der Juni-Wertung bestaetigt: Teilekataloge und Fahrzeugzuordnungen fuer Importmarken gehoeren in B2B/B2C-Webshops jetzt ganz nach oben auf die Prioritaetenliste. Haertere OEM-Preisverhandlungen 2026 erhoehen zudem den Kostendruck in der gesamten Lieferkette, waehrend der ungeloeste EU-Flottenstreit die zweigleisige Sortimentsstrategie fuer Verbrenner und BEV weiter rechtfertigt.", "hvtraining": "Der Potentialausgleich nach UN ECE R100 (unter 0,1 Ohm) eignet sich als praxisnahes Vertiefungsthema fuer Stufe-3-Schulungen, insbesondere fuer die Messpraxis bei Reparatur und Instandsetzung. Die Sensibilisierungspflicht der DGUV 209-093 fuer reine Bediener und die verbindlichen Rettungskraefte-Schulungen erweitern die Zielgruppen fuer HV-Qualifizierung weit ueber die Werkstatt hinaus."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
