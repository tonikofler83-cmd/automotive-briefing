ne-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date": "2026-07-03", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW ID.3 Neo startet im Juli", "text": "Volkswagen bringt das Facelift des ID.3 als „ID.3 Neo“ im Juli 2026 zum Basispreis ab 33.995 Euro auf den Markt. Auch Zeekr 7GT, Audi Q4 e-tron und die Mercedes C-Klasse EQ starten diesen Monat – bis Jahresende sollen ueber 60 weitere E-Modelle folgen.", "url": "https://www.elektroauto-news.net/", "urlLabel": "Elektroauto-News"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Anteil an Neuzulassungen steigt auf 35 Prozent", "text": "Von Januar bis Mai 2026 lag der Anteil von reinen Elektroautos und Plug-in-Hybriden an den Neuzulassungen bei 35 Prozent, reine BEVs bei 24 Prozent. Die wiedereingefuehrte Umweltpraemie in Deutschland duerfte den Trend im weiteren Jahresverlauf verstaerken.", "url": "https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/", "urlLabel": "ADAC"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "EU-Sicherheitsverordnung (GSR) ab Juli vollstaendig in Kraft", "text": "Die General Safety Regulation der EU verlangt ab Juli 2026 fuer alle neu zugelassenen Fahrzeuge erweiterte Fahrassistenzsysteme. Zusammen mit neuen Batteriehaltbarkeits-Anforderungen und verschaerften Crashtests steigen die technischen Anforderungen an Hersteller und Werkstaetten.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV Information 209-093 regelt HV-Arbeitssicherheit neu", "text": "Die neue DGUV-Information 209-093 ersetzt die bisherige Regel 200-005 und definiert die erforderlichen Qualifikationsstufen fuer den Umgang mit Hochvolt- und Gasantriebssystemen – von unterwiesenen Personen bis zur Fachkraft. Betriebe muessen ihre Schulungskonzepte entsprechend anpassen.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer zwischen Schock und Umbruch", "text": "Eine aktuelle Oliver-Wyman-Studie zeigt: Deutsche Automobilzulieferer kaempfen mit EBIT-Margen unter 5 Prozent, deutlich unter dem Niveau internationaler Wettbewerber. Seit 2020 wurden 257 Insolvenzen bei Zulieferern mit ueber 10 Millionen Euro Umsatz gezaehlt, 59 allein in 2025.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Chinesische Investoren kehren bei Zulieferer-Uebernahmen zurueck", "text": "Nach Jahren der Zurueckhaltung interessieren sich asiatische, vor allem chinesische Investoren wieder verstaerkt fuer europaeische Zulieferer-Uebernahmen – auch angesichts der EU-Zollthematik. Die Konsolidierungswelle in der Branche duerfte sich dadurch fortsetzen.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus 2035 fuer E-Fuels auf", "text": "Das Automobilpaket der EU-Kommission erlaubt Neuwagen mit Verbrennungsmotor auch nach 2035, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden. Parallel soll der vorgeschlagene Industrial Accelerator Act die Einfuehrung sauberer Fertigungstechnologien in der EU beschleunigen.", "url": "https://www.cleanthinking.de/elektroauto-disruption-verbrenner-aus/", "urlLabel": "cleanthinking.de"}], "beratung": "Die Kombination aus Insolvenzwelle und Margendruck bei Zulieferern erhoeht den Beratungsbedarf bei Prozessoptimierung und Restrukturierung, besonders fuer Tier-2/3-Betriebe. Fuer B2B/B2C-Ersatzteilehaendler lohnt sich jetzt der Blick auf Webshop-Prozesse, da die wachsende E-Auto-Flotte neue Teile- und Servicebedarfe erzeugt.", "hvtraining": "Die neue DGUV Information 209-093 schafft konkreten Schulungsbedarf fuer Werkstaetten und Fuhrparkbetreiber im Umgang mit HV- und Gasantriebssystemen. Die vollstaendige GSR-Pflicht ab Juli erhoeht zusaetzlich den Qualifizierungsdruck auf Werkstattpersonal – ein guter Zeitpunkt, HV-Trainingsangebote aktiv zu bewerben."}, {"date": "2026-07-02", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Deutschland: E-Auto-Absatz legt kraeftig zu", "text": "Der Absatz von Elektroautos in Deutschland stieg im April um 41,3 Prozent, angetrieben von der rueckwirkend zum 1. Januar 2026 geltenden Kaufpraemie. Der Verband der Automobilindustrie erwartet fuer 2026 einen Anstieg der E-Auto-Neuzulassungen um rund 30 Prozent auf knapp 700.000 Einheiten.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "elektroauto-news.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Neue E-Modelle: Jeep Compass 4xe und Zeekr 7GT starten", "text": "Jeep erweitert sein Elektro-Portfolio um den Compass 4xe mit bis zu 674 km Reichweite und 160 kW Ladeleistung. Zeitgleich startet der chinesische Zeekr 7GT ab 47.990 Euro in Europa, waehrend chinesische Marken bereits ueber 15 Prozent Marktanteil in Westeuropa halten.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "autozeitung.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV Information 209-093 loest bisherige HV-Qualifikationsregel ab", "text": "Die neue DGUV Information 209-093 ersetzt die bisherige Regel 200-005 und definiert die erforderlichen Qualifikationsstufen von unterwiesenen Personen bis Fachkraft fuer Arbeiten an Hochvoltsystemen. Betriebe muessen ihre Schulungsnachweise entsprechend anpassen.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "pressewissen.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "EU General Safety Regulation seit Juli 2026 vollstaendig in Kraft", "text": "Mit Juli 2026 muessen alle neu zugelassenen Fahrzeuge in der EU ueber erweiterte Assistenzsysteme gemaess der General Safety Regulation verfuegen. Zusaetzlich verschaerfen neue Crashtest-Anforderungen und Batterie-Haltbarkeitsvorgaben die Sicherheitsstandards fuer E-Fahrzeuge.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer im strukturellen Umbruch", "text": "Die deutsche Zulieferindustrie verzeichnete 2025 mit 59 Insolvenzen einen weiteren Anstieg gegenueber 56 im Vorjahr. EBIT-Margen liegen haeufig unter 5 Prozent, was Investitionen aus eigener Kraft kaum noch zulaesst. Grund sind hohe Standortkosten, Volumenverluste an asiatische Wettbewerber und die parallele Investition in Verbrenner- und E-Technik.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "oliverwyman.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-CO2-Flottengrenzwerte treiben Elektrifizierung", "text": "Die EU-Flottenzielwerte von rund 93,6 g CO2/km zwingen Hersteller zu hohen Elektroquoten, andernfalls drohen Strafzahlungen in Milliardenhoehe. Gleichzeitig hat die EU den Rahmen angepasst, sodass Verbrenner-Neuwagen auch nach 2035 zugelassen werden koennen, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden.", "url": "https://www.transportenvironment.org/articles/ev-progress-report-2026", "urlLabel": "transportenvironment.org"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "Ladeinfrastruktur: AFIR-Verordnung zeigt Wirkung", "text": "Die Verordnung (EU) 2023/1804 (AFIR) zur Bereitstellung von Ladeinfrastruktur fuer alternative Kraftstoffe treibt den Ausbau in Europa voran. Ergaenzend zeigen neue VDE-Anwendungsregeln (4105, 4100, seit Maerz 2026 aktualisiert) direkte Auswirkungen auf die Ladeinfrastruktur fuer E-Fahrzeuge.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "European Alternative Fuels Observatory"}], "beratung": "Der anhaltende Margendruck bei deutschen Zulieferern (EBIT unter 5%, steigende Insolvenzen) erhoeht den Beratungsbedarf bei Prozessoptimierung und Kostenstruktur, besonders im Ersatzteilhandel mit Blick auf B2B/B2C-Webshops. Die parallele Investition in Verbrenner- und E-Technik zwingt viele Haendler, ihre Sortiments- und UX-Strategie fuer beide Antriebsarten zu schaerfen.", "hvtraining": "Die neue DGUV Information 209-093 macht eine Ueberpruefung bestehender HV-Qualifikationsnachweise in Betrieben dringend erforderlich, ein klarer Ansatzpunkt fuer Schulungsangebote. Mit voller Wirksamkeit der EU GSR seit Juli 2026 und steigenden E-Auto-Zulassungen waechst zudem der Bedarf an Schulungen fuer Rettungskraefte im Umgang mit HV-Fahrzeugen."}, {"date": "2026-07-01", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Mercedes C-Klasse EQ startet im Juli mit bis zu 760 km Reichweite", "text": "Die elektrische C-Klasse (C-Klasse EQ) kommt im Juli 2026 ausschliesslich als Limousine mit grossem Hyperscreen und wird voraussichtlich unter 70.000 Euro kosten. Die WLTP-Reichweite von bis zu 760 km positioniert das Modell im Premiumsegment gegen Tesla und BYD.", "url": "https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/neue-elektroautos-2026/", "urlLabel": "ADAC"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW ID.3 Neo und Zeekr 7GT: neue Modelle unter 50.000 Euro", "text": "Der VW ID.3 Neo startet im Juli ab 33.995 Euro, der Zeekr 7GT ab 47.990 Euro mit einer Ladezeit von nur 13 Minuten fuer 10 bis 80 Prozent. Beide Modelle verschaerfen den Preisdruck im Mittelklasse-Segment weiter.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "autozeitung.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV Information 209-093 loest Vorgaenger-Regelung endgueltig ab", "text": "Die DGUV Information 209-093 ersetzt die bisherige 200-005 und definiert die Qualifikationsstufen von der sensibilisierten Person bis zur Fachkraft fuer Hochvolt- und Gasantriebssysteme neu. Fuer HV-Trainer und Werkstaetten entsteht Anpassungsbedarf bei Schulungsunterlagen und Qualifikationsnachweisen.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Strengere Crashtests und Batterie-Regularien fuer E-Autos seit 2026", "text": "2026 gelten verschaerfte Crashtest-Anforderungen und Batterie-Haltbarkeitsvorgaben fuer Elektrofahrzeuge, zudem ist eine verpflichtende Rettungskraefte-Schulung eingefuehrt. Parallel greifen die seit Maerz aktualisierten VDE-Anwendungsregeln 4105/4100 fuer die netzvertraegliche Steuerung von Wallboxen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer zwischen Schock und Umbruch", "text": "Eine Oliver-Wyman-Studie zaehlt 257 Zulieferer-Insolvenzen zwischen 2020 und 2025, davon 59 allein in 2025. EBIT-Margen liegen verbreitet unter 5 Prozent, deutlich hinter US- und asiatischen Wettbewerbern, was Investitionen in die Transformation erschwert.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus 2035 auf - E-Fuels als Ausnahme", "text": "Das im Dezember vorgelegte EU-Automobilpaket erlaubt Neuwagen mit Verbrennungsmotor auch nach 2035, sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden. Hersteller, die ihre CO2-Flottenziele 2025 verfehlt haben, wollen diese 2026 uebererfuellen statt auf Pooling zu setzen.", "url": "https://www.transportenvironment.org/articles/ev-progress-report-2026", "urlLabel": "Transport & Environment"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "Europas E-Auto-Markt startet 2026 mit 20 Prozent BEV-Anteil", "text": "Der europaeische EV-Markt beginnt 2026 mit einem BEV-Marktanteil von rund 20 Prozent. Der VDA erwartet einen Zulassungsanstieg um 30 Prozent auf knapp 700.000 Einheiten in Deutschland, getrieben durch die Rueckkehr staatlicher Kaufpraemien und neue Modelle im Mittelklasse-SUV-Segment.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "EAFO / EU-Kommission"}], "beratung": "Die Zulieferer-Krise mit strukturell niedrigen Margen (unter 5 Prozent) erhoeht den Kostendruck entlang der Lieferkette bis zu Ersatzteilhaendlern - Webshop-Betreiber sollten Lieferantendiversifikation und alternative Bezugsquellen fruehzeitig pruefen. Die Aufweichung des Verbrenner-Aus 2035 durch E-Fuels-Ausnahmen duerfte die Nachfrage nach Verbrenner-Ersatzteilen laenger stabil halten als bisher angenommen, was Sortimentsentscheidungen beeinflusst.", "hvtraining": "Die DGUV Information 209-093 macht eine Aktualisierung bestehender Schulungsunterlagen und Qualifikationsnachweise fuer HV-Trainer noetig, insbesondere bei der Abgrenzung der Qualifikationsstufen. Mit wachsendem BEV-Marktanteil (rund 20 Prozent EU-weit) und der Pflicht zur Rettungskraefte-Schulung steigt zudem die Nachfrage nach HV-Sicherheitsschulungen fuer Werkstaetten und Rettungsdienste weiter."}, {"date": "2026-06-30", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Skoda Elroq bleibt Jahreschampion – BEV-Anteil 2026 bei knapp 24 %", "text": "Kumuliert bis Mai 2026 fuehrt der Skoda Elroq mit 16.823 Neuzulassungen die deutsche EV-Rangliste an, gefolgt von VW ID.3 (14.726) und Tesla Model Y (13.678). Reine Elektroautos machen bereits fast 24 % aller Neuzulassungen in Deutschland aus – ein Rekordwert fuer das laufende Jahr.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/", "urlLabel": "Business Insider"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "65 neue E-Modelle 2026 – Ioniq 6 N, Polestar 3 und Tesla-Produktionssteigerung", "text": "2026 kommen 65 neue Elektromodelle auf den europaeischen Markt. Highlights: Hyundai Ioniq 6 N (478 kW, 0-100 km/h in 3,2 s) und neuer Polestar 3 mit 647 km Reichweite und 350 kW Ladeleistung. Tesla steigert parallel die Produktion in Gruenheide auf 7.500 Fahrzeuge pro Woche.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "autozeitung.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Chinesische EV-Marken bauen Europa-Anteil auf 13,9 % aus", "text": "Chinesische Hersteller werden 2026 laut Studie rund 13,9 % am europaeischen BEV-Neuwagenvolumen halten – ca. 420.000 Einheiten. BYD, XPeng und SAIC gewinnen besonders im Mittelklassesegment Boden und zwingen europaeische OEMs, ihre Preisstrategien zu ueberdenken.", "url": "https://www.elektroauto-news.net/news/studie-china-europa-anteil-2026-massiv-ausbau", "urlLabel": "elektroauto-news.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV 209-093: Pflichtstandard fuer HV-Arbeitssicherheit an Fahrzeugen und Maschinen", "text": "Die DGUV Information 209-093 regelt verbindlich die Qualifikationsanforderungen fuer alle Beschaeftigten, die Fahrzeuge oder Maschinen mit Hochvolt- oder Gasantrieb bedienen oder warten – von der sensibilisierten Person bis zur Fachkraft. Die Regelung ersetzte DGUV 200-005 und ist 2026 fuer alle Betriebe mit EV/HV-Fahrzeugen verpflichtend umzusetzen.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue EU-Sicherheitsnormen 2026: Crash-Tests, Batterie-Haltbarkeit und Rettungskraefte-Schulungspflicht", "text": "Ab 2026 gelten verscharfte EU-Crashtestvorschriften und verbindliche Batterie-Haltbarkeitsregeln fuer Elektrofahrzeuge. Erstmals sind Pflichtschulungen fuer Rettungskraefte im Umgang mit HV-Systemen vorgeschrieben. Die aktualisierten VDE-Regeln 4105 und 4100 (seit Maerz 2026) verscharfen zudem Zertifizierungsanforderungen fuer Ladeinfrastruktur.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "VW-Sparpaket 6 Mrd. EUR jaehrlich – Zuliefererkrise hat strukturelle Dimension erreicht", "text": "Volkswagen kuendigte auf der Hauptversammlung Juni 2026 Netto-Einsparungen von ueber 6 Mrd. EUR jaehrlich an. Oliver Wyman verzeichnet 2020-2025 insgesamt 257 Zulieferer-Insolvenzen (59 allein 2025). Deutsche Zulieferer kaempfen mit EBIT-Margen unter 5 % – zu wenig fuer Eigenmittelfinanzierung des Technologiewandels.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU: 950.521 BEV Januar-Mai 2026 – 25 % Marktanteil bis Jahresende erwartet", "text": "In der EU wurden Januar bis Mai 2026 insgesamt 950.521 batterieelektrische Fahrzeuge zugelassen (20 % Marktanteil). Analysten erwarten bis Jahresende einen Anstieg auf 25 %, getrieben durch CO2-Flottenziele (93,6 g/km) und guenstigere Modelle. Die EU erlaubt Verbrenner-Neuwagen nach 2035 weiterhin – sofern sie ausschliesslich mit klimaneutralen E-Fuels betrieben werden.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "EAFO / EU-Kommission"}], "beratung": "Der gleichzeitige Druck durch EU-CO2-Ziele, wachsende China-Konkurrenz (13,9 % Marktanteil) und Zuliefererkrise (59 Insolvenzen 2025) erzeugt einen Schereneffekt: OEMs muessen guenstigere BEV-Modelle bringen, waehrend ihre Zulieferer kaum Eigenkapital fuer Transformation haben. Beratungsmandate liegen jetzt in Restrukturierung, Portfolio-Bereinigung und strategischer EV-Plattform-Positionierung.", "hvtraining": "DGUV 209-093 und die aktualisierten VDE-Regeln 4105/4100 schaffen verbindlichen Qualifizierungsbedarf fuer alle Betriebe mit HV-Fahrzeugen und Ladeinfrastruktur. Mit BEV-Marktanteilen ueber 20 % EU-weit steigt die Anzahl betroffener Fahrzeuge in Werkstaetten rapide. Die neue Rettungskraefte-Schulungspflicht eroeffnet zudem einen strukturierten Zugang zu Feuerwehren und THW als Neukunden."}, {"date": "2026-06-29", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Skoda Elroq bleibt Marktfuehrer – BEV-Anteil bei 25 % in Deutschland", "text": "Der Skoda Elroq verdraengt das Tesla Model Y und fuehrt mit 16.823 Neuzulassungen (kumuliert) die deutsche EV-Rangliste 2026 an. VW ID.3 und Skoda Enyaq folgen auf den Plaetzen zwei und drei. Der VW-Konzern haelt mit 23,6 Prozent Marktanteil die Fuehrungsposition im europaeischen EV-Markt.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/", "urlLabel": "Business Insider"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Staatliche Kaufpraemie greift: EV-Neuzulassungen steigen um 39 %", "text": "Seit Mai 2026 ist die neue gestaffelte Umweltpraemie (1.500 bis 6.000 Euro je nach Einkommen und Kinderzahl) beantragbar. Im ersten Monat wurden 59.969 reine Elektrofahrzeuge zugelassen – ein Marktanteil von 25 Prozent und ein Plus von 39,3 Prozent gegenueber dem Vorjahresmonat. Die Massnahme zeigt sofortige Wirkung auf das Kaufverhalten.", "url": "https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/", "urlLabel": "basicthinking.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Europa: 950.521 BEV in fuenf Monaten – 20 % Marktanteil EU-weit", "text": "Von Januar bis Mai 2026 wurden in der EU insgesamt 950.521 batterieelektrische Fahrzeuge neu zugelassen, was einem Marktanteil von 20 Prozent entspricht. Analysten erwarten, dass BEV bis Ende 2026 rund 25 Prozent der EU-Neuzulassungen erreichen. China-Marken bauen ihren Europa-Anteil in der Mittelklasse zunehmend aus.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "EAFO / EU-Kommission"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV 209-093 und VDE 4105/4100: Neues Normenfundament fuer HV-Qualifikationen", "text": "Die DGUV Information 209-093 ist der aktuell gueltiger Pflichtstandard fuer alle Beschaeftigten, die Fahrzeuge mit Hochvolt- oder Gasantriebssystemen bedienen oder warten – von der sensibilisierten Person bis zur Fachkraft. Die seit Maerz 2026 aktualisierten VDE-Anwendungsregeln 4105 und 4100 definieren neue technische Anforderungen fuer den Anschluss von Ladeinfrastruktur. Schulungsunterlagen auf aelterem Stand muessen umgehend geprueft und aktualisiert werden.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen / DGUV"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Verscharfte EU-Sicherheitspflichten 2026: Crashtest, Batteriehaltbarkeit, Rettungskraefte", "text": "Ab 2026 gelten verscharfte EU-Crashtest-Anforderungen fuer Elektrofahrzeuge sowie verbindliche Batterie-Haltbarkeitsvorschriften. Erstmals sind auch Pflichtschulungen fuer Rettungskraefte im Umgang mit HV-Systemen vorgeschrieben. Die Neuregelungen erhoehen die Anforderungen an Fahrzeugentwicklung und betriebliche Sicherheitskonzepte gleichermassen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "VW-Konzernchef Blume: 6-Milliarden-Sparpaket auf Hauptversammlung Juni 2026", "text": "Volkswagen-CEO Oliver Blume kuendigte auf der digitalen Hauptversammlung im Juni 2026 einen Zukunftsplan mit jaehrlichen Netto-Einsparungen von mehr als 6 Milliarden Euro an. Im Hintergrund: Die Zuliefererkrise vertieft sich – laut Oliver Wyman gab es 2020-2025 insgesamt 257 Zulieferer-Insolvenzen, davon 59 allein in 2025. Deutsche Zulieferer kaempfen mit EBIT-Margen unter 5 Prozent.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU CO2-Flottenziel 93,6 g/km: OEMs und Nutzfahrzeughersteller unter Strafzahlungs-Druck", "text": "Die EU-CO2-Regulierung fuer Pkw (ca. 93,6 g/km) zwingt Hersteller zu hohen Elektro-Quoten – bei Nichteinhaltung drohen Milliarden-Strafzahlungen. Gleichzeitig greift die erste EU-CO2-Regulierung fuer Nutzfahrzeuge ab dem zweiten Halbjahr 2025. Ein Treiber fuer den EV-Hochlauf: Der Durchschnittspreis fuer Elektroautos sank 2025 durch regulatorischen Druck um rund 1.800 Euro.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}], "beratung": "Die Kombination aus 25 % EV-Marktanteil in Deutschland, dem VW-Sparpaket und der anhaltenden Zuliefererkrise (59 Insolvenzen allein 2025) zeigt: Der Transformationsdruck ist strukturell und irreversibel. Beratungsmandate sind jetzt besonders gefragt fuer Restrukturierung, Make-or-Buy-Entscheidungen im HV-Bereich sowie Roadmaps zum Plattformwechsel auf 800-V-Architekturen.", "hvtraining": "DGUV 209-093 und die aktualisierten VDE-Regeln 4105/4100 schaffen verbindliche Qualifikationsanforderungen fuer alle Betriebe mit HV-Fahrzeugen und Ladeinfrastruktur. Mit 25 % BEV-Neuanteil steigt die Anzahl betroffener Fahrzeuge in Werkstaetten rapide. Rettungskraefte-Schulungspflicht und verscharfte Batterienormen eroeffnen gezielt neue Zielgruppen fuer strukturierte HV-Trainingsprogramme."}, {"date": "2026-06-16", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "IEA EV Outlook 2026: Ladeinfrastruktur wird zur Engpassfrage", "text": "Der IEA Global EV Outlook 2026 warnt, dass die Ladeinfrastruktur zum kritischen Flaschenhals der Elektromobilitaet wird. Waehrend Fahrzeugzahlen stark wachsen, hinkt der Ausbau oeffentlicher Ladepunkte hinterher - besonders in Suedeuropa und laendlichen Regionen. Die IEA fordert bis 2030 mindestens eine Verdreifachung der installierten Ladekapazitaet.", "url": "https://www.techzeitgeist.de/iea-global-ev-outlook-2026-ladeinfrastruktur-elektromobilitaet/", "urlLabel": "TechZeitgeist / IEA"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Umweltpraemie ab Mai 2026 - EV-Anteil springt auf 25 % in Deutschland", "text": "Seit Mai 2026 kann die neue Umweltpraemie fuer den Kauf von Elektrofahrzeugen in Deutschland beantragt werden. Im ersten Monat zeigt sich der Effekt: 59.969 reine Elektrofahrzeuge wurden neu zugelassen - ein Marktanteil von 25 Prozent und ein Plus von 39,3 Prozent gegenueber dem Vorjahresmonat.", "url": "https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/", "urlLabel": "basicthinking.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW-Konzern dominiert Europa-EV-Markt - Skoda Elroq verdraengt Tesla", "text": "Im Q1 2026 wuchs der europaeische EV-Markt um 24,7 Prozent; die VW Group haelt mit 23,6 Prozent Marktanteil Platz eins. In Deutschland hat der Skoda Elroq das Tesla Model Y als meistgekauftes Elektroauto verdraengt. Chinesische Modelle gewinnen in der Mittelklasse zunehmend Boden.", "url": "https://www.elektroauto-news.net/news/eauto-hersteller-europa-q1-2026", "urlLabel": "elektroauto-news.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "EU-Sicherheitspflichten 2026: Crashtest, Batteriehaltbarkeit, Rettungskraefte", "text": "Ab 2026 gelten verscharfte EU-Crashtest-Anforderungen fuer Elektrofahrzeuge, verbindliche Batterie-Haltbarkeitsvorschriften sowie Pflichtschulungen fuer Rettungskraefte im Umgang mit Hochvoltsystemen. Die Neuregelungen erhoehen die Anforderungen an Fahrzeugentwicklung und betriebliche Sicherheitskonzepte gleichermassen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "800-V-Architektur loest 400-V-Systeme als Plattformstandard ab", "text": "Ab 2025/2026 werden neue Fahrzeugplattformen nahezu ausschliesslich mit 800-V-Technik entwickelt. 400-V-Systeme (MEB, E-GMP, STLA) laufen nur noch in Einstiegssegmenten bis Ende des Jahrzehnts. Fuer Werkstatten und HV-Trainer bedeutet dies: Qualifikationskonzepte muessen die hoehere Systemspannung und spezifische Sicherheitsanforderungen bereits jetzt abbilden.", "url": "https://www.adac.de/rund-ums-fahrzeug/elektromobilitaet/elektroauto/elektroautos-uebersicht-2026/", "urlLabel": "ADAC"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "VDA-Mittelstandstag 17./18. Juni 2026: Zulieferer unter Transformationsdruck", "text": "Am 17. und 18. Juni 2026 findet in Bonn der VDA-Mittelstandstag statt - zentrales Netzwerktreffen fuer Geschaeftsfuehrer mittelstaendischer Zulieferer. Im Fokus steht die Frage, wie Betriebe mit EBIT-Margen unter 5 Prozent den Technologiewandel finanzieren koennen. Continental kuendigte parallel weitere 3.000 Jobkuerzungen in der Autozuliefersparte bis Ende 2026 an.", "url": "https://www.vda.de/de", "urlLabel": "VDA"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "E-Lkw-Quoten: Niederlande und Norwegen fuehren Europa an", "text": "Laut IEA 2026 fuehren die Niederlande (18,2 % E-Lkw-Anteil), Norwegen (17,3 %) und Daenemark (16,9 %) den europaeischen Nutzfahrzeugmarkt an; Deutschland liegt mit 7,1 % ueber dem EU-Schnitt (4,7 %). Die EU-CO2-Regulierung fuer Nutzfahrzeuge erhoht seit Halbjahr 2025 den Druck auf Hersteller ohne ausreichende Elektroquoten erheblich.", "url": "https://www.techzeitgeist.de/iea-global-ev-outlook-2026-ladeinfrastruktur-elektromobilitaet/", "urlLabel": "TechZeitgeist / IEA"}], "beratung": "Der VDA-Mittelstandstag am 17./18. Juni macht deutlich: Die Zuliefererkrise ist kein Randthema mehr. Mit Margen unter 5 Prozent und anhaltendem OEM-Preisdruck brauchen mittelstaendische Zulieferer jetzt konkrete Restrukturierungsstrategien und klare Differenzierungsfelder. Besonders der Wechsel auf 800-V-Plattformen erfordert Investitionsentscheidungen, fuer die viele Tier-2-Betriebe aktuell keine ausreichende Eigenkapitalbasis haben.", "hvtraining": "Die Pflicht-Schulungsanforderungen fuer Rettungskraefte an HV-Fahrzeugen und der 800-V-Plattformwechsel sind zwei starke Argumente fuer aktuelle HV-Trainingsprogramme. Gleichzeitig eroeffnet die steigende E-Lkw-Penetration neue Zielgruppen: Transport- und Logistikunternehmen benoetigen strukturierte HV-Qualifizierung nach DGUV 209-093 fuer Fahrzeugbediener und Werkstattpersonal."}, {"date": "2026-06-15", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Skoda Elroq verdraengt Tesla Model Y als Bestseller in Deutschland", "text": "Im Mai 2026 setzt sich der Skoda Elroq mit 3.083 Neuzulassungen an die Spitze der beliebtesten E-Autos in Deutschland - Tesla verliert seinen jahrelangen Spitzenplatz. VW ID.3 (3.050) und Skoda Enyaq (2.770) folgen dicht dahinter. Das deutet auf eine zunehmende Praeferenz fuer guenstigere europaeische Modelle hin.", "url": "https://www.businessinsider.de/insider-picks/technik/die-beliebtesten-elektroautos-in-deutschland-juni-2026/", "urlLabel": "Business Insider"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-EV-Marktanteil bei 19,7 % - Benziner unter Druck", "text": "Von Januar bis April 2026 erreichten Elektrofahrzeuge einen EU-Marktanteil von 19,7 Prozent - nur noch 2,8 Punkte hinter dem Benziner. Die groessten EU-Maerkte wachsen stark: Italien +73,1 %, Frankreich +48,2 %, Deutschland +41,3 %. In Deutschland wurden im April erstmals mehr E-Autos als Benziner neu zugelassen.", "url": "https://ecomento.de/2026/05/27/januar-bis-april-2026-elektroauto-anteil-in-der-eu-bei-19-7-prozent/", "urlLabel": "ecomento.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "25 % EV-Anteil in Deutschland im Mai 2026", "text": "Im Mai 2026 erreichten Elektrofahrzeuge 25 Prozent Marktanteil bei deutschen Neuzulassungen. Chinesische Anbieter wie XPeng gewinnen mit Modellen unter 50.000 Euro Marktanteile, waehrend die Volkswagen Group mit 23,6 % Marktanteil zwar Volumenfuehrerschaft haelt, aber gegenueber dem Vorjahr (27,1 %) verliert.", "url": "https://www.basicthinking.de/blog/2026/06/07/neuzulassungen-im-mai-2026/", "urlLabel": "Basic Thinking"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "DGUV 209-093: Verbindliche Qualifikationen fuer HV-Arbeit", "text": "Die DGUV Information 209-093 ist der aktuelle Pflichtstandard fuer alle Beschaeftigten, die Fahrzeuge mit Hochvolt- oder Gasantriebssystemen bedienen oder warten - von der sensibilisierten Person bis zur Fachkraft. Die Regelung ersetzt DGUV 200-005 und reagiert auf die zunehmende Verbreitung von E-, Hybrid- und Wasserstofffahrzeugen in Betrieben. Betriebe ohne entsprechend qualifiziertes Personal riskieren Haftung und Betriebsunterbrechungen.", "url": "https://www.pressewissen.de/2026/05/28/arbeitssicherheit-fr-das-bedienen-von-hochvolt-und-gasantriebssystemen/", "urlLabel": "Pressewissen"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue VDE-Regeln 4105/4100 und EU-Crashnormen 2026", "text": "Seit Maerz 2026 gelten aktualisierte VDE-Anwendungsregeln 4105 und 4100 mit technischen Vorgaben fuer Erzeugungsanlagen und netzdienliche Steuerung von Wallboxen. Parallel treten 2026 verscharfte EU-Crashtestvorschriften und verbindliche Batterie-Haltbarkeitsregeln in Kraft. Rettungskraefte muessen nun verpflichtend im Umgang mit HV-Fahrzeugen geschult werden.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Continental streicht 3.000 Jobs - Zuliefererkrise vertieft sich", "text": "Continental plant bis Ende 2026 den Abbau weiterer 3.000 Stellen in der Autozuliefersparte. Im Zeitraum 2020-2025 gab es branchenweit 257 Zulieferer-Insolvenzen, allein 59 davon in 2025. EBIT-Margen lagen verbreitet unter 5 % - zu wenig, um Investitionen aus eigener Kraft zu stemmen. OEMs erhoehen gleichzeitig den Preisdruck bei Verhandlungen.", "url": "https://www.automobil-produktion.de/management/die-radikalen-sparmassnahmen-der-autoindustrie-im-ueberblick/994682", "urlLabel": "automobil-produktion.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-CO2-Flottenziele und E-Fuel-Oeffnung: Doppelstrategie unter Kritik", "text": "Die EU-CO2-Regulierung fuer Nutzfahrzeuge greift ab dem zweiten Halbjahr 2025 mit Zielwerten von ca. 93,6 g CO2/km - OEMs ohne hohe Elektroquoten drohen Milliardenstrafen. Gleichzeitig hat die EU Verbrenner-Neuwagen nach 2035 fuer E-Fuel-Betrieb zugelassen. Experten kritisieren diese Doppelstrategie als widerspruechliches Signal fuer Investitionsentscheidungen der Hersteller.", "url": "https://www.elektroauto-news.net/news/europa-regulierung-hilfe-schaden-parallel", "urlLabel": "Elektroauto-News"}], "beratung": "Der europaeische EV-Markt nimmt unaufhaltsam Fahrt auf - 19,7 % Marktanteil und wachsende Dominanz in Schluesselmaerkten machen die Transformation irreversibel. Fuer Automotive-Berater eroeffnet die Zuliefererkrise mit fast 60 Insolvenzen in 2025 gleichzeitig konkrete Chancen bei Restrukturierung und strategischer Neuausrichtung. OEM-Kunden brauchen jetzt belastbare Roadmaps fuer Elektrifizierung und Lieferkettenstabilitaet.", "hvtraining": "Die Aktualisierung der DGUV 209-093 und der VDE-Regeln 4105/4100 ist ein direkter Trainingsimpuls: Betriebe mit HV-Fahrzeugen oder -Maschinen sind jetzt rechtlich verpflichtet, ihre Belegschaft nach den neuen Standards zu qualifizieren. Das Spektrum reicht von der sensibilisierten Person bis zur Fachkraft - ein klares Argument fuer strukturierte HV-Schulungsangebote auf allen Qualifikationsstufen."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
