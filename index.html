<!DOCTYPE html><html lang="de"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Automotive Briefing &ndash; Archiv</title><style>:root{color-scheme:light}*{box-sizing:border-box;margin:0;padding:0}body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#f5f5f7;color:#1d1d1f;font-size:15px;line-height:1.5;padding:0 0 32px}.header{background:#1d1d1f;color:#fff;padding:16px 16px 10px;position:sticky;top:0;z-index:10}.header h1{font-size:17px;font-weight:700}.header .meta{font-size:12px;color:#aeaeb2;margin-top:2px}.date-scroll{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}.date-scroll::-webkit-scrollbar{display:none}.dpill{flex-shrink:0;font-size:12px;font-weight:600;padding:4px 12px;border-radius:20px;cursor:pointer;background:#2c2c2e;color:#aeaeb2;border:1.5px solid #3a3a3c;white-space:nowrap;transition:all .15s}.dpill.active{background:#fff;color:#1d1d1f;border-color:#fff}.tag-bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}.tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:20px;cursor:pointer;border:1.5px solid transparent;transition:opacity .15s}.tag.ev{background:#e8f5e9;color:#2e7d32;border-color:#2e7d32}.tag.hv{background:#fff3e0;color:#e65100;border-color:#e65100}.tag.branche{background:#e3f2fd;color:#1565c0;border-color:#1565c0}.tag.all{background:#f3e5f5;color:#6a1b9a;border-color:#6a1b9a}.tag.inactive{opacity:.3}.content{padding:12px 12px 0}.card{background:#fff;border-radius:14px;padding:16px;margin-bottom:10px;box-shadow:0 1px 4px rgba(0,0,0,.08);border-left:4px solid #ccc}.card.ev{border-left-color:#2e7d32}.card.hv{border-left-color:#e65100}.card.branche{border-left-color:#1565c0}.card-label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;margin-bottom:5px}.card.ev .card-label{color:#2e7d32}.card.hv .card-label{color:#e65100}.card.branche .card-label{color:#1565c0}.card h2{font-size:15px;font-weight:700;line-height:1.3;margin-bottom:7px}.card p{font-size:14px;color:#3a3a3c;line-height:1.5}.card a.source{display:inline-block;margin-top:8px;font-size:12px;color:#0071e3;text-decoration:none}.highlight-box{background:#1d1d1f;color:#fff;border-radius:14px;padding:16px;margin:10px 12px 0}.highlight-box h3{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;color:#f5d06a;margin-bottom:8px}.hl-row{margin-bottom:10px}.hl-row:last-child{margin-bottom:0}.hl-label{font-size:11px;font-weight:700;color:#aeaeb2;text-transform:uppercase;margin-bottom:3px}.hl-row p{font-size:13px;line-height:1.5}.empty{color:#888;font-size:14px;padding:24px;text-align:center}</style></head><body><div class="header"><h1>Automotive Briefing</h1><div class="meta">Fuer Toni &ndash; HV-Training &amp; Automotive-Beratung</div><div class="date-scroll" id="dateTabs"></div><div class="tag-bar"><span class="tag all" onclick="setFilter('all')">Alle</span><span class="tag ev" onclick="setFilter('ev')">Elektro / EV</span><span class="tag hv" onclick="setFilter('hv')">Hochvolt</span><span class="tag branche" onclick="setFilter('branche')">Branche / EU</span></div></div><div class="content" id="cards"></div><div class="highlight-box" id="highlight"><h3>Einschaetzung des Tages</h3><div class="hl-row"><div class="hl-label">Beratung</div><p id="hlBeratung"></p></div><div class="hl-row"><div class="hl-label">HV-Training</div><p id="hlHV"></p></div></div><script>
/* BRIEFINGS_DATA_START */
const BRIEFINGS = [{"date": "2026-10-05", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "Elektroautos erreichen im August fast 30 Prozent Marktanteil in Europa", "text": "Der BEV-Anteil an den europäischen Neuzulassungen stieg im August 2026 auf 29,3 Prozent, nach 20,2 Prozent im Vorjahr. Die Gesamtzulassungen legten um 52,2 Prozent auf 242.425 Einheiten zu, während Verbrenner auf nur noch 24,2 Prozent Marktanteil fielen.", "url": "https://ecomento.de/2026/10/05/elektroautos-erreichen-fast-30-prozent-marktanteil-in-europa/", "urlLabel": "ecomento.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Chinesische Hersteller wachsen im Europa-Markt um 76 Prozent", "text": "Während Volkswagen mit 82.576 Zulassungen trotz eines Rückgangs von 4,2 Prozent die meistverkaufte Marke bleibt, verzeichnen chinesische Hersteller in Europa ein Plus von 76 Prozent. Kia wuchs mit 16,9 Prozent am stärksten unter den Top-10-Marken, der Tesla Model Y bleibt meistverkauftes BEV-Modell.", "url": "https://ecomento.de/2026/10/05/elektroautos-erreichen-fast-30-prozent-marktanteil-in-europa/", "urlLabel": "ecomento.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Prognose für 2026 angehoben: 741.000 E-Autos in Deutschland erwartet", "text": "Branchenschätzungen heben die Prognose für deutsche BEV-Neuzulassungen 2026 von 708.000 auf 741.000 Fahrzeuge an, ein Marktanteil von 25,4 Prozent. Treiber sind aggressive Marktstrategien chinesischer Hersteller und Teslas, ein neues Förderprogramm mit bis zu 6.000 Euro Zuschuss sowie attraktive Flottenangebote von VW, BMW und Audi.", "url": "https://www.elektroauto-news.net/news/deutschland-2026-prognose-741000-einheiten", "urlLabel": "Elektroauto-News.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Toyota ruft rund 16.200 bZ und Lexus RZ wegen Hochvolt-Steuerungsfehler zurück", "text": "Eine mögliche Fehlfunktion der Batterie-Steuereinheit kann bei den Elektro-SUV Fail-Safe-Modi auslösen und den elektrischen Antrieb beeinträchtigen, während Lenkung und Bremsen funktionsfähig bleiben. Toyota bietet betroffenen Kunden eine kostenfreie Überprüfung und bei Bedarf den Austausch der Steuereinheit an.", "url": "https://www.it-boltwise.de/toyota-r7ckruf-bei-bz-und-lexus-rz-batterie-steuereinheit-im-fokus.html", "urlLabel": "IT-Boltwise"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Jährliche HV-Pflichtschulung nach DGUV 209-093 bleibt zentrale Qualifikationsanforderung", "text": "Fachkundige Personen für Arbeiten an Hochvoltsystemen in Fahrzeugen müssen ihre Qualifikation weiterhin regelmäßig auffrischen, aktuelle Lehrgänge etwa bei TÜV Nord decken Stufe 1 bis 3 inklusive Entwicklung und Fertigung ab. Angesichts wachsender BEV-Flotten und neuer 800-Volt-Architekturen bleibt die Nachfrage nach zertifizierten HV-Fachkräften hoch.", "url": "https://www.tuev-nord.de/de/weiterbildung/seminare/auffrischung-fuer-fachkundige-personen-zum-arbeiten-an-hochvoltsystemen-in-fahrzeugen-stufe-2", "urlLabel": "TÜV Nord"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Zulieferer-Margen übertreffen erstmals seit Vor-Corona-Zeit die der OEMs", "text": "Laut der Berylls-by-AlixPartners-Studie stieg die operative Marge der Top-Zulieferer 2025 auf 5,8 Prozent, während die OEM-Margen von 6,3 auf 4,5 Prozent sanken. Gleichzeitig sanken die Erlöse der Top-25-Zulieferer auf rund 400 Milliarden Euro, hohe Schulden und Zinsen sowie die Abhängigkeit von chinesischen Rohstoffen wie Lithium und Grafit bleiben zentrale Risiken für 2026.", "url": "https://www.produktion.de/wirtschaft/zulieferer-2026-margen-hoch-risiken-hoeher/2140949", "urlLabel": "Produktion.de"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Verkehrsausschuss vertagt Abstimmung über das Automobilpaket", "text": "Die ursprünglich für den 5. Oktober geplante Abstimmung über die gelockerten CO2-Flottenziele (90 statt 100 Prozent Reduktion ab 2035) wurde um rund zwei Wochen verschoben, da sich die Fraktionen der Mitte noch nicht einigen konnten. Deutschland und sechs weitere Länder fordern eine Abschwächung der Ziele, während Spanien, Frankreich, Dänemark und Belgien auf einem ambitionierteren Elektro-Kurs bestehen; die Plenarabstimmung ist nun für November geplant.", "url": "https://www.electrive.net/2026/10/02/eu-verkehrsausschuss-vertragt-abstimmung-ueber-das-auto-paket/", "urlLabel": "electrive.net"}], "beratung": "Die Verschiebung der Zulieferer-Margen über das OEM-Niveau und die anhaltende China-Importwelle (+76 Prozent) verschärfen den Wettbewerbsdruck auf europäische Zulieferer und Ersatzteilehändler zugleich. Mit einem BEV-Marktanteil von fast 30 Prozent in Europa und einer angehobenen Prognose für Deutschland (741.000 Einheiten) sollten Webshop-Betreiber ihr Sortiment konsequent auf E-Antriebs- und HV-Komponenten ausrichten, bevor sich die Nachfrageverschiebung weiter beschleunigt. Die vertagte EU-Abstimmung über das Automobilpaket schafft zusätzliche Planungsunsicherheit bei Verbrenner-Auslaufmodellen, die in Lagerstrategien einzupreisen ist.", "hvtraining": "Der Toyota-Rückruf wegen einer fehleranfälligen Batterie-Steuereinheit zeigt erneut, wie sicherheitskritisch die Diagnose von HV-Steuerungssystemen bleibt, und liefert ein aktuelles Praxisbeispiel für Trainings zu Fail-Safe-Verhalten. Da die jährliche Auffrischung nach DGUV 209-093 für Fachkundige weiterhin Pflicht ist und immer mehr Fahrzeuge auf 800-Volt-Architekturen wechseln, bleibt die Nachfrage nach zertifizierten HV-Schulungen in Werkstätten hoch."}, {"date": "2026-09-28", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "BMW i3 startet mit 800-Volt-Technik und bis zu 900 km Reichweite", "text": "Der neue BMW i3, erstes vollelektrisches Modell der 3er-Baureihe auf der „Neue Klasse“-Plattform, bietet dank 800-Volt-Technik bis zu 900 km Reichweite. Der reguläre Bestellstart ist für Herbst 2026 geplant.", "url": "https://www.autozeitung.de/alle-elektroauto-neuheiten-uebersicht-199510.html", "urlLabel": "autozeitung.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "BEV-Marktanteil in Europa steigt im ersten Halbjahr auf 22 Prozent", "text": "Batterieelektrische Neuzulassungen legten in Europa im ersten Halbjahr 2026 um fünf Prozentpunkte auf 22 Prozent zu. Norwegen (98%) und Dänemark (80%) führen, Deutschland kommt auf 26 Prozent, klassische Verbrenner fielen auf nur noch 30 Prozent Marktanteil.", "url": "https://www.zfk.de/mobilitaet/e-mobilitaet/elektroauto-anteil-steigt-in-europa-halbjahreszahlen-2026", "urlLabel": "zfk.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "CATL startet Batterie-Serienproduktion in Ungarn", "text": "Der chinesische Batteriehersteller CATL hat die Serienproduktion am Standort Debrecen aufgenommen und stärkt damit die europäische Batterie-Lieferkette. Parallel bestätigte Rivian, dass das künftige Einstiegsmodell R3 deutlich günstiger als der R2 positioniert wird.", "url": "https://www.automotiveworld.com/intelligence-briefs/e-mobility-intelligence-brief-september-24-2026/", "urlLabel": "Automotive World"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue Sicherheitsnormen für E-Autos treten 2026 in Kraft", "text": "Verschärfte Crashtests, neue Batterie-Haltbarkeitsvorschriften und verbindliche Rettungskräfte-Schulungen prägen 2026. Die EU-weite General Safety Regulation verlangt ab Juli erweiterte Assistenzsysteme, Euro 7 legt erstmals Mindestanforderungen an die Batteriekapazität nach bestimmten Zeiträumen fest.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer in tiefer Krise: 59 Insolvenzen 2025", "text": "EBIT-Margen deutscher Automobilzulieferer lagen 2025 verbreitet unter 5 Prozent und reichen nicht zur Eigenfinanzierung von Investitionen. Hohe Standortkosten, Volumenverlagerung nach Asien und der Doppelaufwand für Verbrenner- und E-Antriebstechnik trieben laut Oliver-Wyman-Studie 59 Insolvenzen allein 2025.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU drängt China zu Exportbeschränkung bei Hybridfahrzeugen", "text": "Vor dem Trump-Xi-Gipfel fordert die EU von China, Hybrid-Exporte auf rund 15 Prozent des Marktes zu begrenzen, während chinesische E-Autos weiterhin vom US-Markt ausgeschlossen bleiben. Kalifornien verschärft zeitgleich mit sechs neuen Gesetzen den Ausbau der Ladeinfrastruktur.", "url": "https://www.automotiveworld.com/intelligence-briefs/e-mobility-intelligence-brief-september-24-2026/", "urlLabel": "Automotive World"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Ladeinfrastruktur treibt Elektrifizierung weiter voran", "text": "Im Januar 2026 wurden europaweit rund 298.000 Plug-in-Fahrzeuge neu zugelassen, der BEV-Marktanteil lag bei etwa 20 Prozent. Die Volkswagen-Gruppe führt mit rund 26 Prozent Marktanteil vor BMW und BYD, gestützt wird der Hochlauf durch die EU-Verordnung 2023/1804 zum Ausbau der Ladeinfrastruktur.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "EAFO"}], "beratung": "Der Margendruck bei Zulieferern (59 Insolvenzen 2025) und der weiter steigende BEV-Anteil (22% EU-weit) erhöhen den Beratungsbedarf bei B2B/B2C-Ersatzteilehändlern: Sortimente und Lieferketten verschieben sich schneller als geplant, klassische Verbrennerteile verlieren an Relevanz. Webshop-Betreiber sollten jetzt gezielt auf E-Antriebs-Ersatzteile, Ladezubehör und Systemkompetenz statt Einzelteilverkauf setzen, um im verschärften Wettbewerb mit chinesischen Anbietern zu bestehen.", "hvtraining": "Die neuen GSR- und Euro-7-Vorgaben sowie verbindliche Rettungskräfte-Schulungen ab 2026 erhöhen den Schulungsbedarf für HV-Sicherheitstrainings in Werkstätten und bei Rettungsdiensten deutlich. Wer jetzt DGUV-konforme Hochvolt-Qualifizierungen mit Fokus auf Batteriehaltbarkeit und Assistenzsysteme anbietet, positioniert sich vor der verschärften Regulierung."}, {"date": "2026-09-21", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "E-Auto-Neuzulassungen in Europa steigen im August um ueber 54 Prozent", "text": "Der BEV-Marktanteil erreichte im August 30,5 Prozent und lag damit deutlich ueber bisherigen Prognosen. In Deutschland lag der BEV-Anteil im ersten Halbjahr bereits bei 26 Prozent, in Frankreich bei 28 Prozent.", "url": "https://www.automotiveworld.com/newsletters/e-mobility-newsletter-september-14-2026/", "urlLabel": "Automotive World"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Porsche Taycan Turbo GT stellt neuen Nordschleife-Rekord fuer E-Autos auf", "text": "Mit dem erstmals fuer ein Elektroauto eingesetzten Manthey-Kit erreichte der Taycan Turbo GT 600 kW Systemleistung und fuhr eine neue Bestzeit von 6:55,533 Minuten. Das Ergebnis zeigt, wie schnell sich HV-Antriebstechnik im Motorsport-Umfeld weiterentwickelt.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Bewertungskriterien fuer Batteriesicherheit", "text": "Die seit Januar geltenden Euro-NCAP-2026-Protokolle vergeben erstmals Punkte fuer Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte automatisch warnen. Damit ruecken Diagnose- und Kommunikationsfaehigkeiten von HV-Systemen staerker in den Fokus der Fahrzeugbewertung.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Hochvolt-Definition und Referenznormen: ECE R100 und DGUV 209-093", "text": "Nach gaengigen Normen gelten Fahrzeugsysteme ab 60 V Gleichspannung beziehungsweise 30 V Wechselspannung als Hochvolt. Seit Maerz gelten zudem aktualisierte VDE-Anwendungsregeln 4105 und 4100, die den Netzanschluss von PV-Anlagen und Speichern betreffen und fuer HV-Schulungen im Maschinenbereich relevant sind.", "url": "https://www.dguv.de/fb-holzundmetall/sg/sg_fai/mechatronik/faq/02_hochvolt/index.jsp", "urlLabel": "DGUV"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Automobilzulieferer unter Druck: EBIT-Margen unter 5 Prozent", "text": "Waehrend die Umsaetze der Top-OEMs 2024-2025 um rund 10 Prozent (CAGR) wuchsen, sanken die Umsaetze der Top-Zulieferer um 3 Prozent. Chinesische Zulieferer skalieren mit schlankeren Strukturen und niedrigeren Kosten, was den Druck auf deutsche Anbieter weiter erhoeht.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU glaettet CO2-Flottenziel, Verbrenner-Aus moeglicherweise aufgeweicht", "text": "Seit der Verordnung (EU) 2025/1214 gilt das CO2-Flottenziel nicht mehr pro Einzeljahr, sondern als Durchschnitt der Jahre 2025 bis 2027. Das von der EU-Kommission vorgelegte Automobilpaket sieht zudem eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "cleanthinking.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Automechanika Frankfurt 2026: Rekord an Innovationen und neue KI-Formate", "text": "Mit ueber 4.500 Ausstellern und einer Rekordzahl an Innovation Awards zeigt die Automechanika den zunehmenden Digitalisierungs- und KI-Druck auf Werkstaetten und Ersatzteilhandel. Fuer Webshop-Betreiber ergeben sich daraus konkrete Ansatzpunkte fuer Prozessautomatisierung.", "url": "https://www.automobil-industrie.vogel.de/", "urlLabel": "Automobil-Industrie.de"}], "beratung": "Der Margendruck bei deutschen Zulieferern und die zunehmende KI-Digitalisierung auf der Automechanika zeigen, dass Ersatzteilhaendler jetzt auf effiziente Webshop-Prozesse und Automatisierung setzen sollten, um wettbewerbsfaehig zu bleiben. Die Glaettung des EU-CO2-Flottenziels ueber 2025-2027 verschafft OEMs zwar mehr Flexibilitaet, erhoeht aber die Planungsunsicherheit fuer Zulieferer und Handel gleichermassen. Fuer B2B-Webshops lohnt sich jetzt eine Pruefung der Lieferketten-Transparenz, da chinesische Wettbewerber zunehmend Marktanteile gewinnen.", "hvtraining": "Die neuen Euro-NCAP-2026-Kriterien zur Thermal-Runaway-Erkennung unterstreichen, dass HV-Sicherheitsschulungen kuenftig auch Batteriediagnose und Rettungskraefte-Kommunikation staerker abdecken sollten. Mit einem BEV-Marktanteil von ueber 30 Prozent in Europa steigt der Bedarf an qualifiziertem Fachpersonal fuer Arbeiten an Hochvoltsystemen weiter deutlich an. Die Referenznormen ECE R100 und DGUV 209-093 bleiben Kernbestandteil jeder Schulung und sollten regelmaessig auf Aktualitaet geprueft werden."}, {"date": "2026-09-14", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt neuen Einstiegs-Stromer Epiq 35", "text": "Volkswagen startet den Epiq 35 als Basismodell ab 25.900 Euro, eine Version mit 55-kWh-Batterie kostet ab 32.100 Euro und kommt Ende September auf den Markt. Parallel zeigt Porsche mit dem Taycan Turbo GT (Manthey-Kit) auf der Nordschleife eine neue Bestzeit fuer Elektrofahrzeuge von 6:55,533 Minuten.", "url": "https://www.elektroauto-news.net/news", "urlLabel": "Elektroauto-News.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "BEV-Anteil in der EU steigt auf 20 Prozent", "text": "Von Januar bis Mai 2026 wurden in der EU rund 950.521 vollelektrische Fahrzeuge zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahr. Haelt der Trend an, koennten BEV bis Jahresende rund ein Viertel aller Neuzulassungen in Europa ausmachen.", "url": "https://alternative-fuels-observatory.ec.europa.eu/general-information/news/european-ev-market-starts-2026-20-bev-share", "urlLabel": "European Alternative Fuels Observatory"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Chinesische Marken draengen weiter in den EU-Markt", "text": "BYD hat mit 2,1 Prozent Marktanteil in der EU inzwischen Tesla ueberholt, waehrend Tesla in China wegen schwacher Nachfrage und starker Konkurrenz die Preise fuer Model 3 und Model Y senkt. Ein ICCT-Bericht zeigt zudem, dass der Betrieb eines E-Autos in Europa 2025 rund ein Drittel guenstiger war als bei einem vergleichbaren Verbrenner.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP verschaerft Sicherheitsanforderungen an HV-Batterien", "text": "Die seit Januar 2026 geltenden Euro-NCAP-Protokolle bewerten unter anderem, ob Fahrzeuge einen thermischen Durchgehprozess (Thermal Runaway) der Batterie erkennen und Rettungskraefte automatisch warnen koennen. 2026 bringt zudem strengere Crashtests, neue Vorgaben zur Batteriedauerhaltbarkeit und verpflichtende Schulungen fuer Rettungsdienste im Umgang mit E-Fahrzeugen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue VDE-Anwendungsregeln betreffen HV-Ladeinfrastruktur", "text": "Die seit Maerz ueberarbeiteten VDE-Anwendungsregeln 4105 und 4100 definieren neue technische Anforderungen fuer den Anschluss von Erzeugungsanlagen ans Niederspannungsnetz und vereinfachen die Einbindung von PV- und Speichersystemen. Das wirkt sich direkt auf die Planung und Zertifizierung von Ladeinfrastruktur fuer Hochvolt-Fahrzeuge aus.", "url": "https://www.vdik.de/themen/sicherheit-und-verkehr/hochvolt-systeme/", "urlLabel": "VDIK"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer stecken in struktureller Krise", "text": "Laut einer aktuellen Oliver-Wyman-Studie lagen die EBIT-Margen deutscher Zulieferer 2025 verbreitet unter 5 Prozent, waehrend Top-OEMs im gleichen Zeitraum um 10 Prozent (CAGR) wuchsen. Standort- und Transformationskosten sowie der parallele Zwang zu Verbrenner- und Batterieentwicklung verschaerfen den Druck zusaetzlich.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU-Kommission weicht Verbrenner-Aus 2035 auf", "text": "Das im Dezember vorgelegte Automobilpaket der EU-Kommission sieht vor, das faktische Verbrenner-Aus ab 2035 um zehn Prozent aufzuweichen. Hersteller, die ihre CO2-Flottenziele 2025 verfehlt haben, sollen diese 2026 uebererfuellen, statt auf regulatorisches Pooling zurueckzugreifen.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}], "beratung": "Die strukturelle Krise bei Zulieferern und der wachsende BEV-Anteil erhoehen den Druck auf Ersatzteilhaendler, ihr Sortiment staerker auf HV-Komponenten und E-Antrieb-Zubehoer auszurichten. Gleichzeitig verschieben chinesische Marken die Wettbewerbslandschaft, was Webshops zu klarerer Differenzierung bei Beratung, Verfuegbarkeit und Cross-Selling zwingt. Wer jetzt in Prozessautomatisierung und HV-Kompetenz investiert, sichert sich einen Vorsprung, wenn der BEV-Bestand in den naechsten Jahren spuerbar waechst.", "hvtraining": "Die verschaerften Euro-NCAP-Anforderungen und die verpflichtenden Rettungsdienst-Schulungen erhoehen den Bedarf an fundierten HV-Sicherheitsschulungen in Werkstaetten und bei Einsatzkraeften. Die neuen VDE-Regeln fuer Ladeinfrastruktur sollten in Schulungsinhalte zu Installation und Pruefung von HV-Ladesystemen einfliessen. Trainer sollten Thermal-Runaway-Erkennung und Erstmassnahmen als festen Bestandteil aktueller Curricula verankern."}, {"date": "2026-09-07", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "BEV-Marktanteil in Deutschland steigt auf 32,4 Prozent", "text": "Im August 2026 wurden 68.930 rein elektrische Pkw neu zugelassen, der BEV-Marktanteil kletterte auf 32,4 Prozent. Benziner und Diesel verlieren deutlich an Boden.", "url": "https://www.elektroauto-news.net/news/absatz-wachstum-langsamer-2026", "urlLabel": "Elektroauto-News.net"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt Elektro-Polo, neue Modelle im September", "text": "Volkswagen startet im September 2026 die langerwartete Elektroversion des Polo. Parallel debuetieren unter anderem der Mazda CX-6e und der Skoda Epiq 35 ab 25.900 Euro im Einstiegssegment.", "url": "https://www.auto-motor-und-sport.de/elektroauto/neue-elektroautos-2026-das-werden-die-wichtigsten-e-neuheiten-des-jahres/", "urlLabel": "Auto Motor und Sport"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Thermal-Runaway-Erkennung wird Pflichtkriterium", "text": "Die neuen Euro-NCAP-Protokolle bewerten ab 2026 gezielt, ob Batteriesysteme einen thermischen Durchgehprozess fruehzeitig erkennen und Rettungskraefte alarmieren. Das erhoeht die Anforderungen an HV-Sicherheitskonzepte der Hersteller.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "800-Volt-Plattformen werden Standard, HV-Schulungspflicht bleibt scharf", "text": "Neue Fahrzeugplattformen werden seit 2025 nur noch mit 800-Volt-Technik entwickelt, etwa bei Renault Twingo E-Tech und VW ID. Polo. Mitarbeiter an HV-Systemen benoetigen weiterhin jaehrliche Schulungen nach DGUV Information 209-093.", "url": "https://www.tuvsud.com/de-de/store/akademie/seminare-technik/hochvolt", "urlLabel": "TUEV SUED Akademie"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Schere zwischen OEMs und Zulieferern oeffnet sich weiter", "text": "Waehrend grosse Hersteller 2024/25 im Schnitt 10 Prozent Umsatzwachstum verzeichneten, sank der Umsatz der Top-Zulieferer um 3 Prozent. Deutsche Zulieferer kaempfen mit EBIT-Margen unter 5 Prozent und wachsendem Druck durch chinesische Wettbewerber.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Automechanika Frankfurt startet mit Rekordbeteiligung", "text": "Vom 8. bis 12. September 2026 trifft sich die internationale Aftermarket-Branche in Frankfurt. Rund 4.500 Aussteller, neue KI-Formate und ein Rekord bei den Innovation Awards praegen die Messe.", "url": "https://www.automobilwoche.de/", "urlLabel": "Automobilwoche"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus auf, chinesische Marken legen zu", "text": "Die EU-Kommission schlaegt vor, das vollstaendige Verbrenner-Verbot ab 2035 durch ein 90-Prozent-Emissionsziel mit Superkrediten fuer kleine, in Europa gebaute BEV zu ersetzen. Gleichzeitig ueberholt BYD mit 2,1 Prozent Marktanteil erstmals Tesla in der EU.", "url": "https://www.cleanthinking.de/elektromobilitaet-2026-globaler-markt-zahlen/", "urlLabel": "Cleanthinking.de"}], "beratung": "Der wachsende BEV-Marktanteil und die Verschiebung hin zu 800-Volt-Plattformen erhoehen den Bedarf an spezialisierten E-Ersatzteilen und Ladezubehoer im Webshop-Sortiment. Gleichzeitig verschaerft der Vormarsch chinesischer Marken wie BYD den Preisdruck, waehrend klassische Zulieferer unter Margendruck stehen, ein Thema fuer Beratungsmandate zu Sortiments- und Lieferkettenstrategie.", "hvtraining": "Die schaerferen Euro-NCAP-Anforderungen an Thermal-Runaway-Erkennung erhoehen den Schulungsbedarf fuer Rettungskraefte und Werkstaetten im Umgang mit Batteriezwischenfaellen. Die jaehrliche Pflichtschulung nach DGUV 209-093 bleibt Kernanforderung, Trainingsinhalte sollten um 800-Volt-Spezifika ergaenzt werden, da diese Plattformen zum Standard werden."}, {"date": "2026-09-05", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "VW bringt ID.Polo im September 2026 auf den Markt", "text": "Volkswagen startet den Verkauf des lange erwarteten ID.Polo, eines elektrischen Kompaktwagens im 400V-Segment. Parallel dazu erreichte BMW mit dem zweimillionsten vollelektrischen Fahrzeug (i5 M60 xDrive) einen Produktionsmeilenstein.", "url": "https://www.auto-motor-und-sport.de/elektroauto/neue-elektroautos-2026-das-werden-die-wichtigsten-e-neuheiten-des-jahres/", "urlLabel": "auto-motor-und-sport.de"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Marktanteil von E-Autos steigt auf 20 Prozent", "text": "Laut ACEA wurden zwischen Januar und Mai 2026 ueber 950.000 vollelektrische Autos in der EU zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahr. Italien, Frankreich und Deutschland verzeichnen die staerksten Zuwaechse.", "url": "https://www.elektroauto-news.net/news/eautomarkt-europa-2026-ein-starkes-jahr", "urlLabel": "elektroauto-news.net"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026 bewertet Batterie-Thermal-Runaway-Warnsysteme", "text": "Die im Januar eingefuehrten Euro-NCAP-Protokolle 2026 vergeben in vier Kategorien detaillierte Bewertungen und honorieren speziell Systeme, die ein thermisches Durchgehen der Batterie erkennen und Rettungskraefte automatisch alarmieren. Fuer 2026 sind zudem strengere Crashtests und verpflichtende Schulungen fuer Einsatzkraefte vorgesehen.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Neue VDE-Regeln 4105/4100 fuer Ladeinfrastruktur in Kraft", "text": "Seit Maerz gelten aktualisierte VDE-Anwendungsregeln 4105 und 4100, die technische Anforderungen an den Anschluss von Erzeugungsanlagen ans Niederspannungsnetz neu definieren und direkte Auswirkungen auf die Ladeinfrastruktur fuer E-Fahrzeuge haben. Zudem bleibt die 800V-Architektur bei Neuplattformen ab 2025 Standard, waehrend 400V-Technik im Einstiegssegment bis Ende des Jahrzehnts weiterlaeuft.", "url": "https://de.wikipedia.org/wiki/Hochvolt", "urlLabel": "VDE / Hochvolt-Uebersicht"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Automobilzulieferer zwischen Schock und Umbruch", "text": "Eine aktuelle Oliver-Wyman-Studie zeigt: Waehrend Top-OEMs 2024/2025 im Schnitt um 10 Prozent wuchsen, sanken die Umsaetze der Top-Zulieferer um 3 Prozent. EBIT-Margen deutscher Zulieferer lagen 2025 vielfach unter 5 Prozent, zu wenig, um Investitionen aus eigener Kraft zu stemmen.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "oliverwyman.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Automechanika Frankfurt startet im September mit Rekordbeteiligung", "text": "Mit 4.500 Ausstellern, neuen KI-Formaten und einer Rekordzahl an Innovation Awards oeffnet die Automechanika Frankfurt im September ihre Tore. Die Messe gilt als wichtiger Gradmesser fuer Trends bei Ersatzteilen, Werkstattausruestung und digitalen Handelsprozessen.", "url": "https://www.automotive.at/", "urlLabel": "automotive.at"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU lockert Verbrenner-Verbot, plant neues System gegen China-EVs", "text": "Die EU-Kommission schlug im Dezember 2025 vor, das vollstaendige Verbrenner-Verbot durch ein Ziel von 90 Prozent Emissionsreduktion zu ersetzen, mit Superkrediten fuer kleine, in Europa gebaute BEV. Zusaetzlich kuendigte die Kommission im Januar 2026 ein neues Mindestpreissystem an, das die bisherigen Strafzoelle auf chinesische Elektroautos abloesen soll.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der Margendruck bei Zulieferern und die parallele Doppelinvestition in Verbrenner und BEV verschaerfen den Beratungsbedarf bei Kostenstruktur und Portfolio-Priorisierung. Fuer Ersatzteilehaendler bietet die Automechanika Frankfurt eine gute Gelegenheit, neue Digitalisierungs- und KI-Trends im Teilehandel zu beobachten. Die Lockerung des Verbrenner-Verbots durch die EU schafft zusaetzliche Planungsunsicherheit, die in Kundenprojekten beruecksichtigt werden sollte.", "hvtraining": "Die neuen Euro-NCAP-Kriterien zu Batterie-Thermal-Runaway erhoehen den Schulungsbedarf fuer Rettungskraefte und Werkstattpersonal im Umgang mit Warnsystemen. Die aktualisierten VDE-Regeln zur Ladeinfrastruktur sind fuer HV-Schulungen im Werkstattkontext direkt relevant. Der anhaltende Ausbau der 800V-Architektur bei Neuplattformen erfordert eine kontinuierliche Aktualisierung der Trainingsinhalte."}, {"date": "2026-08-24", "cards": [{"cat": "ev", "label": "Elektrofahrzeuge", "title": "EU-Elektroauto-Markt waechst auf 20 Prozent Marktanteil", "text": "Von Januar bis Mai 2026 wurden in der EU rund 950.000 vollelektrische Pkw neu zugelassen, das entspricht einem Marktanteil von 20 Prozent gegenueber 15,3 Prozent im Vorjahreszeitraum. Besonders stark wachsen Italien (+75,7%), Frankreich (+55,4%) und Deutschland (+40,9%).", "url": "https://www.go-electra.com/de/newsroom/electric-car-sales-2026-figures-in-Europe/", "urlLabel": "go-electra.com"}, {"cat": "ev", "label": "Elektrofahrzeuge", "title": "Hybride im Aufwind, EV-Nachfrage in Deutschland schwankt", "text": "Geopolitische Unsicherheiten im Nahen Osten beschleunigen laut Marktbeobachtern den Umstieg deutscher Kaeufer auf E-Autos, waehrend parallel Hybridmodelle wieder staerker nachgefragt werden. Gleichzeitig kuendigt Grossbritannien an, sein EV-Mandat zu lockern, was Herstellern mehr Flexibilitaet verschafft.", "url": "https://electrificationcoalition.org/ev-news-august-2026/", "urlLabel": "Electrification Coalition"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Euro NCAP 2026: Neue Bewertungskriterien fuer HV-Batteriesicherheit", "text": "Die im Januar 2026 eingefuehrten Euro-NCAP-Protokolle vergeben erstmals Punkte fuer Systeme, die einen thermischen Durchgehprozess (Thermal Runaway) der Batterie erkennen und automatisch den Rettungsdienst alarmieren. Ergaenzend gelten verschaerfte Crashtests und neue Vorgaben zur Batteriedauerhaltbarkeit.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "hv", "label": "Hochvoltsysteme", "title": "Aktualisierte VDE-Anwendungsregeln fuer Ladeinfrastruktur", "text": "Seit Maerz 2026 gelten ueberarbeitete VDE-Anwendungsregeln 4105 und 4100 fuer den Netzanschluss von Erzeugungsanlagen im Niederspannungsnetz. Neu ist zudem eine verpflichtende netzdienliche Steuerung fuer Grossverbraucher wie Wallboxen, was fuer Werkstaetten und Errichter praktische Konsequenzen hat.", "url": "https://www.ad-hoc-news.de/boerse/news/ueberblick/neue-regeln-und-normen-so-wird-das-e-auto-2026-sicherer/69054506", "urlLabel": "ad-hoc-news.de"}, {"cat": "branche", "label": "Branche / Zulieferer", "title": "Deutsche Zulieferer zwischen Schock und Umbruch", "text": "Laut aktueller Oliver-Wyman-Studie stehen deutsche Automobilzulieferer 2026 vor strukturellen statt zyklischen Problemen: hohe Standort- und Transformationskosten, Volumenverluste an asiatische Wettbewerber und die parallele Investition in Verbrenner- und BEV-Technologie. Die EBIT-Margen liegen 2025 vielfach unter 5 Prozent.", "url": "https://www.oliverwyman.de/unsere-expertise/publikationen/2026/march/automobilzuliefererstudie-2026-zwischen-schock-und-gestaltungsspielraum.html", "urlLabel": "Oliver Wyman"}, {"cat": "branche", "label": "Branche / Software", "title": "Software-Defined Vehicles erhoehen Systemanforderungen an Zulieferer", "text": "OEMs fordern zunehmend integrierte Loesungen statt Einzelkomponenten und verlangen von Zulieferern hoehere Systemkompetenz sowie Integrationsfaehigkeit in digitale Fahrzeugarchitekturen. Elektrifizierung, SDV-Trends und Lieferkettenvolatilitaet wirken 2026 gleichzeitig auf die Branche.", "url": "https://abas-erp.com/en/blog/automotive-industry-trends", "urlLabel": "abas-erp.com"}, {"cat": "branche", "label": "Branche / EU-Regulierung", "title": "EU weicht Verbrenner-Aus 2035 auf, Mindestpreissystem fuer China-EVs", "text": "Das im Dezember vorgelegte Automobilpaket der EU-Kommission sieht eine Aufweichung des faktischen Verbrenner-Ausstiegs 2035 um zehn Prozent vor. Parallel greift seit Januar ein Mindestpreissystem fuer chinesische E-Autos, um Strafzoelle zu vermeiden und den europaeischen Markt zu schuetzen.", "url": "https://automobilsalon-bellemann.de/news/eu-china-mindestpreis-system-2026-was-fuer-kaeufer-zaehlt/", "urlLabel": "automobilsalon-bellemann.de"}], "beratung": "Der EU-Marktanteil von 20 Prozent bei BEVs und die gleichzeitige Aufweichung des Verbrenner-Ausstiegs zeigen: Webshop-Sortimente fuer Ersatzteile sollten auf eine laengere Koexistenz von Verbrenner-, Hybrid- und BEV-Technik ausgelegt bleiben, statt einseitig auf reine E-Antriebe zu setzen. Fuer Zulieferer und Haendler wird Systemkompetenz statt Einzelteilverkauf zum Differenzierungsmerkmal, gerade angesichts des Margendrucks bei deutschen Zulieferern.", "hvtraining": "Die neuen Euro-NCAP-Kriterien zur Thermal-Runaway-Erkennung erhoehen den Schulungsbedarf zu Batteriediagnose und Rettungsprozessen bei Werkstaetten und Rettungsdiensten. Auch die aktualisierten VDE-Regeln 4100/4105 zur netzdienlichen Steuerung von Wallboxen sollten in HV-Trainings fuer Errichter und Servicetechniker aufgenommen werden."}];
/* BRIEFINGS_DATA_END */
let currentDate=BRIEFINGS[0]?BRIEFINGS[0].date:null,currentFilter='all';
function fmtDate(iso){const d=new Date(iso+'T12:00:00');const days=['So','Mo','Di','Mi','Do','Fr','Sa'];return days[d.getDay()]+' '+d.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit'});}
function buildTabs(){const el=document.getElementById('dateTabs');if(!BRIEFINGS.length){el.innerHTML='<span style="color:#aeaeb2;font-size:12px">Noch keine Daten</span>';return;}el.innerHTML=BRIEFINGS.map(b=>`<span class="dpill${b.date===currentDate?' active':''}" onclick="selectDay('${b.date}')">${fmtDate(b.date)}</span>`).join('');}
function selectDay(date){currentDate=date;currentFilter='all';document.querySelectorAll('.tag').forEach(t=>t.classList.remove('inactive'));buildTabs();renderCards();}
function setFilter(cat){currentFilter=cat;document.querySelectorAll('.tag').forEach(t=>{t.classList.toggle('inactive',!t.classList.contains(cat)&&!(cat==='all'&&t.classList.contains('all')));});renderCards();}
function renderCards(){const day=BRIEFINGS.find(b=>b.date===currentDate);const cardsEl=document.getElementById('cards');const hlEl=document.getElementById('highlight');if(!day){cardsEl.innerHTML='<p class="empty">Keine Daten verfuegbar.</p>';hlEl.style.display='none';return;}const cards=day.cards.filter(c=>currentFilter==='all'||c.cat===currentFilter);cardsEl.innerHTML=cards.length?cards.map(c=>`<div class="card ${c.cat}" data-cat="${c.cat}"><div class="card-label">${c.label}</div><h2>${c.title}</h2><p>${c.text}</p><a class="source" href="${c.url}" target="_blank">&#8599; ${c.urlLabel}</a></div>`).join(''):'<p class="empty">Keine Meldungen in dieser Kategorie.</p>';hlEl.style.display='block';document.getElementById('hlBeratung').textContent=day.beratung;document.getElementById('hlHV').textContent=day.hvtraining;}
buildTabs();renderCards();
</script></body></html>
